      KOR_TRAVEL_MAP_KMA_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_MAP_DOCKER_KMA_MAX_GRIDS:-80}
      KOR_TRAVEL_MAP_KMA_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_MAP_DOCKER_KMA_WEATHER_EXTRA_POINTS:-126.978,37.566;127.047,37.517;126.979,37.573;126.924,37.521;127.011,37.64;129.075,35.18;129.16,35.163;129.024,35.098;126.705,37.456;126.66,37.383;128.601,35.871;128.637,35.857;127.385,36.35;127.34,36.362;126.852,35.16;129.311,35.539;127.289,36.48;127.029,37.263;127.138,37.42;126.832,37.658;127.178,37.241;126.766,37.503;127.734,37.881;128.896,37.752;127.92,37.342;128.591,38.207;127.489,36.642;127.926,36.991;127.114,36.815;127.004,36.79;127.148,35.821;126.737,35.978;127.662,34.76;127.487,34.951;126.392,34.812;129.365,36.019;129.225,35.856;128.729,36.568;128.682,35.228;128.108,35.18;128.434,34.854;126.531,33.499;126.566,33.254;128.889,35.234;126.864,37.478;126.821,37.322;127.113,36.992;126.958,35.948;128.114,36.14;128.621,34.88;126.2838,36.673;127.4416,35.4118;128.7527,37.3221;129.4045,36.9182;127.9057,35.7043;126.0097,37.4346;126.7659,34.2899;127.7243,35.5217;128.9902,37.1551;130.9057,37.4845}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KRTOUR_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KRTOUR_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KRTOUR_MAP_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_DOCKER_GEO_BASE_URL:-http://127.0.0.1:12501}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL:-http://127.0.0.1:12601}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY:-}
      # 서울 열린데이터광장은 data.go.kr과 **다른 포털이고 키도 다르다**.
