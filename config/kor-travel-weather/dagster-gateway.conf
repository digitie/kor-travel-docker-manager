# Manager가 소유하는 weather deploy/nginx/dagster-gateway.conf 오버라이드.
# weather 자신의 원본은 upstream을 `dagster-webserver:14102`(compose 서비스명
# DNS)로 잡는데, 그 이름은 network_mode: host에서 해석되지 않고, 이 포트는
# 이 컨테이너 자신의 14102 listen과도 충돌한다. dagster-webserver의 새 내부
# 전용 loopback 포트(14107)로 바꾼 것 외에는 전부 동일하다. 이 서버 자신의
# 공개 listen 포트는 ADR-49로 14102 → 12202로 재배정됐다.
map $http_origin $dagster_same_origin {
    default 0;
    "https://weather-dagster.digitie.mywire.org" 1;
    "http://127.0.0.1:12202" 1;
    "http://localhost:12202" 1;
}

map "$request_method:$dagster_same_origin" $dagster_csrf_block {
    default 0;
    "POST:0" 1;
}

server {
    listen 12202;
    server_name _;
    set $dagster_upstream http://127.0.0.1:14107;

    auth_basic "kor-travel-weather Dagster";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        if ($dagster_csrf_block) { return 403; }
        proxy_pass $dagster_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
