      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY}
  pinvi-api:
    image: ${PINVI_API_IMAGE:-pinvi-api:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/api/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
    container_name: ${PINVI_API_CONTAINER:-pinvi-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kor-travel-map-api:
        condition: service_healthy
    command:
    # PinVi realtime broker is process-local until a shared broker lands.
    # Keep the API at one worker unless the deployment has a broker-compatible override.
    # DB migration/admin bootstrap은 `pinvi-admin-bootstrap` one-shot만 소유한다.
    # normal API는 schema mutation을 수행하지 않는다.
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - ${PINVI_API_PORT:-12801}
    - --workers
    - ${PINVI_API_WORKERS:-1}
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:?PINVI_ENVIRONMENT must be explicitly set}
      PINVI_API_WORKERS: ${PINVI_API_WORKERS:-1}
      PINVI_DATABASE_URL: ${PINVI_DOCKER_DATABASE_URL:-postgresql+asyncpg://pinvi:pinvi_dev_password@127.0.0.1:12800/pinvi}
      PINVI_JWT_SECRET_KEY: ${PINVI_JWT_SECRET_KEY:-pinvi-local-jwt-secret-32-bytes-minimum}
      PINVI_RESEND_API_KEY: ${PINVI_RESEND_API_KEY:-}
      PINVI_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      PINVI_RUSTFS_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_PORT:-12101}
      PINVI_RUSTFS_BUCKET: ${PINVI_RUSTFS_BUCKET:-pinvi-media}
      PINVI_RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      PINVI_RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      PINVI_CORS_ALLOWED_ORIGINS: '${PINVI_CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:12805","http://localhost:12805"]}'
      # PinVi production Settings는 import 시 이 Map capability pair를 검증한다.
      PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_API_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_API_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      # 이 두 원시 token은 ordinary PinVi API만 소비한다. Manager가 digest를 Map
      # API에 파생하고 다른 PinVi/Map service로의 누출을 fail-close한다.
      PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN:-}
    ports:
    - ${PINVI_API_PORT:-12801}:${PINVI_API_PORT:-12801}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:${PINVI_API_PORT:-12801}/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  # C1의 migration + fresh-admin bootstrap command는 C2 rebuild transaction이
  # `docker compose --profile bootstrap run`으로만 호출한다. credential file의
  # 경로는 execution-time environment와 read-only mount로 전달하므로, 정적
  # Compose 및 normal PinVi runtime의 inspect metadata에는 존재하지 않는다.
  pinvi-admin-bootstrap:
    profiles:
    - bootstrap
    image: ${PINVI_API_IMAGE:-pinvi-api:latest-main}
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
    command:
    - pinvi-admin-bootstrap
    environment:
      # one-shot도 API와 같은 production Settings를 import하므로 필요한 Map 검증값만 둔다.
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:?PINVI_ENVIRONMENT must be explicitly set}
      PINVI_DATABASE_URL: ${PINVI_DOCKER_DATABASE_URL:-postgresql+asyncpg://pinvi:pinvi_dev_password@127.0.0.1:12800/pinvi}
      PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
  pinvi-web:
    image: ${PINVI_WEB_IMAGE:-pinvi-web:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/web/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
        NEXT_PUBLIC_PINVI_API_URL: ${PINVI_PUBLIC_API_URL:-http://127.0.0.1:12801}
    container_name: ${PINVI_WEB_CONTAINER:-pinvi-web-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - npx
    - next
    - start
    - -p
    - '${PINVI_WEB_PORT:-12805}'
    - -H
    - 0.0.0.0
    depends_on:
      pinvi-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_PINVI_API_URL: ${PINVI_PUBLIC_API_URL:-http://127.0.0.1:12801}
    ports:
    - ${PINVI_WEB_PORT:-12805}:${PINVI_WEB_PORT:-12805}
  pinvi-dagster:
    image: ${PINVI_DAGSTER_IMAGE:-pinvi-dagster:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/etl/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
    container_name: ${PINVI_DAGSTER_CONTAINER:-pinvi-dagster-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      pinvi-api:
        condition: service_healthy
    command:
    - dagster-webserver
    - -h
    - 0.0.0.0
    - -p
    - '${PINVI_DAGSTER_PORT:-12802}'
    - -m
    - pinvi.etl.definitions
    environment:
      DAGSTER_HOME: /opt/pinvi/.dagster
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      PINVI_DAGSTER_PORT: ${PINVI_DAGSTER_PORT:-12802}
      PINVI_DATABASE_URL: ${PINVI_DOCKER_DATABASE_URL:-postgresql+asyncpg://pinvi:pinvi_dev_password@127.0.0.1:12800/pinvi}
    ports:
    - ${PINVI_DAGSTER_PORT:-12802}:${PINVI_DAGSTER_PORT:-12802}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('PINVI_DAGSTER_PORT', '12802'), timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.1}
    container_name: ${PROMETHEUS_CONTAINER:-kor-travel-prometheus}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    user: ${PROMETHEUS_RUN_AS_USER:-0}
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    - --web.listen-address=:${PROMETHEUS_PORT:-12401}
    ports:
    - ${PROMETHEUS_PORT:-12401}:${PROMETHEUS_PORT:-12401}
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ${PROMETHEUS_DATA_DIR:-/home/digitie/kor-travel-geo-data/prometheus}:/prometheus
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.4}
    container_name: ${GRAFANA_CONTAINER:-kor-travel-grafana}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    user: ${GRAFANA_RUN_AS_USER:-0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-12205}
    ports:
    - ${GRAFANA_PORT:-12205}:${GRAFANA_PORT:-12205}
    volumes:
    - ${GRAFANA_DATA_DIR:-/home/digitie/kor-travel-geo-data/grafana}:/var/lib/grafana
    - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: ${CADVISOR_CONTAINER:-kor-travel-cadvisor}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    command:
    - --logtostderr
    - --docker_only=true
    - --port=${CADVISOR_PORT:-12301}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:${CADVISOR_PORT:-12301}/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
    - ${CADVISOR_PORT:-12301}:${CADVISOR_PORT:-12301}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
  # --- geo 독립 Dagster (T-290, ADR-066) ---------------------------------------
  # geo 전용 Dagster webserver + daemon + 메타 DB init. 앱 DB(kor_travel_geo)는
  # 절대 건드리지 않고 별도 DB kor_travel_geo_dagster에 run/event/schedule 이력을 둔다.
  # 포트 12502 (docs/ports.md: geo 125xx 블록의 worker/aux 슬롯; map 12702·concierge 12602 패턴).
  kor-travel-geo-dagster-db-init:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_DB_INIT_CONTAINER:-kor-travel-geo-dagster-db-init}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-geo-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr}
      PGPASSWORD: ${KOR_TRAVEL_GEO_POSTGRES_PASSWORD:-addr}
      KOR_TRAVEL_GEO_DAGSTER_DB: ${KOR_TRAVEL_GEO_DAGSTER_DB:-kor_travel_geo_dagster}
    command:
    - sh
    - -c
    - createdb -h 127.0.0.1 -p "$${KOR_TRAVEL_GEO_DB_PORT:-12500}" "$${KOR_TRAVEL_GEO_DAGSTER_DB}" 2>/dev/null || true
  kor-travel-geo-dagster:
    image: ${KOR_TRAVEL_GEO_DAGSTER_IMAGE:-kor-travel-geo-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: kor-travel-geo-dagster/docker/dagster.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_CONTAINER:-kor-travel-geo-dagster-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-geo-dagster-db-init:
        condition: service_completed_successfully
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KTG_DAGSTER_PORT: ${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}
      KTG_DAGSTER_PG_URL: ${KOR_TRAVEL_GEO_DAGSTER_PG_URL:-postgresql://addr:addr@127.0.0.1:12500/kor_travel_geo_dagster}
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:-postgresql+psycopg://addr:addr@127.0.0.1:12500/kor_travel_geo}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # T-290 on-ramp (kor-travel-geo #444): the scheduled_backup Dagster run calls the
      # geo admin API (POST /v1/admin/backups/scheduled/run-due) and must present the
      # admin proxy secret the API expects, else the run-due call 403s.
      # KTG_DAGSTER_ADMIN_API_URL defaults to the host-network geo-api.
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_DAGSTER_ADMIN_API_URL: ${KOR_TRAVEL_GEO_DAGSTER_ADMIN_API_URL:-http://127.0.0.1:12501}
    # T-290g: the db_backup op executes in this webserver container and writes the backup to
    # /app/data/backups — mount the SAME shared host dir as geo-api so the artifact is
    # restorable/downloadable/verifiable there.
    volumes:
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups
    # Public routing (external/manual, no compose label): the LAN router reverse-proxies
    # https://geo-dagster.example.org/ (TLS termination) -> this host 127.0.0.1:12502,
    # same pattern as the other services' *.digitie.mywire.org domains. The geo-api echoes
    # that public URL to the admin UI via KTG_DAGSTER_PUBLIC_URL (T-290).
    ports:
    - ${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}:${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('KTG_DAGSTER_PORT', '12502'), timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kor-travel-geo-dagster-daemon:
    image: ${KOR_TRAVEL_GEO_DAGSTER_IMAGE:-kor-travel-geo-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: kor-travel-geo-dagster/docker/dagster.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_DAEMON_CONTAINER:-kor-travel-geo-dagster-daemon-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-geo-dagster-db-init:
        condition: service_completed_successfully
    command:
    - dagster-daemon
    - run
    - -m
    - kortravelgeo_dagster.definitions
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KTG_DAGSTER_PG_URL: ${KOR_TRAVEL_GEO_DAGSTER_PG_URL:-postgresql://addr:addr@127.0.0.1:12500/kor_travel_geo_dagster}
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:-postgresql+psycopg://addr:addr@127.0.0.1:12500/kor_travel_geo}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # T-290 on-ramp (kor-travel-geo #444): the daemon shares the code-location image
      # and can execute the scheduled_backup run, which calls the geo admin API
      # (POST /v1/admin/backups/scheduled/run-due). It must present the admin proxy
      # secret the API expects, else the run-due call 403s.
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_DAGSTER_ADMIN_API_URL: ${KOR_TRAVEL_GEO_DAGSTER_ADMIN_API_URL:-http://127.0.0.1:12501}
    # T-290g: same shared backup dir as the webserver/api, so a db_backup run launched here
    # (or a leaf executed in this container) writes artifacts the geo-api can restore.
    volumes:
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups

secrets:
  kor-travel-map-postgres-password:
    environment: KOR_TRAVEL_MAP_POSTGRES_PASSWORD
