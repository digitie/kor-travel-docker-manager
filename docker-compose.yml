      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-}
      # OpiNet에는 전국 목록(bulk) 엔드포인트가 없어서 **scope를 골라야** 적재가
      # 시작된다. 이 줄들이 없으면 설정이 기본값 `disabled`로 떨어지고 job이
      # `ProviderCredentialMissing: opinet 적재 비활성(opinet_scope_mode=disabled)`로
      # 실패한다 — 2026-09-18 prod에서 place·price 두 job이 그 상태였다.
      # Map 저장소 자신의 compose에는 이 셋이 배선돼 있는데 여기에는 없었다
      # (KREX go key와 **같은 형태의 구멍**이다).
      #
      # 운영 모드는 `low_top_area`다(2026-09-19 결정). 기본값을 `disabled`로
      # 두면 배포가 끝나도 적재가 켜지지 않아 호스트 `.env`를 손으로 고쳐야
      # 했다 — 그 손 편집이 prod와 이 문서를 어긋나게 만든 자리다. 끄려면
      # `.env`에서 `disabled`로 덮는다.
      #
      # `low_top_area`는 시군구별 `lowTop10`을 로테이션으로 돈다. 아래 두 노브는
      # 그 모드의 호출량 상한이라 함께 넘긴다 — 무료키 일일 한도가 300회이고
      # (일반 19종 기준, 2026-09-14 확인) 매월 1일에는 place job이 같은 경로를
      # 한 번 더 돌아 여유가 좁아진다. 노브가 compose에 없으면 그때 조정하려고
      # 또 이 파일을 고쳐야 한다.
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-low_top_area}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS: ${KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS:-${OPINET_LOW_TOP_MAX_CALLS:-90}}
      KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET: ${KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET:-${OPINET_RUN_CALL_BUDGET:-140}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-}
      # KREX의 go key는 data.go.kr service key와 **같은 값**이다(python-krex-api의
      # `.env`에서 `KEX_GO_API_KEY`와 `DATA_GO_KR_SERVICE_KEY`가 같은 다이제스트임을
      # 실측했다). 이 줄에 폴백이 없어 prod에서 빈 값이었고(`.env`에는 `KRTOUR_` 접두의
      # 이름만 있다), `feature_place_krex_rest_areas_job`이 자격증명 없이 돌았다.
      # 위 `KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY`와 **같은 원천**으로 떨어뜨린다 —
      # 새 비밀을 만들지 않는다.
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${KRTOUR_MAP_DATA_GO_KR_SERVICE_KEY:-}}
      # issue #114 — reverse_geocoder가 전역 필수 리소스라 이 key 없이는 geocode 관련
      # provider ETL job 전체가 GeoAuthNotConfiguredError로 fail-close된다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY}
    volumes:
    - ${KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DIR:?KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DIR must be explicitly set}:/run/kor-travel-map-application-final-permit:ro
    - ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR must be explicitly set}:/run/kor-travel-map-dagster-storage-permit:ro
    ports:
    - ${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}:${KOR_TRAVEL_MAP_DAGSTER_CONTAINER_PORT:-12702}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, json, urllib.request as u; p = os.environ.get('KOR_TRAVEL_MAP_DAGSTER_PORT', '12702'); q = json.dumps({'query': '{repositoriesOrError{__typename}}'}).encode(); r = u.urlopen(u.Request('http://127.0.0.1:%s/graphql' % p, data=q, headers={'Content-Type': 'application/json'}), timeout=5); d = json.load(r); t = d.get('data', {}).get('repositoriesOrError', {}).get('__typename'); raise SystemExit(0 if t == 'RepositoryConnection' else 'code location not loaded: %s' % t)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  # C0의 candidate-image storage migration command를 Manager runtime에도
  # 명시한다. 이 service는 Map Dagster web image를 그대로 사용하므로 여덟 번째
  # runtime image를 만들지 않으며, build는 candidate generation builder가 소유한다.
  kor-travel-map-dagster-storage-migrate:
    image: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:-kor-travel-map-dagster:latest-main}
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
    command:
    - /usr/local/bin/ktm-dagster-storage
    - migrate
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_DAGSTER_PG_URL must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256 must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256 must be explicitly set}
    volumes:
    - ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR must be explicitly set}:/run/kor-travel-map-dagster-storage-permit:ro
    # C0의 external-DB overlay와 같은 candidate image가 host gateway DSN도
    # 해석할 수 있게 한다. host network를 쓰는 기본 경로에는 영향이 없다.
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-map-dagster-daemon:
    image: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:-kor-travel-map-dagster:latest-main}
    container_name: ${KOR_TRAVEL_MAP_DAGSTER_DAEMON_CONTAINER:-kor-travel-map-dagster-daemon-latest}
    restart: unless-stopped
    # **회수 기제가 살아 있는지 본다.**
    #
    # `run_monitoring`(프로세스가 사라진 run을 회수)과 queued run dequeue는 전부 이
    # 프로세스 안의 스레드다. 그런데 이 서비스에는 healthcheck가 없었다 — 같은 스택의
    # webserver와 api는 갖고 있다. 그리고 daemon controller의 `check_daemon_threads`는
    # 스레드 하나가 죽으면 프로세스를 **스스로 끝낸다**.
    #
    # 그래서 두 실패가 조용했다. (a) 프로세스가 나가면 `restart: unless-stopped`가
    # 되살리지만 그 사이 회수 기제가 없었다는 사실은 어디에도 남지 않는다.
    # (b) 스레드가 살아 있으면서 끼이면 heartbeat만 낡는데 — controller는 그것에
    # warning만 남기고 프로세스를 끝내지 않는다 — 그것을 보는 것이 아무것도 없다.
    # 형제 프로젝트 `kor-travel-weather`가 (a) 계열로 18시간 정지했다.
    #
    # `dagster-daemon liveness-check`는 dagster가 제공하는 정식 판정이다.
    # `all_daemons_live`가 **required daemon 전부**의 heartbeat 신선도를 보고
    # (`ignore_errors=True` — 오류 유무가 아니라 살아 있는지만) 하나라도 낡으면 exit 1.
    #
    # **유예를 명시한다.** 기본값은 `DEFAULT_DAEMON_HEARTBEAT_TOLERANCE_SECONDS = 1800`
    # 이고 판정식이 `now <= heartbeat + interval(30) + tolerance`이므로, 그대로 두면
    # (b)를 **31분 뒤에** 알게 된다 — interval·retries를 어떻게 줄여도 그 지연은
    # 줄지 않는다. 300을 고른 근거는 임의값이 아니다: dagster 자신이 같은 controller
    # 에서 `DEFAULT_WORKSPACE_FRESHNESS_TOLERANCE = 300`을 "이만큼 낡으면 계속할 수
    # 없다"로 쓴다. daemon loop의 정상 heartbeat 간격은 15~30초이므로 10~20배 여유다.
    #
    # heartbeat는 metadata DB에 있어 이 검사는 DB까지 왕복한다. interval을 web(10s)
    # 보다 길게 두고 start_period로 기동 창(code location 로딩 포함)을 준다.
    healthcheck:
      test: ["CMD-SHELL", "dagster-daemon liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      # daemon도 web readiness의 transitive 의존만 믿지 않는다. candidate
      # storage migration의 성공을 직접 predecessor로 고정한다.
      kor-travel-map-dagster-storage-migrate:
        condition: service_completed_successfully
      kor-travel-map-dagster:
        condition: service_healthy
    command:
    - /usr/local/bin/dagster-daemon
    - run
    - -m
    - kortravelmap.dagster.definitions
    environment:
      DAGSTER_DAEMON_HEARTBEAT_TOLERANCE: ${DAGSTER_DAEMON_HEARTBEAT_TOLERANCE:-300}
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_DAGSTER_PG_URL must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256 must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256 must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_ADDRESS_VALIDATION: ${KOR_TRAVEL_MAP_DOCKER_ADDRESS_VALIDATION:-drop}
