global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 네트워크 host 모드 기준: 각 서비스는 호스트 정규 포트에 직접 바인딩되므로
# scrape target은 컨테이너명이 아닌 127.0.0.1:<호스트 포트>를 사용한다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:12102

  - job_name: cadvisor
    static_configs:
      - targets:
          - 127.0.0.1:12103

  - job_name: kor-travel-docker-manager
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:12901

  - job_name: kor-travel-geo-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:12501

  - job_name: kor-travel-geo-ui
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - 127.0.0.1:12505

  # odroid(192.168.1.13) exporter — ADR-58 결정 11 "n150 중앙 Prometheus, odroid에는 exporter만".
  # 임시 최소 반영(소유자 2026-10-14): 주소 리터럴이다. T-MGR-04가 registry `hosts:`에서 파생한 커밋된
  # 파생물(B-8)로 대체한다 — 그때 이 두 job은 그 파생 테스트의 대상이 된다.
  - job_name: cadvisor-odroid
    static_configs:
      - targets:
          - 192.168.1.13:12103
        labels:
          host: odroid

  - job_name: node-odroid
    static_configs:
      - targets:
          - 192.168.1.13:12106
        labels:
          host: odroid
