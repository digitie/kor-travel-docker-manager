map $http_origin $dagster_same_origin {
    default 0;
    "https://weather-dagster.digitie.mywire.org" 1;
    "http://127.0.0.1:14102" 1;
    "http://localhost:14102" 1;
}

map "$request_method:$dagster_same_origin" $dagster_csrf_block {
    default 0;
    "POST:0" 1;
}

server {
    listen 14102;
    server_name _;
    set $dagster_upstream http://127.0.0.1:14106;

    auth_basic "kor-travel-weather Dagster";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Dagster's GraphQL endpoint accepts mutations. Require a browser
    # same-origin marker for POSTs so cached Basic credentials cannot be used
    # by a cross-site form/fetch. The authenticated Next proxy talks directly
    # to the internal dagster service and is not routed through this gateway.
    location / {
        if ($dagster_csrf_block) { return 403; }
        proxy_pass $dagster_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
