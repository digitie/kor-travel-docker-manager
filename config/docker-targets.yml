targets:
  storage:
    port_band: "12100-12199"
    depends_on: []
    display_name: 통합 RustFS
    description: Kor Travel/PinVi 미디어와 원천 데이터를 저장하는 S3 호환 오브젝트 스토리지입니다.
    aliases:
      - rustfs
      - s3
      - object-storage
    services:
      - rustfs
    runtime_services:
      - rustfs
    containers:
      - rustfs
    init_steps:
      - name: rustfs-bucket-recovery
        description: RustFS 기동을 기다린 뒤 공용 bucket을 idempotent 방식으로 보정합니다.
        command:
          - run
          - --rm
          - rustfs-init

  gra:
    port_band: "12200-12299"
    depends_on: [storage]
    display_name: 공용 Grafana
    description: 다른 Kor Travel 앱에서도 공통 연계하는 Grafana Web UI입니다.
    aliases:
      - grafana
      - dashboard
      - visualization
    services:
      - grafana
    runtime_services:
      - grafana
    containers:
      - grafana
    init_steps: []

  cadv:
    # 이 대역은 이름뿐이다 — cAdvisor는 ADR-48로 12103에 있다. 대역 안 12301·12302·12305는
    # Manager에 등록되지 않은 외부 compose 프로젝트 `kor-travel-transport-admin`이 쓴다
    # (0.0.0.0 listen, 2026-09-28 n150 실측). 여기에 포트를 새로 배정하지 않는다(ports.md).
    port_band: "12300-12399"
    depends_on: [gra]
    display_name: cAdvisor Exporter
    description: Docker 컨테이너 리소스 메트릭을 Prometheus 형식으로 노출합니다.
    aliases:
      - cadvisor
      - exporter
      - metrics-exporter
    services:
      - cadvisor
    runtime_services:
      - cadvisor
    containers:
      - cadvisor
    init_steps: []

  prom:
    port_band: "12400-12499"
    depends_on: [cadv]
    display_name: Prometheus
    description: cAdvisor와 앱 메트릭을 수집하고 Grafana datasource로 제공하는 메트릭 저장소입니다.
    aliases:
      - prometheus
      - metrics
      - monitoring
    services:
      - prometheus
    runtime_services:
      - prometheus
    containers:
      - prometheus
    init_steps: []

  geo:
    port_band: "12500-12599"
    depends_on: [prom]
    display_name: Kor Travel Geo
    description: Kor Travel Geo API/Web UI와 원천 데이터 적재 상태를 관리합니다.
    aliases:
      - kor-travel-geo
      - kor-travel-geo-api
      - geocoder
      - reverse-geocoder
    # geo는 ADR-45에 따라 공용 instance(kor-travel-shared-postgres, :11000)를 쓴다.
    # 구 전용 instance(:12500)는 2026-09-28에 Manager에서 뺐다.
    services:
      - kor-travel-shared-postgres
      - kor-travel-shared-db-init-geo
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-geo-dagster-code-server
    # 옛 webserver·daemon은 공용 plane 전환(ADR-54)으로 `legacy-dagster` profile에 있다 — `up`에 이름을 주면
    # 꺼진 profile도 뜨므로 `services`·`runtime_services`에서 뺐다. `containers`에는 남아 상태 화면이
    # 찾는다(되돌리기는 지원하지 않는다 — platform-topology.md §7 4단계).
    runtime_services:
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-geo-dagster-code-server
    containers:
      - kor-travel-shared-postgresql
      - rustfs
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-geo-dagster
      - kor-travel-geo-dagster-daemon
      - kor-travel-geo-dagster-code-server
    init_steps: []
    # 공용 Dagster 제어 평면(ADR-54)에 합류했는가. code-server(`dagster code-server start`)를 가진 target은 모두
    # 이 필드를 적는다. `own`은 자기 webserver·daemon·메타DB, `shared`는 공용 plane이다.
    # `shared`로 바꾸는 PR은 같은 커밋에서 compose를 그 모양으로 바꾼다 — code-server가 공용 URL 앵커와
    # 공용 `dagster.yaml`을 받고, 아래 `consumers`가 공용 webserver·공개 host를 가리키고, 이 target의
    # webserver·daemon(과 그것에 기대는 gateway)은 `profiles: [legacy-dagster]`로 내려 target의
    # `services`·`runtime_services`에서 빠진다. 그리고 `config/dagster-shared/workspace.yaml`에 항목
    # 하나가 생긴다(파생). 어느 하나라도 빠지면 `test_dagster_shared_workspace_is_derived.py`가 무엇이
    # 빠졌는지 말한다. 순서는 platform-topology.md §7 3단계의 전환 runbook이다.
    #
    # `consumers`: 이 target의 Dagster를 부르는 env(서비스 → env → 종류). 앱 코드의 기본값에 기대어
    # compose에 아직 없는 env도 있어 compose만으로는 찾을 수 없다 — 그래서 여기 적는다. 종류는
    # `internal`(공용 webserver `http://127.0.0.1:11002`), `public`(공개 host `KTDM_PROD_URL_DAGSTER`),
    # 뒤에 경로를 붙일 수 있다(`public/graphql`).
    dagster:
      control_plane: shared
      consumers:
        kor-travel-geo-api:
          KTG_DAGSTER_URL: internal
          KTG_DAGSTER_PUBLIC_URL: public

  conc:
    port_band: "12600-12699"
    depends_on: [prom]
    display_name: Kor Travel Concierge
    description: Kor Travel Concierge API/MCP/공용 Dagster code-server/Web UI를 실행합니다. geo에는 의존하지 않는다.
    aliases:
      - kor-travel-concierge
      - concierge
      - agent
      - conc
    # concierge는 platform-topology.md §7에 따라 공용 instance(kor-travel-shared-postgres,
    # :11000)를 쓴다. 구 전용 instance(:12600)는 2026-09-28에 Manager에서 뺐다.
    services:
      - kor-travel-shared-postgres
      - kor-travel-shared-db-init-concierge
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-dagster-code-server
      - kor-travel-concierge-ui
    runtime_services:
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-dagster-code-server
      - kor-travel-concierge-ui
    containers:
      - kor-travel-shared-postgresql
      - rustfs
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-dagster-code-server
      - kor-travel-concierge-ui
    init_steps: []
    dagster:
      control_plane: shared
      consumers:
        kor-travel-concierge-api:
          KTC_DAGSTER_URL: internal
          KTC_DAGSTER_PUBLIC_URL: public

  map:
    port_band: "12700-12799"
    depends_on: [geo, conc]
    display_name: Kor Travel Map
