name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # PR synchronize 이벤트가 지연·유실돼도 exact branch head를 다시 검증할 수 있는
  # recovery 진입점이다. release/E2E 권한을 주지 않고 같은 read-only CI만 실행한다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: python -m pip install --upgrade -c backend/constraints.txt pip && python -m pip install -c backend/constraints.txt -e ./backend httpx==0.28.1 pytest==9.2.0 ruff==0.17.6 && python -m pip check
      - name: 린트
        run: python -m ruff check --ignore EXE001 backend/src backend/tests scripts
      - name: 테스트
        env:
          TMPDIR: /tmp
        run: python -m pytest -q backend/tests

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --engine-strict
      - name: 공통 의존성 검증
        run: npm run check:dependencies
      - name: React Doctor
        run: npm run doctor
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run type-check
      - name: 단위 테스트
        run: npm run test
      - name: 빌드
        run: npm run build
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 공통 UI 브라우저 회귀
        run: npm run test:e2e
      # 셸·버튼 상태 스크린샷(PC 1280·모바일 390)을 리뷰에서 볼 수 있게 남긴다.
      - name: 브라우저 회귀 스크린샷
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-screenshots
          path: .git/ui-e2e/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14


  python-application-policy:
    name: 공통 backend 애플리케이션 정책
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: consumer
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: digitie/kor-travel-common
          ref: 8a0ec23c206648ae5d81f365748f66d5ca6047f1
          path: common-policy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: 실제 backend exact 선언 검증
        run: python common-policy/tools/check_versions.py consumer/backend --repo kor-travel-docker-manager --strict-python-application --constraints constraints.txt --json backend-application-policy.json
