name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest ruff
      - name: 린트
        run: python -m ruff check backend/src backend/tests scripts
      - name: 테스트
        env:
          TMPDIR: /tmp
        run: python -m pytest -q backend/tests

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run type-check
      - name: 빌드
        run: npm run build
