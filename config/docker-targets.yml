  transport:
    # 형제 프로젝트다 — compose 정본이 이 저장소 밖(kor-travel-transport 저장소)에
    # 있고, 배포는 그 저장소가 계속 소유한다. Manager는 상태를 보고 컨테이너
    # 수명주기(start/stop/restart)만 다룬다. DB는 공용 instance
    # (kor-travel-shared-postgres, :11000)의 kor_travel_transport database다.
    # 이 target의 옛 이름(`airport`)과 옛 compose 프로젝트 이름은 별칭으로 남기지
    # 않는다(2026-09-28 소유자 결정) — 옛 이름을 쓰는 호출이 남아 있으면 조용히
    # 통하는 대신 `unknown target`으로 드러난다.
    # 운영 배포는 `docker-compose.yml` + `docker-compose.shared.yml`(`--env-file
    # .env.server14`)로 올라간다(컨테이너의 compose label 실측). 아래 `config_files`가
    # base 하나뿐인 것은 의도다 — shared overlay는 `${…:?}` 필수 보간이라 env 파일 없이
    # 열면 실패하고, `ps`·`logs`는 base만으로 같은 컨테이너를 찾는다. overlay를 더하는
    # 일은 transport ADR-010 후속(별도 설계)이다.
    external_project:
      project: kor-travel-transport
      working_dir: /home/digitie/apps/kor-travel-transport
      config_files:
        - docker-compose.yml
    port_band: "14001-14099"
    depends_on: []
    display_name: Kor Travel Transport
    description: 통합 교통정보 서비스입니다(공항 주차 현황 등). 백엔드(:14001)와 프런트엔드(:14002)로 구성되며 DB는 공용 instance(:11000)의 kor_travel_transport database에 있습니다.
    aliases:
      - kor-travel-transport
    services:
      - backend
      - frontend
    runtime_services:
      - backend
      - frontend
    containers:
      - kor-travel-transport-backend
      - kor-travel-transport-frontend
    # 공용 Dagster 제어 평면(ADR-54). 필드 설명은 geo target에 있다. 형제 프로젝트라 compose가 이 저장소 밖이다 —
    # Manager는 그 모양을 파생할 수 없어 `external`에 적는다(code-server·옛 webserver·daemon·gateway의 compose
    # 서비스 이름, code-server의 `--location-name`과 literal `-p`). 공용 workspace의 항목과 공용 `dagster.yaml`의
    # `dagster/code_location` 상한이 이 값을 싣고(`test_dagster_shared_workspace_is_derived.py`·
    # `test_dagster_shared_config.py`), 전환 스크립트(`scripts/dagster-shared-cutover.sh transport …`)가 그
    # 프로젝트의 렌더된 compose(실행 중 code-server의 compose label이 말하는 파일들)에서 같은 모양을 파생해 이
    # 선언과 대조한다 — 어긋나면 펜스 전에 멈춘다. 옛 서비스의 컨테이너는 compose 기본 이름
    # (`kor-travel-transport-<service>-1`)이다. 소비자(운영 UI `kor-travel-transport-admin`, 다른 compose
    # project)의 env는 그 저장소가 소유하고 그 저장소의 계약 테스트가 본다 — 여기 `consumers`를 두지 않는다.
    dagster:
      control_plane: shared
      external:
        code_server: dagster-code-server
        webserver: dagster-webserver
        daemon: dagster-daemon
        gateways: [dagster-gateway]
        location_name: kor-travel-transport
        port: 14005

