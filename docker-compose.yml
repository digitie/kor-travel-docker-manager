      KOR_TRAVEL_MAP_DAGSTER_ADDRESS_VALIDATION: ${KOR_TRAVEL_MAP_DOCKER_ADDRESS_VALIDATION:-drop}
      KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH: ${KOR_TRAVEL_MAP_DOCKER_MOIS_SOURCE_DB_PATH:-/tmp/mois_source.db}
      KOR_TRAVEL_MAP_KMA_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_MAP_DOCKER_KMA_MAX_GRIDS:-80}
      KOR_TRAVEL_MAP_KMA_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_MAP_DOCKER_KMA_WEATHER_EXTRA_POINTS:-126.978,37.566;127.047,37.517;126.979,37.573;126.924,37.521;127.011,37.64;129.075,35.18;129.16,35.163;129.024,35.098;126.705,37.456;126.66,37.383;128.601,35.871;128.637,35.857;127.385,36.35;127.34,36.362;126.852,35.16;129.311,35.539;127.289,36.48;127.029,37.263;127.138,37.42;126.832,37.658;127.178,37.241;126.766,37.503;127.734,37.881;128.896,37.752;127.92,37.342;128.591,38.207;127.489,36.642;127.926,36.991;127.114,36.815;127.004,36.79;127.148,35.821;126.737,35.978;127.662,34.76;127.487,34.951;126.392,34.812;129.365,36.019;129.225,35.856;128.729,36.568;128.682,35.228;128.108,35.18;128.434,34.854;126.531,33.499;126.566,33.254;128.889,35.234;126.864,37.478;126.821,37.322;127.113,36.992;126.958,35.948;128.114,36.14;128.621,34.88;126.2838,36.673;127.4416,35.4118;128.7527,37.3221;129.4045,36.9182;127.9057,35.7043;126.0097,37.4346;126.7659,34.2899;127.7243,35.5217;128.9902,37.1551;130.9057,37.4845}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_PG_DSN:?KOR_TRAVEL_MAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KRTOUR_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KRTOUR_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KRTOUR_MAP_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_DOCKER_GEO_BASE_URL:-http://127.0.0.1:12501}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL:-http://127.0.0.1:12601}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY:-}
      # 서울 열린데이터광장은 data.go.kr과 **다른 포털이고 키도 다르다**.
      # 서울 책방(OA-21062) 하나가 쓴다 — 종전 odcloud 원천이 404로 사라졌다.
      KOR_TRAVEL_MAP_SEOUL_OPEN_DATA_API_KEY: ${KOR_TRAVEL_MAP_SEOUL_OPEN_DATA_API_KEY:-${SEOUL_OPEN_DATA_API_KEY:-}}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-}
      # OpiNet에는 전국 목록(bulk) 엔드포인트가 없어서 **scope를 골라야** 적재가
      # 시작된다. 이 줄들이 없으면 설정이 기본값 `disabled`로 떨어지고 job이
      # `ProviderCredentialMissing: opinet 적재 비활성(opinet_scope_mode=disabled)`로
      # 실패한다 — 2026-09-18 prod에서 place·price 두 job이 그 상태였다.
      # Map 저장소 자신의 compose에는 이 셋이 배선돼 있는데 여기에는 없었다
      # (KREX go key와 **같은 형태의 구멍**이다).
      #
      # 운영 모드는 `low_top_area`다(2026-09-19 결정). 기본값을 `disabled`로
      # 두면 배포가 끝나도 적재가 켜지지 않아 호스트 `.env`를 손으로 고쳐야
      # 했다 — 그 손 편집이 prod와 이 문서를 어긋나게 만든 자리다. 끄려면
      # `.env`에서 `disabled`로 덮는다.
      #
      # `low_top_area`는 시군구별 `lowTop10`을 로테이션으로 돈다. 아래 두 노브는
      # 그 모드의 호출량 상한이라 함께 넘긴다 — 무료키 일일 한도가 300회이고
      # (일반 19종 기준, 2026-09-14 확인) 매월 1일에는 place job이 같은 경로를
      # 한 번 더 돌아 여유가 좁아진다. 노브가 compose에 없으면 그때 조정하려고
      # 또 이 파일을 고쳐야 한다.
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-low_top_area}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS: ${KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS:-${OPINET_LOW_TOP_MAX_CALLS:-90}}
      KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET: ${KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET:-${OPINET_RUN_CALL_BUDGET:-140}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-}
      # KREX의 go key는 data.go.kr service key와 **같은 값**이다(python-krex-api의
      # `.env`에서 `KEX_GO_API_KEY`와 `DATA_GO_KR_SERVICE_KEY`가 같은 다이제스트임을
      # 실측했다). 이 줄에 폴백이 없어 prod에서 빈 값이었고(`.env`에는 `KRTOUR_` 접두의
      # 이름만 있다), `feature_place_krex_rest_areas_job`이 자격증명 없이 돌았다.
      # 위 `KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY`와 **같은 원천**으로 떨어뜨린다 —
      # 새 비밀을 만들지 않는다.
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${KRTOUR_MAP_DATA_GO_KR_SERVICE_KEY:-}}
      # issue #114 — reverse_geocoder가 전역 필수 리소스라 이 key 없이는 geocode 관련
      # provider ETL job 전체가 GeoAuthNotConfiguredError로 fail-close된다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY}
    volumes:
    - ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_DIR must be explicitly set}:/run/kor-travel-map-dagster-storage-permit:ro
  pinvi-api:
    image: ${PINVI_API_IMAGE:-pinvi-api:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/api/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
    container_name: ${PINVI_API_CONTAINER:-pinvi-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      pinvi-db-init:
        condition: service_completed_successfully
      # ADR-46 — 앱 DSN이 실제로 접속하는 곳. 구 전용 instance 의존은 롤백 안전망으로
      # 그대로 둔다(conc target과 같은 패턴).
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-pinvi:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      kor-travel-map-api:
        condition: service_healthy
    command:
    # PinVi realtime broker is process-local until a shared broker lands.
    # Keep the API at one worker unless the deployment has a broker-compatible override.
    # DB migration/admin bootstrap은 `pinvi-admin-bootstrap` one-shot만 소유한다.
    # normal API는 schema mutation을 수행하지 않는다.
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - ${PINVI_API_PORT:-12801}
    - --workers
    - ${PINVI_API_WORKERS:-1}
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:?PINVI_ENVIRONMENT must be explicitly set}
      PINVI_API_WORKERS: ${PINVI_API_WORKERS:-1}
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_POSTGRES_DB:-pinvi}
      PINVI_JWT_SECRET_KEY: ${PINVI_JWT_SECRET_KEY:-pinvi-local-jwt-secret-32-bytes-minimum}
      PINVI_RESEND_API_KEY: ${PINVI_RESEND_API_KEY:-}
      PINVI_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      PINVI_RUSTFS_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_PORT:-12101}
      PINVI_RUSTFS_BUCKET: ${PINVI_RUSTFS_BUCKET:-pinvi-media}
      PINVI_RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      PINVI_RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      PINVI_CORS_ALLOWED_ORIGINS: '${PINVI_CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:12805","http://localhost:12805"]}'
      # PinVi production Settings는 import 시 이 Map capability pair를 검증한다.
      PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_API_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_API_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      # 이 두 원시 token은 ordinary PinVi API만 소비한다. Manager가 digest를 Map
      # API에 파생하고 다른 PinVi/Map service로의 누출을 fail-close한다.
      PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN:-}
    ports:
    - ${PINVI_API_PORT:-12801}:${PINVI_API_PORT:-12801}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:${PINVI_API_PORT:-12801}/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  # C1의 migration + fresh-admin bootstrap command는 C2 rebuild transaction이
  # `docker compose --profile bootstrap run`으로만 호출한다. credential file의
  # 경로는 execution-time environment와 read-only mount로 전달하므로, 정적
  # Compose 및 normal PinVi runtime의 inspect metadata에는 존재하지 않는다.
  pinvi-admin-bootstrap:
    profiles:
    - bootstrap
    image: ${PINVI_API_IMAGE:-pinvi-api:latest-main}
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-pinvi:
        condition: service_completed_successfully
    command:
    - pinvi-admin-bootstrap
    environment:
      # one-shot도 API와 같은 production Settings를 import하므로 필요한 Map 검증값만 둔다.
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:?PINVI_ENVIRONMENT must be explicitly set}
      # 단일 app role이 migration까지 수행한다(geo 패턴). 종전에는 migrator role로
      # 접속하고 schema owner/migration owner를 따로 넘겼는데, 그 분리는 M05와 함께
      # 폐기됐다 — role은 자기 database를 소유하므로 DDL 권한이 이미 있다.
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_POSTGRES_DB:-pinvi}
      PINVI_APP_DB_USER: ${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}
      PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}}
      PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
  pinvi-web:
    image: ${PINVI_WEB_IMAGE:-pinvi-web:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/web/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
        NEXT_PUBLIC_PINVI_API_URL: ${PINVI_PUBLIC_API_URL:-http://127.0.0.1:12801}
    container_name: ${PINVI_WEB_CONTAINER:-pinvi-web-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - npx
    - next
    - start
    - -p
    - '${PINVI_WEB_PORT:-12805}'
    - -H
    - 0.0.0.0
    depends_on:
      pinvi-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_PINVI_API_URL: ${PINVI_PUBLIC_API_URL:-http://127.0.0.1:12801}
    ports:
    - ${PINVI_WEB_PORT:-12805}:${PINVI_WEB_PORT:-12805}
  # PinVi ADR-069 — `pinvi.etl.definitions`를 실제로 import·실행하는 유일한
  # 프로세스. webserver/daemon은 이 컨테이너에 gRPC로만 접속하고(`workspace.yaml`)
  # 유저 코드를 전혀 만지지 않는다 — job 코드의 버그나 무거운 import가 그 둘의
  # 헬스체크·프로세스 자체를 끌고 내려가지 않는다. 참조 구현은
  # `kor-travel-weather`(PR #61)이지만, PinVi는 `network_mode: host`라
  # `workspace.yaml`이 서비스명이 아니라 `127.0.0.1`을 쓴다(ADR-069 §결정 2).
  pinvi-dagster-code-server:
    image: ${PINVI_DAGSTER_IMAGE:-pinvi-dagster:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/etl/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
    container_name: ${PINVI_DAGSTER_CODE_SERVER_CONTAINER:-pinvi-dagster-code-server-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      pinvi-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-pinvi:
        condition: service_completed_successfully
      pinvi-api:
        condition: service_healthy
    command:
    - dagster
    - api
    - grpc
    - -h
    - 0.0.0.0
    - -p
    - '${PINVI_DAGSTER_CODE_SERVER_PORT:-12803}'
    - -m
    - pinvi.etl.definitions
    environment:
      DAGSTER_HOME: /opt/pinvi/.dagster
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      # 여기가 code location이 실제로 도는 곳이다 — `DefaultRunLauncher`의 run
      # worker는 이 프로세스의 자식으로 뜬다. asset/job/resource가 app DB를
      # 직접 쓴다(PinviDatabaseResource 등).
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_POSTGRES_DB:-pinvi}
      # Dagster instance storage. **scheme이 앱 DSN과 다르다** —
      # dagster-postgres는 psycopg2(동기)를 쓰므로 `+asyncpg`를 붙이면 안 된다.
      PINVI_DAGSTER_PG_URL: postgresql://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_DAGSTER_DB:-pinvi_dagster}
    healthcheck:
      # dagster 자신의 grpc health protocol — 프로세스 존재가 아니라 gRPC
      # 서버가 실제로 응답하는지를 본다.
      test:
      - CMD
      - dagster
      - api
      - grpc-health-check
      - -h
      - 127.0.0.1
      - -p
      - '${PINVI_DAGSTER_CODE_SERVER_PORT:-12803}'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  pinvi-dagster:
    image: ${PINVI_DAGSTER_IMAGE:-pinvi-dagster:latest-main}
    build:
      context: ${PINVI_REPO_DIR:-../pinvi}
      dockerfile: apps/etl/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_BUILD_ENVIRONMENT:-development}
    container_name: ${PINVI_DAGSTER_CONTAINER:-pinvi-dagster-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      pinvi-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-pinvi:
        condition: service_completed_successfully
      pinvi-api:
        condition: service_healthy
      # ADR-069 — webserver는 이제 code location을 직접 import하지 않는다.
      # workspace.yaml의 grpc_server가 이 컨테이너를 가리키므로, 이게
      # healthy해야 webserver의 code location 로드 자체가 가능하다.
      pinvi-dagster-code-server:
        condition: service_healthy
    # ADR-069 — `-m` 직접 import에서 `-w workspace.yaml`(grpc_server)로 전환.
    # webserver는 더 이상 pinvi.etl.definitions를 import하지 않는다.
    command:
    - dagster-webserver
    - -h
    - 0.0.0.0
    - -p
    - '${PINVI_DAGSTER_PORT:-12802}'
    - -w
    - /opt/pinvi/.dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/pinvi/.dagster
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      PINVI_DAGSTER_PORT: ${PINVI_DAGSTER_PORT:-12802}
      # ADR-069: webserver는 code location을 더 이상 직접 import하지 않으므로
      # 엄밀히는 앱 DSN이 필요 없다 — 하지만 이 컷오버 직후 관측 기간 동안은
      # 제거하지 않는다(부작용 없음, 혹시 모를 Dagster UI 내부 경로의 암묵
      # 의존을 배제하기 전까지 안전한 쪽을 택한다). 안정 확인 후 제거 후보.
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_POSTGRES_DB:-pinvi}
      # Dagster instance storage. **scheme이 앱 DSN과 다르다** —
      # dagster-postgres는 psycopg2(동기)를 쓰므로 `+asyncpg`를 붙이면 안 된다.
      PINVI_DAGSTER_PG_URL: postgresql://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_DAGSTER_DB:-pinvi_dagster}
    ports:
    - ${PINVI_DAGSTER_PORT:-12802}:${PINVI_DAGSTER_PORT:-12802}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, json, urllib.request as u; p = os.environ.get('PINVI_DAGSTER_PORT', '12802'); q = json.dumps({'query': '{repositoriesOrError{__typename}}'}).encode(); r = u.urlopen(u.Request('http://127.0.0.1:%s/graphql' % p, data=q, headers={'Content-Type': 'application/json'}), timeout=5); d = json.load(r); t = d.get('data', {}).get('repositoriesOrError', {}).get('__typename'); raise SystemExit(0 if t == 'RepositoryConnection' else 'code location not loaded: %s' % t)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  # **이 서비스가 없어서 PinVi Dagster는 한 번도 job을 실행한 적이 없다.**
  #
  # 2026-09-19 n150 실측: instance의 run_coordinator가 `QueuedRunCoordinator`인데
  # (dagster 최신 기본값) 그것을 dequeue하는 daemon이 이 compose에 없었다. 그 조합은
  # "schedule이 안 돈다"가 아니라 **아무 run도 시작되지 않는다**는 뜻이다 — UI에서
  # 손으로 띄워도 QUEUED에서 멈춘다. 실측 run 0건이 그 결과이고, 등록된 job 8개
  # (`pinvi_pii_retention` 포함)·schedule 7개·sensor 1개가 전부 그 상태였다.
  #
  # webserver와 **같은 이미지**를 argv만 달리해 돌린다(Map·geo와 같은 형태).
  pinvi-dagster-daemon:
    image: ${PINVI_DAGSTER_IMAGE:-pinvi-dagster:latest-main}
    container_name: ${PINVI_DAGSTER_DAEMON_CONTAINER:-pinvi-dagster-daemon-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      pinvi-postgres:
        condition: service_healthy
      pinvi-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-pinvi:
        condition: service_completed_successfully
      # ADR-069 — daemon도 더 이상 code location을 직접 import하지 않는다.
      # "code location이 로드 가능한가"의 신호는 이제 webserver가 아니라
      # code-server 자신이다.
      pinvi-dagster-code-server:
        condition: service_healthy
    # **낡은 이미지로 뜨면 조용히 두 번째 instance가 생긴다.**
    #
    # webserver와 daemon은 같은 이미지를 쓰지만 **다른 컨테이너**이고
    # `/opt/pinvi/.dagster`에는 볼륨이 없다. 그 이미지에 `apps/etl/dagster.yaml`이
    # 없거나 `dagster-postgres`가 안 깔려 있으면 둘은 각자 자기 컨테이너 안에
    # SQLite를 만든다. 그러면 daemon은 자기 **빈** DB를 dequeue하고, webserver에서
    # 띄운 run은 QUEUED인 채로 영원히 남는다 — 아무 데도 에러가 찍히지 않는다.
    # daemon이 없던 지금까지보다 **더 나쁜** 상태이면서 겉보기는 정상이다.
    #
    # 그래서 이름이 아니라 **효과**로 막는다. 이미지 tag도 패키지 존재도 보지
    # 않고, 기동 시점에 실제로 resolve된 storage 세 개의 구현을 본다. 하나라도
    # Postgres가 아니면 daemon을 띄우지 않고 죽는다(fail-close). 이 가드가 있으면
    # 이미지 재빌드보다 이 compose가 먼저 적용돼도 안전하다 — 순서 의존이 사라진다.
    #
    # ADR-069 — 가드 통과 뒤 넘어가는 명령이 `-m` 직접 import에서
    # `-w workspace.yaml`(grpc_server)로 바뀌었다. 가드 자체(instance storage
    # 판정)는 코드 로딩 방식과 무관해 그대로 유효하다.
    command:
    - sh
    - -ec
    - |
      python -c '
      import sys
      from dagster import DagsterInstance

      with DagsterInstance.get() as instance:
          wrong = {
              label: type(storage).__name__
              for label, storage in (
                  ("run", instance.run_storage),
                  ("event log", instance.event_log_storage),
                  ("schedule", instance.schedule_storage),
              )
              if "Postgres" not in type(storage).__name__
          }
      if wrong:
          sys.exit(
              "PinVi Dagster instance storage is not PostgreSQL: %s. "
              "The image predates apps/etl/dagster.yaml or lacks dagster-postgres; "
              "rebuild the pinned PinVi image before starting the daemon." % wrong
          )
      '
      exec dagster-daemon run -w /opt/pinvi/.dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/pinvi/.dagster
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      # 유예를 dagster 기본값(1800초)에 맡기지 않는다 — 판정식이
      # `now <= heartbeat + interval + tolerance`라, 기본값이면 끼인 스레드를
      # 31분 뒤에 알게 되고 healthcheck의 interval·retries로는 그 지연이
      # 줄지 않는다. Map·geo와 같은 300초를 쓴다.
      DAGSTER_DAEMON_HEARTBEAT_TOLERANCE: ${DAGSTER_DAEMON_HEARTBEAT_TOLERANCE:-300}
      # webserver와 **같은 instance storage**를 봐야 한다. 다르면 schedule 켜짐
      # 상태와 run 이력이 갈려 UI에 보이는 것과 실제로 도는 것이 달라진다.
      PINVI_DAGSTER_PG_URL: postgresql://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_DAGSTER_DB:-pinvi_dagster}
      # ADR-069: daemon은 code location을 더 이상 직접 import하지 않는다
      # (run worker는 이제 code-server의 자식이다) — 엄밀히는 앱 DSN이 필요
      # 없지만, webserver와 같은 이유로 컷오버 직후에는 제거하지 않는다.
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}:${PINVI_APP_DB_PASSWORD:?PINVI_APP_DB_PASSWORD must be explicitly set}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${PINVI_POSTGRES_DB:-pinvi}
    healthcheck:
      # dagster의 정식 판정. required daemon 전부의 heartbeat 신선도를 보고
      # 하나라도 낡으면 exit 1이다 — 프로세스 존재만 보는 pgrep류와 다르다.
      test:
      - CMD-SHELL
      - dagster-daemon liveness-check
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.1}
    container_name: ${PROMETHEUS_CONTAINER:-kor-travel-prometheus}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    user: ${PROMETHEUS_RUN_AS_USER:-0}
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    - --web.listen-address=:${PROMETHEUS_PORT:-12102}
    ports:
    - ${PROMETHEUS_PORT:-12102}:${PROMETHEUS_PORT:-12102}
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ${PROMETHEUS_DATA_DIR:-/home/digitie/kor-travel-geo-data/prometheus}:/prometheus
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.4}
    container_name: ${GRAFANA_CONTAINER:-kor-travel-grafana}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    user: ${GRAFANA_RUN_AS_USER:-0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-12104}
    ports:
    - ${GRAFANA_PORT:-12104}:${GRAFANA_PORT:-12104}
    volumes:
    - ${GRAFANA_DATA_DIR:-/home/digitie/kor-travel-geo-data/grafana}:/var/lib/grafana
    - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: ${CADVISOR_CONTAINER:-kor-travel-cadvisor}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    command:
    - --logtostderr
    - --docker_only=true
    - --port=${CADVISOR_PORT:-12103}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:${CADVISOR_PORT:-12103}/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
    - ${CADVISOR_PORT:-12103}:${CADVISOR_PORT:-12103}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
  # --- geo 독립 Dagster (T-290, ADR-066) ---------------------------------------
  # geo 전용 Dagster webserver + daemon + 메타 DB init. 앱 DB(kor_travel_geo)는
  # 절대 건드리지 않고 별도 DB kor_travel_geo_dagster에 run/event/schedule 이력을 둔다.
  # 포트 12502 (docs/ports.md: geo 125xx 블록의 worker/aux 슬롯; map 12702·concierge 12602 패턴).
  kor-travel-geo-dagster-db-init:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_DB_INIT_CONTAINER:-kor-travel-geo-dagster-db-init}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-geo-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      # 포트는 compose가 풀어서 준다. `createdb -p "$${...}"`로 컨테이너 셸에
      # 맡기면 그 셸엔 KOR_TRAVEL_GEO_DB_PORT가 없어 항상 default로 떨어진다 —
      # `.env`로 포트를 옮기면 postgres만 따라가고 이 one-shot은 옛 포트에 붙어 죽는다.
      PGPORT: ${KOR_TRAVEL_GEO_DB_PORT:-12500}
      PGUSER: ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr}
      KOR_TRAVEL_GEO_DAGSTER_DB: ${KOR_TRAVEL_GEO_DAGSTER_DB:-kor_travel_geo_dagster}
    secrets:
    - kor-travel-geo-postgres-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다. 인증 실패·연결 거부·권한
    # 부족을 전부 삼키고 exit 0으로 끝나서, 이 one-shot이 막으려던 바로 그 상황에서
    # `service_completed_successfully` 게이트가 통과한다. 존재 확인만 조용히 하고
    # 진짜 오류는 전파한다.
    # 비밀번호는 `PGPASSWORD` 평문(=`docker inspect`에 그대로 남는다) 대신 secret
    # file로 받는다 — `restart: "no"` 컨테이너는 exit 뒤에도 남아 계속 조회된다.
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-geo-postgres-password)"
      export PGPASSWORD
      if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$KOR_TRAVEL_GEO_DAGSTER_DB'" | grep -q 1; then
        echo "database $$KOR_TRAVEL_GEO_DAGSTER_DB already exists"
      else
        createdb "$$KOR_TRAVEL_GEO_DAGSTER_DB"
      fi
  # T-307 (kor-travel-geo #548): code loading and op execution live here, split out of
  # webserver/daemon into their own process — same fix kor-travel-weather shipped after
  # a code-load hang silently froze its single in-process webserver/daemon, undetected
  # because the outer container stayed "Up" and `restart: unless-stopped` never fired.
  # No `--heartbeat` flag: that self-destruct timer is for `dagster dev`-style bundling
  # (an inner worker a wrapping process must notice and react to). This IS the whole
  # container, so an ordinary crash/OOM is Docker's normal restart-policy problem like
  # any other service. Not externally exposed — reached over loopback only (host network).
  kor-travel-geo-dagster-code-server:
    image: ${KOR_TRAVEL_GEO_DAGSTER_IMAGE:-kor-travel-geo-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: kor-travel-geo-dagster/docker/dagster.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_CODE_SERVER_CONTAINER:-kor-travel-geo-dagster-code-server-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      # 옛 전용 instance는 롤백 안전망으로 계속 띄워 두므로(ADR-45) 의존성도
      # 남겨 둔다 — 무해하게 같이 healthy해진다. 이 커밋 시점에는 KTG_PG_DSN/
      # KTG_DAGSTER_PG_URL이 여전히 옛 instance를 가리킨다 — 실제 data cutover가
      # 끝난 뒤에야 이 값들이 아래 공용 instance로 바뀐다(별도 배포 단계, ADR-45).
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-geo-dagster-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-geo:
        condition: service_completed_successfully
    command:
    - dagster
    - api
    - grpc
    - -h
    - 0.0.0.0
    - -p
    - ${KOR_TRAVEL_GEO_DAGSTER_CODE_SERVER_PORT:-12503}
    - -m
    - kortravelgeo_dagster.definitions
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KTG_DAGSTER_PG_URL: ${KOR_TRAVEL_GEO_DAGSTER_PG_URL:?KOR_TRAVEL_GEO_DAGSTER_PG_URL must be explicitly set}
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:?KOR_TRAVEL_GEO_DOCKER_PG_DSN must be explicitly set}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # T-290 on-ramp (kor-travel-geo #444): op execution happens in this container now
      # (T-307), including the scheduled_backup Dagster run that calls the geo admin API
      # (POST /v1/admin/backups/scheduled/run-due) and must present the admin proxy
      # secret the API expects, else the run-due call 403s.
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_DAGSTER_ADMIN_API_URL: ${KOR_TRAVEL_GEO_DAGSTER_ADMIN_API_URL:-http://127.0.0.1:12501}
      # geo scheduled DB backup execution side (see geo-api block): TTL/keep_min are read here
      # when the db_backup op finalizes an artifact — keep in sync with geo-api.
      KTG_BACKUP_SCHEDULE_ENABLED: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_ENABLED:-false}
      KTG_BACKUP_SCHEDULE_INTERVAL_HOURS: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_INTERVAL_HOURS:-24}
      KTG_BACKUP_ARTIFACT_TTL_DAYS: ${KOR_TRAVEL_GEO_BACKUP_ARTIFACT_TTL_DAYS:-30}
      KTG_BACKUP_RETENTION_KEEP_MIN: ${KOR_TRAVEL_GEO_BACKUP_RETENTION_KEEP_MIN:-3}
    # T-290g: db_backup ops execute here now (T-307) and write to /app/data/backups —
    # mount the SAME shared host dir as geo-api/webserver/daemon so the artifact is
    # restorable/downloadable/verifiable there.
    volumes:
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups
    healthcheck:
      test: ["CMD-SHELL", "dagster api grpc-health-check -p ${KOR_TRAVEL_GEO_DAGSTER_CODE_SERVER_PORT:-12503}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kor-travel-geo-dagster:
    image: ${KOR_TRAVEL_GEO_DAGSTER_IMAGE:-kor-travel-geo-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: kor-travel-geo-dagster/docker/dagster.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_CONTAINER:-kor-travel-geo-dagster-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      # 옛 전용 instance는 롤백 안전망으로 계속 띄워 두므로(ADR-45) 의존성도
      # 남겨 둔다 — 무해하게 같이 healthy해진다. 이 커밋 시점에는 KTG_PG_DSN/
      # KTG_DAGSTER_PG_URL이 여전히 옛 instance를 가리킨다 — 실제 data cutover가
      # 끝난 뒤에야 이 값들이 아래 공용 instance로 바뀐다(별도 배포 단계, ADR-45).
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-geo-dagster-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-geo:
        condition: service_completed_successfully
      kor-travel-geo-dagster-code-server:
        condition: service_healthy
    command:
    - dagster-webserver
    - -w
    - /opt/dagster/dagster_home/workspace.yaml
    - -h
    - "0.0.0.0"
    - -p
    - ${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KTG_DAGSTER_PORT: ${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}
      KTG_DAGSTER_PG_URL: ${KOR_TRAVEL_GEO_DAGSTER_PG_URL:?KOR_TRAVEL_GEO_DAGSTER_PG_URL must be explicitly set}
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:?KOR_TRAVEL_GEO_DOCKER_PG_DSN must be explicitly set}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # T-290 on-ramp (kor-travel-geo #444): the scheduled_backup Dagster run calls the
      # geo admin API (POST /v1/admin/backups/scheduled/run-due) and must present the
      # admin proxy secret the API expects, else the run-due call 403s.
      # KTG_DAGSTER_ADMIN_API_URL defaults to the host-network geo-api.
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_DAGSTER_ADMIN_API_URL: ${KOR_TRAVEL_GEO_DAGSTER_ADMIN_API_URL:-http://127.0.0.1:12501}
      # geo scheduled DB backup execution side (see geo-api block): TTL/keep_min are read here
      # when the db_backup op finalizes an artifact — keep in sync with geo-api.
      KTG_BACKUP_SCHEDULE_ENABLED: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_ENABLED:-false}
      KTG_BACKUP_SCHEDULE_INTERVAL_HOURS: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_INTERVAL_HOURS:-24}
      KTG_BACKUP_ARTIFACT_TTL_DAYS: ${KOR_TRAVEL_GEO_BACKUP_ARTIFACT_TTL_DAYS:-30}
      KTG_BACKUP_RETENTION_KEEP_MIN: ${KOR_TRAVEL_GEO_BACKUP_RETENTION_KEEP_MIN:-3}
    # T-290g: the db_backup op executes in this webserver container and writes the backup to
    # /app/data/backups — mount the SAME shared host dir as geo-api so the artifact is
    # restorable/downloadable/verifiable there.
    volumes:
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups
    # Public routing (external/manual, no compose label): the LAN router reverse-proxies
    # https://geo-dagster.example.org/ (TLS termination) -> this host 127.0.0.1:12502,
    # same pattern as the other services' *.digitie.mywire.org domains. The geo-api echoes
    # that public URL to the admin UI via KTG_DAGSTER_PUBLIC_URL (T-290).
    ports:
    - ${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}:${KOR_TRAVEL_GEO_DAGSTER_PORT:-12502}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, json, urllib.request as u; p = os.environ.get('KTG_DAGSTER_PORT', '12502'); q = json.dumps({'query': '{repositoriesOrError{__typename}}'}).encode(); r = u.urlopen(u.Request('http://127.0.0.1:%s/graphql' % p, data=q, headers={'Content-Type': 'application/json'}), timeout=5); d = json.load(r); t = d.get('data', {}).get('repositoriesOrError', {}).get('__typename'); raise SystemExit(0 if t == 'RepositoryConnection' else 'code location not loaded: %s' % t)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kor-travel-geo-dagster-daemon:
    image: ${KOR_TRAVEL_GEO_DAGSTER_IMAGE:-kor-travel-geo-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: kor-travel-geo-dagster/docker/dagster.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_DAGSTER_DAEMON_CONTAINER:-kor-travel-geo-dagster-daemon-latest}
    restart: unless-stopped
    # **회수 기제가 살아 있는지 본다.**
    #
    # `run_monitoring`(프로세스가 사라진 run을 회수)과 queued run dequeue는 전부 이
    # 프로세스 안의 스레드다. 그런데 이 서비스에는 healthcheck가 없었다 — 같은 스택의
    # webserver와 api는 갖고 있다. 그리고 daemon controller의 `check_daemon_threads`는
    # 스레드 하나가 죽으면 프로세스를 **스스로 끝낸다**.
    #
    # 그래서 두 실패가 조용했다. (a) 프로세스가 나가면 `restart: unless-stopped`가
    # 되살리지만 그 사이 회수 기제가 없었다는 사실은 어디에도 남지 않는다.
    # (b) 스레드가 살아 있으면서 끼이면 heartbeat만 낡는데 — controller는 그것에
    # warning만 남기고 프로세스를 끝내지 않는다 — 그것을 보는 것이 아무것도 없다.
    # 형제 프로젝트 `kor-travel-weather`가 (a) 계열로 18시간 정지했다.
    #
    # `dagster-daemon liveness-check`는 dagster가 제공하는 정식 판정이다.
    # `all_daemons_live`가 **required daemon 전부**의 heartbeat 신선도를 보고
    # (`ignore_errors=True` — 오류 유무가 아니라 살아 있는지만) 하나라도 낡으면 exit 1.
    #
    # **유예를 명시한다.** 기본값은 `DEFAULT_DAEMON_HEARTBEAT_TOLERANCE_SECONDS = 1800`
    # 이고 판정식이 `now <= heartbeat + interval(30) + tolerance`이므로, 그대로 두면
    # (b)를 **31분 뒤에** 알게 된다 — interval·retries를 어떻게 줄여도 그 지연은
    # 줄지 않는다. 300을 고른 근거는 임의값이 아니다: dagster 자신이 같은 controller
    # 에서 `DEFAULT_WORKSPACE_FRESHNESS_TOLERANCE = 300`을 "이만큼 낡으면 계속할 수
    # 없다"로 쓴다. daemon loop의 정상 heartbeat 간격은 15~30초이므로 10~20배 여유다.
    #
    # heartbeat는 metadata DB에 있어 이 검사는 DB까지 왕복한다. interval을 web(10s)
    # 보다 길게 두고 start_period로 기동 창(code location 로딩 포함)을 준다.
    healthcheck:
      test: ["CMD-SHELL", "dagster-daemon liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      # 옛 전용 instance는 롤백 안전망으로 계속 띄워 두므로(ADR-45) 의존성도
      # 남겨 둔다 — 무해하게 같이 healthy해진다. 이 커밋 시점에는 KTG_PG_DSN/
      # KTG_DAGSTER_PG_URL이 여전히 옛 instance를 가리킨다 — 실제 data cutover가
      # 끝난 뒤에야 이 값들이 아래 공용 instance로 바뀐다(별도 배포 단계, ADR-45).
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-geo-dagster-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-geo:
        condition: service_completed_successfully
      kor-travel-geo-dagster-code-server:
        condition: service_healthy
    # T-307: attaches to the code-server over gRPC (workspace.yaml) instead of loading
    # kortravelgeo_dagster.definitions in-process — see the code-server service comment
    # above for why. The `_NOT_GUARDED_BY_COMMAND` storage-guard exemption for this
    # service's old reason ("instance storage를 env DSN으로 선언하지 않는다") was already
    # inaccurate before this change (KTG_DAGSTER_PG_URL below IS an env-DSN declaration,
    # matching PinVi's own pattern) — flagging here since T-307 touches this exact block.
    command:
    - dagster-daemon
    - run
    - -w
    - /opt/dagster/dagster_home/workspace.yaml
    environment:
      DAGSTER_DAEMON_HEARTBEAT_TOLERANCE: ${DAGSTER_DAEMON_HEARTBEAT_TOLERANCE:-300}
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KTG_DAGSTER_PG_URL: ${KOR_TRAVEL_GEO_DAGSTER_PG_URL:?KOR_TRAVEL_GEO_DAGSTER_PG_URL must be explicitly set}
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:?KOR_TRAVEL_GEO_DOCKER_PG_DSN must be explicitly set}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # T-290 on-ramp (kor-travel-geo #444): the daemon shares the code-location image
      # and can execute the scheduled_backup run, which calls the geo admin API
      # (POST /v1/admin/backups/scheduled/run-due). It must present the admin proxy
      # secret the API expects, else the run-due call 403s.
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_DAGSTER_ADMIN_API_URL: ${KOR_TRAVEL_GEO_DAGSTER_ADMIN_API_URL:-http://127.0.0.1:12501}
      # geo scheduled DB backup execution side (see geo-api block): TTL/keep_min are read here
      # when the db_backup op finalizes an artifact — keep in sync with geo-api.
      KTG_BACKUP_SCHEDULE_ENABLED: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_ENABLED:-false}
      KTG_BACKUP_SCHEDULE_INTERVAL_HOURS: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_INTERVAL_HOURS:-24}
      KTG_BACKUP_ARTIFACT_TTL_DAYS: ${KOR_TRAVEL_GEO_BACKUP_ARTIFACT_TTL_DAYS:-30}
      KTG_BACKUP_RETENTION_KEEP_MIN: ${KOR_TRAVEL_GEO_BACKUP_RETENTION_KEEP_MIN:-3}
    # T-290g: same shared backup dir as the webserver/api, so a db_backup run launched here
    # (or a leaf executed in this container) writes artifacts the geo-api can restore.
    volumes:
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups

  # ── kor-travel-weather: internal target 전환 (ADR-47, 2026-09-20) ──────────
  #
  # weather는 원래 external target(자기 저장소 compose가 prod 정본, platform-topology.md
  # §2)이었다. 사용자 지시로 전체(db·api·web·dagster 전부)를 Manager compose로
  # 통합한다 — db는 데이터 이전 없이 공용 instance(kor-travel-shared-postgres)에
  # fresh로 새로 만든다("어차피 새로 쌓으면 됨", PinVi ADR-46과 같은 패턴).
  # 기존 포트(14100-14199)는 그대로 유지한다 — n150 HAProxy가 이미 그 포트로
  # 공개 도메인을 라우팅 중이라 바꾸면 별도 호스트 설정 변경이 필요해진다.
  #
  # network_mode: host는 bridge NAT을 없앤다 — weather 자신의 compose.yaml에서
  # bridge-mode NAT이 대신 지켜주던 두 가지를 여기서 명시로 대체해야 했다:
  # (1) dagster-webserver와 dagster-gateway가 원래 컨테이너 내부에서 같은 포트
  #     14102를 각자 썼다(bridge에서는 별 네임스페이스라 충돌이 없다) — host
  #     모드에서는 충돌하므로 webserver를 14107(loopback 전용, 새 포트)로 옮기고
  #     gateway의 nginx conf(Manager 소유 오버라이드)가 거기로 proxy_pass한다.
  #     외부에 노출되는 14102는 gateway 혼자 그대로 쓴다 — HAProxy는 안 바뀐다.
  # (2) dagster-code-server의 gRPC 포트(14106, 인증 전혀 없음, 코드 실행 가능)는
  #     bridge에서 `ports: 127.0.0.1:14106:14106` publish 매핑이 loopback-only를
  #     지켰다 — host 모드는 publish 자체가 없어(Docker가 무시) 프로세스 자신의
  #     -h 바인드가 유일한 방어선이다. weather 자신의 compose.yaml은 -h 0.0.0.0을
  #     쓰는데(bridge 전제라 안전했다) 여기서는 -h 127.0.0.1로 바꾼다. 같은 이유로
  #     dagster-webserver(자체 인증 없음, gateway가 앞단일 때만 안전)도 127.0.0.1.
  #
  # ⚠️ 알려진 채 남겨둔 노출(사용자 결정, 2026-09-20): dagster-code-server의
  # metrics 포트(14103)는 weather 자신의 Python 코드(prometheus_client multiprocess
  # 서버)가 여는 것이라 이 compose의 -h 플래그로 제어되지 않는다. host 모드에서
  # 인증 없이 LAN에 노출된다 — geo(`kor-travel-geo-dagster-code-server`)·PinVi
  # (`pinvi-dagster-code-server`)도 이미 같은 부류로 LAN에 노출돼 있다(이번
  # 적대 리뷰가 발견, 이 작업과 무관하게 이미 실재). 지금은 그대로 두고 기록만
  # 한다 — 별도 후속 작업(weather 저장소 소스 변경 또는 n150 호스트 방화벽) 필요.
  #
  # weather 자신의 compose.yaml/deploy/는 지우지 않는다 — local-dev/e2e 전용으로
  # 격하될 뿐, prod 정본 지위만 여기로 옮겨온다.

  kor-travel-weather-api:
    image: ${KOR_TRAVEL_WEATHER_API_IMAGE:-kor-travel-weather-api:latest-main}
    build:
      context: ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
        GIT_COMMIT: ${KOR_TRAVEL_WEATHER_GIT_COMMIT:-unknown}
    container_name: ${KOR_TRAVEL_WEATHER_API_CONTAINER:-kor-travel-weather-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-weather:
        condition: service_completed_successfully
      kor-travel-weather-migrate:
        condition: service_completed_successfully
    command:
    - uvicorn
    - kortravelweather_api.app:app
    - --host
    - "0.0.0.0"
    - --port
    - "14101"
    environment:
      KOR_TRAVEL_WEATHER_ENV: production
      # weather 자신의 전용 db는 은퇴한다(사용자 결정: 데이터 이전 없음, fresh
      # 재적재로 충분). 변수 이름은 weather 자신의 compose.yaml(line 119-123)과
      # 동일하게 유지 — 값(host/port/user/db)만 공용 instance를 가리키도록 바뀐다.
      # 비밀번호는 URL에 넣지 않고 libpq PGPASSWORD로 전달한다 — weather 자신의
      # 기존 관례(compose.yaml 주석) 그대로다.
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${KOR_TRAVEL_WEATHER_SHARED_APP_USER:-kor_travel_weather_app}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${KOR_TRAVEL_WEATHER_SHARED_APP_DB:-kor_travel_weather}
      PGPASSWORD: ${KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD:?set KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD in .env}
      KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      KOR_TRAVEL_WEATHER_METRICS_TOKEN: ${KOR_TRAVEL_WEATHER_METRICS_TOKEN:?set KOR_TRAVEL_WEATHER_METRICS_TOKEN in .env}
      KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
      KOR_TRAVEL_WEATHER_CORS_ORIGINS: '${KOR_TRAVEL_WEATHER_CORS_ORIGINS:-["https://weather.digitie.mywire.org","http://127.0.0.1:14105"]}'
      KOR_TRAVEL_WEATHER_API_BASE_URL: ${KOR_TRAVEL_WEATHER_API_BASE_URL:-https://weather-api.digitie.mywire.org}
      KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
      KOR_TRAVEL_WEATHER_KREX_API_KEY: ${KOR_TRAVEL_WEATHER_KREX_API_KEY:-}
      KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
      KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS: ${KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS:-["python-kma-api","python-airkorea-api","open_meteo","weatherapi","openweathermap","tomorrow_io","weatherbit","weatherstack","accuweather"]}
      KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
      KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
      KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
      KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
    ports:
    - ${KOR_TRAVEL_WEATHER_API_PORT:-14101}:${KOR_TRAVEL_WEATHER_API_PORT:-14101}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14101/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  kor-travel-weather-migrate:
    image: ${KOR_TRAVEL_WEATHER_API_IMAGE:-kor-travel-weather-api:latest-main}
    build:
      context: ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
        GIT_COMMIT: ${KOR_TRAVEL_WEATHER_GIT_COMMIT:-unknown}
    container_name: ${KOR_TRAVEL_WEATHER_MIGRATE_CONTAINER:-kor-travel-weather-migrate}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-weather:
        condition: service_completed_successfully
    environment:
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${KOR_TRAVEL_WEATHER_SHARED_APP_USER:-kor_travel_weather_app}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${KOR_TRAVEL_WEATHER_SHARED_APP_DB:-kor_travel_weather}
      PGPASSWORD: ${KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD:?set KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD in .env}
    command: ["alembic", "upgrade", "head"]
    working_dir: /app

  kor-travel-weather-dagster-code-server:
    image: ${KOR_TRAVEL_WEATHER_DAGSTER_IMAGE:-kor-travel-weather-dagster:latest-main}
    build:
      context: ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "1"
        GIT_COMMIT: ${KOR_TRAVEL_WEATHER_GIT_COMMIT:-unknown}
    container_name: ${KOR_TRAVEL_WEATHER_DAGSTER_CODE_SERVER_CONTAINER:-kor-travel-weather-dagster-code-server-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-weather:
        condition: service_completed_successfully
      kor-travel-weather-migrate:
        condition: service_completed_successfully
    # ⚠️ loopback-only는 필수 요구사항이다(weather 자신의 deploy/n150.md) — 이
    # gRPC 포트는 인증이 전혀 없고 닿는 쪽이 코드를 실행할 수 있다. bridge
    # 모드에서는 `127.0.0.1:14106:14106` publish 매핑이 지켰지만, host 모드는
    # publish 자체가 없어 -h 바인드 값이 유일한 방어선이다(weather 자신의
    # compose.yaml은 -h 0.0.0.0을 쓰는데, 그건 bridge NAT을 전제한 것이라
    # 여기서는 안전하지 않다).
    command:
    - dagster
    - api
    - grpc
    - -h
    - "127.0.0.1"
    - -p
    - "14106"
    - -m
    - kortravelweather_dagster.definitions
    - --inject-env-vars-from-instance
    environment:
      DAGSTER_HOME: /opt/dagster/home
      KOR_TRAVEL_WEATHER_ENV: production
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${KOR_TRAVEL_WEATHER_SHARED_APP_USER:-kor_travel_weather_app}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/${KOR_TRAVEL_WEATHER_SHARED_APP_DB:-kor_travel_weather}
      PGPASSWORD: ${KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD:?set KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD in .env}
      # Dagster instance storage — app 계정과 같은 role, DB만 분리(2026-09-25
      # 단일-role 통합, PinVi/geo 패턴).
      DAGSTER_POSTGRES_URL: postgresql://${KOR_TRAVEL_WEATHER_SHARED_APP_USER:-kor_travel_weather_app}:${KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD:?set KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD in .env}@127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}/kor_travel_weather_dagster
      KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
      KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
      KOR_TRAVEL_WEATHER_KREX_API_KEY: ${KOR_TRAVEL_WEATHER_KREX_API_KEY:-}
      KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
