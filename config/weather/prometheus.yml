global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # kor-travel-weather의 원본 deploy/prometheus/prometheus.yml은 bridge 네트워크
  # DNS(api:14101, dagster:14103)를 쓴다. 이 Manager는 host 네트워크로 실행하므로
  # 이 파일로 그 두 타깃만 127.0.0.1로 바꿔 덮어쓴다 — 형제 저장소 원본은 건드리지 않는다.
  - job_name: kor-travel-weather-api
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics.token
    static_configs:
      - targets: ["127.0.0.1:14101"]

  # Dagster의 worker registry는 loopback 전용이며 공개 라우트가 없다.
  - job_name: kor-travel-weather-dagster
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:14103"]
