    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - mcp
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: '${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}'
      MCP_STREAMABLE_HTTP_PATH: /mcp
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}:${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-concierge-scheduler:
    image: ${KOR_TRAVEL_CONCIERGE_SCHEDULER_IMAGE:-kor-travel-concierge-scheduler:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}
      dockerfile: Dockerfile.python
    container_name: ${KOR_TRAVEL_CONCIERGE_SCHEDULER_CONTAINER:-kor-travel-concierge-scheduler-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - scheduler
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
      # 자막 비활성/숏폼 영상은 transcript_api·yt-dlp로 자막을 못 받으므로,
      # faster-whisper 오디오 전사 폴백을 켠다(무거움; env로 제어).
      TRANSCRIPT_WHISPER_ENABLED: ${KOR_TRAVEL_CONCIERGE_WHISPER_ENABLED:-true}
      WHISPER_MODEL_SIZE: ${KOR_TRAVEL_CONCIERGE_WHISPER_MODEL_SIZE:-base}
      FFMPEG_PATH: /usr/bin/ffmpeg
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-concierge-ui:
    image: ${KOR_TRAVEL_CONCIERGE_UI_IMAGE:-kor-travel-concierge-ui:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/frontend
    container_name: ${KOR_TRAVEL_CONCIERGE_UI_CONTAINER:-kor-travel-concierge-ui-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    # single-file boundary에서는 legacy override의 전체 Concierge .env를 UI에
    # 주입하지 않는다. UI가 필요한 server-only auth 값만 명시적으로 전달한다.
    command:
    - sh
    - -ec
    - >-
      [ -n "$$KTC_ADMIN_PASSWORD_HASH" ] && [ -n "$$KTC_UI_SESSION_SECRET" ] &&
      [ "$${#KTC_UI_SESSION_SECRET}" -ge 32 ] && [ -n "$$KTC_ADMIN_PROXY_SECRET" ] &&
      [ "$${#KTC_ADMIN_PROXY_SECRET}" -ge 32 ] || { echo "FATAL concierge-ui auth env invalid" >&2; exit 1; };
      npm run build && exec npm run start -- -H 0.0.0.0 -p ${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://127.0.0.1:12601
      BACKEND_API_KEY: ${KOR_TRAVEL_CONCIERGE_BACKEND_API_KEY:?KOR_TRAVEL_CONCIERGE_BACKEND_API_KEY must be explicitly set}
      NEXT_PUBLIC_VWORLD_SERVICE_KEY: ${KOR_TRAVEL_CONCIERGE_UI_VWORLD_SERVICE_KEY:?KOR_TRAVEL_CONCIERGE_UI_VWORLD_SERVICE_KEY must be explicitly set}
      KTC_ADMIN_USERNAME: ${KOR_TRAVEL_CONCIERGE_UI_ADMIN_USERNAME:?KOR_TRAVEL_CONCIERGE_UI_ADMIN_USERNAME must be explicitly set}
      KTC_ADMIN_PASSWORD_HASH: ${KOR_TRAVEL_CONCIERGE_UI_ADMIN_PASSWORD_HASH:?KOR_TRAVEL_CONCIERGE_UI_ADMIN_PASSWORD_HASH must be explicitly set}
      KTC_UI_SESSION_SECRET: ${KOR_TRAVEL_CONCIERGE_UI_SESSION_SECRET:?KOR_TRAVEL_CONCIERGE_UI_SESSION_SECRET must be explicitly set}
      KTC_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_CONCIERGE_UI_ADMIN_PROXY_SECRET:?KOR_TRAVEL_CONCIERGE_UI_ADMIN_PROXY_SECRET must be explicitly set}
      KTC_UI_TRUST_FORWARDED_IPS: ${KOR_TRAVEL_CONCIERGE_UI_TRUST_FORWARDED_IPS:-false}
      KTC_UI_PUBLIC_ORIGINS: ${KOR_TRAVEL_CONCIERGE_UI_PUBLIC_ORIGINS:-}
      NEXT_PUBLIC_API_BASE_URL: ${KOR_TRAVEL_CONCIERGE_UI_PUBLIC_API_BASE_URL:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}
  # #171 / ADR-35 — Map state principal의 ownership/ACL은 통합 PostgreSQL과
  # 공유할 수 없다. host network에서 `12700` loopback만 listen하는 전용 instance다.
  # (ADR-047 대역 규칙에 맞춰 2026-08-17에 12703 -> 12700으로 옮겼다: 127xx=map.)
  kor-travel-map-postgres:
    # application-300 reference manifest가 증명한 immutable PostGIS image만
    # 허용한다. floating tag는 catalog/seed receipt의 전제가 될 수 없다.
    image: ${KOR_TRAVEL_MAP_POSTGRES_IMAGE_ID:?KOR_TRAVEL_MAP_POSTGRES_IMAGE_ID must be explicitly set}
    container_name: ${KOR_TRAVEL_MAP_POSTGRES_CONTAINER:-kor-travel-map-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      # application DB는 별도 fresh transaction이 template0에서 만든다. PID 1과
      # healthcheck는 drop/create 중에도 남는 maintenance DB만 사용한다.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set}
      # bootstrap superuser password는 long-lived Config.Env가 아니라 Docker secret
      # file로만 전달한다. role bootstrap one-shot만 DSN에 credential을 보관한다.
      POSTGRES_PASSWORD_FILE: /run/secrets/kor-travel-map-postgres-password
      # loopback을 scram으로 잠근다. initdb를 `--auth-host` 없이 부르면 기본이
      # `trust`이고, 그때 생기는 `host all all 127.0.0.1/32 trust`가 entrypoint가
      # 뒤에 붙이는 `host all all all scram-sha-256`보다 **먼저 매칭된다**
      # (first-match-wins). host network를 공유하는 다른 컨테이너에서 비밀번호
      # 없이 이 인스턴스의 superuser로 붙을 수 있다는 뜻이다 — 2026-08-17에 prod
      # 네 인스턴스 전부에서 실증했다. instance를 나눈 의미가 사라진다.
      # ⚠️ 이 값은 **initdb 때만** 쓰인다. 이미 만들어진 PGDATA는 pg_hba.conf를
      #    직접 고쳐야 한다.
      # `--auth-local`은 건드리지 않는다 — 유닉스 소켓은 컨테이너 파일시스템
      # 안이라 밖에서 못 닿고, entrypoint의 initdb.d 스크립트가 그 경로로 붙는다.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}
    # 아래 값은 2026-08-15 커토버에서 **실측한 원본 인스턴스 설정**이다. 빠뜨리면
    # 조용히 달라진다 — 확장은 로드되지 않은 채 CREATE만 성공하고, 튜닝값은 기본값으로
    # 떨어져 같은 쿼리가 다른 계획을 탄다.
    #
    # - pg_prewarm: 부팅 후 buffer warm-up (T-102). 저장소 standalone compose도 켠다.
    # - pg_stat_statements: 원본 인스턴스가 쓰던 것. `public`에 확장이 설치돼 있어
    #   라이브러리가 없으면 그 확장이 반쪽이 된다.
    - -c
    - shared_preload_libraries=pg_prewarm,pg_stat_statements
    - -c
    - pg_prewarm.autoprewarm=on
    - -c
    - shared_buffers=${KOR_TRAVEL_MAP_POSTGRES_SHARED_BUFFERS:-512MB}
    - -c
    - work_mem=${KOR_TRAVEL_MAP_POSTGRES_WORK_MEM:-64MB}
    - -c
    - maintenance_work_mem=${KOR_TRAVEL_MAP_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    - -c
    - effective_cache_size=${KOR_TRAVEL_MAP_POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
    # 원본 인스턴스 실측값. 빠지면 기본값(4 / 1GB)으로 떨어져 PostGIS 인덱스 스캔
    # 선택과 체크포인트 빈도가 달라진다 — 주석이 '실측 원본'이라 주장하면서 실제로
    # 이 둘을 빠뜨리고 있었다(2026-08-17 적대 리뷰).
    - -c
    - random_page_cost=${KOR_TRAVEL_MAP_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${KOR_TRAVEL_MAP_POSTGRES_MAX_WAL_SIZE:-2GB}
    volumes:
    - ${KOR_TRAVEL_MAP_PGDATA:-/home/digitie/kor-travel-map-data/pgdata}:/var/lib/postgresql/data
    secrets:
    - source: kor-travel-map-postgres-password
      target: kor-travel-map-postgres-password
    ports:
    - 127.0.0.1:${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}:${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}
    healthcheck:
      test:
      - CMD-SHELL
      - test "$$(cat /proc/1/comm)" = postgres && pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700} -U ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set} -d postgres
      interval: 10s
      timeout: 5s
      retries: 20

  # Dagster metadata DB는 Map application role bootstrap의 대상이 아니므로 별도의
  # Manager one-shot으로만 생성하고, F1D reset 뒤에는 metadata owner를 다시 고정한다.
  kor-travel-map-dagster-db-init:
    profiles:
    - bootstrap
    image: postgres:16-alpine
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:?KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:?KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:?KOR_TRAVEL_MAP_DAGSTER_METADATA_USER must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:?KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD must be explicitly set}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      for identifier in "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER"; do
        case "$$identifier" in
          '' | *[!A-Za-z0-9_]* | [!A-Za-z_]* )
            echo "invalid PostgreSQL identifier" >&2; exit 1 ;;
        esac
      done
      psql --dbname "$$KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN" --set ON_ERROR_STOP=1 \
        --set dagster_db="$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" \
        --set metadata_user="$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" \
        --set metadata_password="$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD" <<'SQL'
      SELECT format(
        'CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION PASSWORD %L',
        :'metadata_user',
        :'metadata_password'
      )
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'metadata_user')
      \gexec
      SELECT format(
        'ALTER ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION PASSWORD %L',
        :'metadata_user',
        :'metadata_password'
      )
      \gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'dagster_db', :'metadata_user')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'dagster_db')
      \gexec
      SELECT format('ALTER DATABASE %I OWNER TO %I', :'dagster_db', :'metadata_user')
      \gexec
      SQL

  # Map 정본 스크립트를 source staging path에서 read-only로 실행한다. profile 밖의
  # `compose up`에는 포함되지 않으며 Manager는 `run --rm`으로만 호출한다.
  kor-travel-map-db-role-bootstrap:
    profiles:
    - bootstrap
    image: postgres:16-alpine
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_ENABLED: "true"
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_PHASE: baseline-300
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE: ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:?KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set}
      # ADR-100 (superset window): Map은 세 LOGIN을 ktm_feature_service 하나로 합쳤고
      # docker/postgres-role-bootstrap.sh와 scripts/database-credential-preflight.sh는
      # 이제 아래 두 이름을 요구한다. 구 여섯 이름은 아직 함께 보낸다 — Map의 이전
      # 형상도 계속 동작해야 하므로 이 PR은 순수 superset이고, 제거는 후속 PR이다.
      KOR_TRAVEL_MAP_SERVICE_PASSWORD: ${KOR_TRAVEL_MAP_SERVICE_PASSWORD:?KOR_TRAVEL_MAP_SERVICE_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_PG_DSN:?KOR_TRAVEL_MAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:?KOR_TRAVEL_MAP_MIGRATOR_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:?KOR_TRAVEL_MAP_MIGRATOR_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:?KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:?KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:?KOR_TRAVEL_MAP_DAGSTER_METADATA_USER must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:?KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_DAGSTER_PG_URL must be explicitly set}
    volumes:
    - ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}/docker/postgres-role-bootstrap.sh:/usr/local/bin/postgres-role-bootstrap:ro
    - ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}/scripts/database-credential-preflight.sh:/usr/local/lib/kor-travel-map/database-credential-preflight.sh:ro
    entrypoint:
    - /bin/sh
    - /usr/local/bin/postgres-role-bootstrap

  # virgin application DB에 스키마를 적용하는 one-shot. paired API image의 고정
  # entrypoint만 실행하며 restricted service DSN 외의 권한을 받지 않는다.
  #
  # ADR-101 이전에는 두 service였다 — `fresh-300`이 root migration을 적용하고
  # `fresh-finalize`가 ACL을 재조정했다. 그 둘이 나눠 하던 일이 revision `400` 하나와
  # `kortravelmap.infra.runtime_privileges` 하나로 합쳐졌고, 두 executable은 Map
  # 이미지에서 삭제됐다.
  #
  # 하나로 두는 이유: 두 명령은 같은 DB를 같은 세션 권한으로 연속 처리하고 둘 다
  # 멱등하다(`alembic upgrade head`는 이미 head면 무연산). 나누면 "스키마는 올라갔고
  # ACL은 아니다"라는 이름 붙은 중간 상태가 생기는데, 그 상태에서 할 수 있는 일이
  # 다시 돌리는 것뿐이라 이름이 값을 잃었다.
  kor-travel-map-application-schema:
    profiles:
    - bootstrap
    image: ${KOR_TRAVEL_MAP_API_IMAGE:-kor-travel-map-api:latest-main}
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      KOR_TRAVEL_MAP_APPLICATION_SCHEMA_PROFILE: production
      KOR_TRAVEL_MAP_APPLICATION_SCHEMA_IMAGE_ID: ${KOR_TRAVEL_MAP_API_IMAGE:?KOR_TRAVEL_MAP_API_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_PG_DSN:?KOR_TRAVEL_MAP_PG_DSN must be explicitly set}
      # migration만 schema owner로 돈다. 런타임 서비스는 이 스위치를 받지 않는다.
      KOR_TRAVEL_MAP_ALEMBIC_USE_SCHEMA_OWNER_ROLE: "true"
    entrypoint:
    - /bin/sh
    - -c
    command:
    - |
      set -eu
      /usr/local/bin/python -I -m alembic upgrade head
      /usr/local/bin/python -I -m kortravelmap.infra.runtime_privileges

  kor-travel-map-api:
    image: ${KOR_TRAVEL_MAP_API_IMAGE:-kor-travel-map-api:latest-main}
    container_name: ${KOR_TRAVEL_MAP_API_CONTAINER:-kor-travel-map-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kor-travel-geo-api:
        condition: service_healthy
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_API_HOST: 0.0.0.0
      KOR_TRAVEL_MAP_API_PORT: ${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}
      KOR_TRAVEL_MAP_API_CORS_ALLOW_ORIGINS: '["${KTDM_PROD_URL_MAP:-http://localhost:${KOR_TRAVEL_MAP_UI_PORT:-12705}}","http://localhost:${KOR_TRAVEL_MAP_UI_PORT:-12705}","http://127.0.0.1:${KOR_TRAVEL_MAP_UI_PORT:-12705}"]'
      KOR_TRAVEL_MAP_API_DAGSTER_URL: http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_CONTAINER_PORT:-12702}
      # admin API가 클라이언트(admin UI / C7 게이트)에 노출하는 Dagster GraphQL endpoint는
      # 내부(127.0.0.1)가 아니라 공개 https origin이어야 한다(ops-c7-schedule-write의
      # canonicalGraphqlSha256이 https 강제). 서버측 호출용 DAGSTER_URL(내부)과 분리해
      # KTDM_PROD_URL_MAP_DAGSTER에서 파생한다. dev(미설정)면 내부로 fallback.
      KOR_TRAVEL_MAP_API_DAGSTER_GRAPHQL_URL: ${KTDM_PROD_URL_MAP_DAGSTER:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_CONTAINER_PORT:-12702}}/graphql
      # allowlist에 공개 dagster host를 추가해야 위 공개 graphql_url이 SSRF 검증을 통과한다.
      KOR_TRAVEL_MAP_API_DAGSTER_ALLOWED_HOSTS: '["kor-travel-map-dagster","127.0.0.1","localhost","::1"${KTDM_PROD_MAP_DAGSTER_HOST:+,"${KTDM_PROD_MAP_DAGSTER_HOST}"}]'
      # reloadRepositoryLocation(schedule cron override 반영 시 호출)은 code location을
      # 다시 로드하며 완료까지 ~4s+ 걸린다. 기본 3s 타임아웃으로는 이 reload가 timeout(503)돼
      # C7 ops-c7-schedule-write의 cron 단계가 실패한다. 상한(30s) 내에서 여유를 준다.
      KOR_TRAVEL_MAP_API_DAGSTER_REQUEST_TIMEOUT_SECONDS: "30"
      KOR_TRAVEL_MAP_API_PROFILE: production
      KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED: 'true'
      KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED: 'false'
      # ADR-25/T-040 — production feature 관리 REST는 image default가 아니라
      # review된 Manager source가 명시적으로 활성화한다.
      KOR_TRAVEL_MAP_API_FEATURES_ROUTES_ENABLED: 'true'
      # ADR-24/T-038 — standalone Map은 destructive default false다. Manager가
      # 관리하는 production runtime만 review된 source에서 명시적으로 승인한다.
      KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED: 'true'
      KOR_TRAVEL_MAP_API_PROMETHEUS_METRICS_ENABLED: 'false'
      KOR_TRAVEL_MAP_API_ADMIN_TRUSTED_PROXY_CIDRS: '["127.0.0.1/32","::1/128"]'
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_API_SERVICE_TOKEN: ${KOR_TRAVEL_MAP_API_SERVICE_TOKEN:?KOR_TRAVEL_MAP_API_SERVICE_TOKEN must be explicitly set}
      KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET: ${KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET:?KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_API_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED: ${KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED:?KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED must be explicitly set}
      # T-VN-40 canonical snapshot 검증은 digest만 소비한다. 원시 PinVi token은
      # Map API·UI·Dagster·bootstrap 어디에도 전달하지 않는다.
      KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256:-}
      KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256:-}
      # T-VN-M01: 원문 manual Feature 생성 token은 Map UI server runtime에만,
      # API에는 같은 원문에서 파생한 digest만 전달한다.
      KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256:?KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256 must be explicitly set}
      KOR_TRAVEL_MAP_API_ADMIN_MANUAL_FEATURE_CREATE_ENABLED: ${KOR_TRAVEL_MAP_API_ADMIN_MANUAL_FEATURE_CREATE_ENABLED:-false}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_PG_DSN:?KOR_TRAVEL_MAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_API_IMAGE_ID: ${KOR_TRAVEL_MAP_API_IMAGE:?KOR_TRAVEL_MAP_API_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: 'true'
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KRTOUR_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL: ${KTDM_PROD_URL_S3_API:-http://127.0.0.1:${RUSTFS_API_PORT:-12101}}/${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KRTOUR_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_DOCKER_GEO_BASE_URL:-http://127.0.0.1:12501}
      # issue #114 — reverse_geocoder가 map dagster의 전역 필수 리소스라 이 key 없이는
      # provider ETL job 전체가 fail-close된다(GeoAuthNotConfiguredError). API 자체는
      # geo client를 직접 쓰지 않지만 세 서비스를 동일하게 결선해 drift를 막는다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY}
      # issue #111 — Map image의 alembic head가 v2 pinned deployment input과 다르면
      # DB 연결 전에 기동을 거부한다. 이 값은 installer가 canonical env에 명시하며,
      # 빈 값이나 Compose 기본값은 허용하지 않는다.
      KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD: ${KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD:?KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD must be explicitly set}
    ports:
    - ${KOR_TRAVEL_MAP_API_PORT:-12701}:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('KOR_TRAVEL_MAP_API_PORT', '12701'), timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  kor-travel-map-ui:
    image: ${KOR_TRAVEL_MAP_UI_IMAGE:-kor-travel-map-ui:latest-main}
    build:
      context: ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}
      dockerfile: docker/frontend.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${KTDM_PROD_URL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${KTDM_PROD_URL_MAP_DAGSTER:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
        NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${KTDM_PROD_URL_GEO_API:-http://127.0.0.1:12501}
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    container_name: ${KOR_TRAVEL_MAP_UI_CONTAINER:-kor-travel-map-ui-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-api:
        condition: service_healthy
    environment:
      PORT: ${KOR_TRAVEL_MAP_UI_CONTAINER_PORT:-12705}
      HOSTNAME: 0.0.0.0
      KOR_TRAVEL_MAP_UI_ADMIN_USERNAME: ${KOR_TRAVEL_MAP_UI_ADMIN_USERNAME:?KOR_TRAVEL_MAP_UI_ADMIN_USERNAME must be explicitly set}
      KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH: ${KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH:?KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH must be explicitly set}
      KOR_TRAVEL_MAP_UI_SESSION_SECRET: ${KOR_TRAVEL_MAP_UI_SESSION_SECRET:?KOR_TRAVEL_MAP_UI_SESSION_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN: ${KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN:?KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN must be explicitly set}
      NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${KTDM_PROD_URL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
      NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${KTDM_PROD_URL_MAP_DAGSTER:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
      NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${KTDM_PROD_URL_GEO_API:-http://127.0.0.1:12501}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
      # Map UI `/api/geo` BFF는 Geo가 Map consumer에 발급한 server-only key만 쓴다.
      # VWorld/public build alias로 대체하거나 브라우저 query에서 덮어쓸 수 없다.
      KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:?KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY must be explicitly set}
    ports:
    - ${KOR_TRAVEL_MAP_UI_PORT:-12705}:${KOR_TRAVEL_MAP_UI_CONTAINER_PORT:-12705}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://127.0.0.1:' + (process.env.PORT || '12705')).then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  # ADR-069 짝(weather/geo/transport/PinVi와 같은 code-server 분리 패턴) —
  # 실제 code location이 도는 유일한 프로세스. `DefaultRunLauncher`의 run
  # worker는 이 프로세스의 자식으로 뜬다. host network에서는 127.0.0.1이 곧
  # 호스트 loopback이므로(Map 저장소 자신의 docker-compose.yml처럼 netns를
  # 빌릴 필요가 없다) webserver/daemon과 그대로 통신한다. gRPC에는 인증이
  # 없으므로 `-h`는 loopback으로 고정한다(dagster-entrypoint.sh의 production
  # 봉인과 같은 이유 — weather의 code-server도 동일).
  kor-travel-map-dagster-code-server:
    image: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:-kor-travel-map-dagster:latest-main}
    command:
    - /usr/local/bin/dagster
    - api
    - grpc
    - -h
    - 127.0.0.1
    - -p
    - ${KOR_TRAVEL_MAP_DAGSTER_CODE_SERVER_PORT:-12703}
    - -m
    - kortravelmap.dagster.definitions
    container_name: ${KOR_TRAVEL_MAP_DAGSTER_CODE_SERVER_CONTAINER:-kor-travel-map-dagster-code-server-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kor-travel-map-dagster-storage-migrate:
        condition: service_completed_successfully
      kor-travel-map-api:
        condition: service_healthy
    environment:
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_CODE_SERVER_PORT: ${KOR_TRAVEL_MAP_DAGSTER_CODE_SERVER_PORT:-12703}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_DAGSTER_PG_URL must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:?KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256 must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_ADDRESS_VALIDATION: ${KOR_TRAVEL_MAP_DOCKER_ADDRESS_VALIDATION:-drop}
      KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH: ${KOR_TRAVEL_MAP_DOCKER_MOIS_SOURCE_DB_PATH:-/tmp/mois_source.db}
      KOR_TRAVEL_MAP_KMA_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_MAP_DOCKER_KMA_MAX_GRIDS:-80}
      KOR_TRAVEL_MAP_KMA_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_MAP_DOCKER_KMA_WEATHER_EXTRA_POINTS:-126.978,37.566;127.047,37.517;126.979,37.573;126.924,37.521;127.011,37.64;129.075,35.18;129.16,35.163;129.024,35.098;126.705,37.456;126.66,37.383;128.601,35.871;128.637,35.857;127.385,36.35;127.34,36.362;126.852,35.16;129.311,35.539;127.289,36.48;127.029,37.263;127.138,37.42;126.832,37.658;127.178,37.241;126.766,37.503;127.734,37.881;128.896,37.752;127.92,37.342;128.591,38.207;127.489,36.642;127.926,36.991;127.114,36.815;127.004,36.79;127.148,35.821;126.737,35.978;127.662,34.76;127.487,34.951;126.392,34.812;129.365,36.019;129.225,35.856;128.729,36.568;128.682,35.228;128.108,35.18;128.434,34.854;126.531,33.499;126.566,33.254;128.889,35.234;126.864,37.478;126.821,37.322;127.113,36.992;126.958,35.948;128.114,36.14;128.621,34.88;126.2838,36.673;127.4416,35.4118;128.7527,37.3221;129.4045,36.9182;127.9057,35.7043;126.0097,37.4346;126.7659,34.2899;127.7243,35.5217;128.9902,37.1551;130.9057,37.4845}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_PG_DSN:?KOR_TRAVEL_MAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_IMAGE:?KOR_TRAVEL_MAP_DAGSTER_IMAGE must be explicitly set}
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KRTOUR_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KRTOUR_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KRTOUR_MAP_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_DOCKER_GEO_BASE_URL:-http://127.0.0.1:12501}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_BASE_URL:-http://127.0.0.1:12601}
      KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_CONCIERGE_API_KEY:-}
      KOR_TRAVEL_MAP_SEOUL_OPEN_DATA_API_KEY: ${KOR_TRAVEL_MAP_SEOUL_OPEN_DATA_API_KEY:-${SEOUL_OPEN_DATA_API_KEY:-}}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-}
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-low_top_area}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS: ${KOR_TRAVEL_MAP_OPINET_LOW_TOP_MAX_CALLS:-${OPINET_LOW_TOP_MAX_CALLS:-90}}
      KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET: ${KOR_TRAVEL_MAP_OPINET_RUN_CALL_BUDGET:-${OPINET_RUN_CALL_BUDGET:-140}}
