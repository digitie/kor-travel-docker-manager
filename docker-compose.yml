    volumes:
    - ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}/deploy/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    - ./config/kor-travel-weather/workspace.yaml:/app/deploy/workspace.yaml:ro
    cpu_shares: 2048
    mem_reservation: 512m
    mem_swappiness: 10
    # `/server_info`는 webserver가 정적으로 주는 문서라 code location이 죽어도
    # 200이다 — GraphQL로 실제 code location이 로드됐는지 묻는다(geo/map/pinvi와
    # 같은 패턴, docker-compose.yml의 다른 dagster-webserver 블록 참고).
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import json, urllib.request as u; q = json.dumps({'query': '{repositoriesOrError{__typename}}'}).encode(); r = u.urlopen(u.Request('http://127.0.0.1:14107/graphql', data=q, headers={'Content-Type': 'application/json'}), timeout=5); d = json.load(r); t = d.get('data', {}).get('repositoriesOrError', {}).get('__typename'); raise SystemExit(0 if t == 'RepositoryConnection' else 'code location not loaded: %s' % t)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

