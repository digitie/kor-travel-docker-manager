# host-wide C6c mutation lease 디렉터리를 **부팅 시점에** 만든다.
#
# 왜 필요한가: `/run/lock`은 Debian 계열에서 `1777` sticky다. 즉 비특권 로컬 사용자도
# 그 아래에 디렉터리를 만들 수 있다. Manager가 런타임에 처음 만드는 구조라면, 재부팅
# 직후 그 자리를 선점당할 수 있고 — 그러면 소유자·mode 검증이 실패해
# **모든 컨테이너 mutation이 재부팅 전까지 영구 거부**된다. sticky bit 때문에 정리도
# root만 할 수 있다.
#
# systemd-tmpfiles는 early boot에 실행되고, `d` 타입은 이미 있는 디렉터리의 소유자와
# mode도 바로잡는다. 그래서 선점 창 자체가 사라진다.
#
# 설치:
#   sudo install -o root -g root -m 0644 \
#     deploy/tmpfiles.d/kor-travel-docker-manager.conf \
#     /usr/lib/tmpfiles.d/kor-travel-docker-manager.conf
#   sudo systemd-tmpfiles --create /usr/lib/tmpfiles.d/kor-travel-docker-manager.conf
#
# backend를 전용 서비스 계정으로 돌린다면 아래 root:root를 그 계정으로 바꾼다
# (자세한 절차는 docs/prod-deployment.md의 "비-root 서비스 계정" 절).
#
#Type Path                                Mode UID  GID  Age Argument
d     /run/lock/kor-travel-docker-manager 0700 root root -
