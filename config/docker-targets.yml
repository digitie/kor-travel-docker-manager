targets:
  db:
    # 대역은 `12000-12099` 그대로 둔다. 이 target이 실제로 가리키는 것은 geo
    # 인스턴스(:12500)지만, `geo` target이 이미 `12500-12599`를 갖고 있어 여기에
    # 같은 값을 넣으면 두 target이 한 대역을 주장한다. ADR-37과 `docs/ports.md`가
    # 이 자리를 "폐지된 통합 instance의 자리"로 적어 뒀으므로 그쪽을 정본으로 따른다.
    port_band: "12000-12099"
    depends_on: []
    display_name: Kor Travel Geo DB
    # 2026-08-17(ADR-37) 이전에는 이 target이 네 프로젝트의 DB를 다 담은 "통합 DB"였다.
    # 지금은 프로젝트마다 전용 instance를 쓰므로 이 target이 가리키는 것은 geo
    # 인스턴스 하나뿐이다. 나머지 셋은 각자 target(conc/map/pinvi)이 자기 postgres를
    # `services` 맨 앞에 갖는다. `db`라는 id와 `postgresql` alias는 손에 익은 이름이라
    # 남겨두되, 통합을 뜻하던 `shared-postgresql`은 뺐다 — 가리키는 것이 없다.
    description: Kor Travel Geo 전용 PostgreSQL/PostGIS 인스턴스(:12500)입니다. 예전 통합 DB의 자리입니다.
    aliases:
      - postgresql
      - postgres
      - database
      - geo-postgresql
    services:
      - kor-travel-geo-postgres
    runtime_services:
      - kor-travel-geo-postgres
    containers:
      - kor-travel-geo-postgresql
    init_steps:
      - name: db-schema-recovery
        description: kor-travel-geo database와 extension, schema grant를 idempotent 방식으로 보정합니다. 다른 프로젝트의 role·DB는 건드리지 않습니다(ADR-37).
        command:
          - exec
          - -T
          - kor-travel-geo-postgres
          - sh
          - /opt/kor-travel-docker-manager/ensure-kor-travel-geo-db.sh

  storage:
    port_band: "12100-12199"
    depends_on: [db]
    display_name: 통합 RustFS
    description: Kor Travel/PinVi 미디어와 원천 데이터를 저장하는 S3 호환 오브젝트 스토리지입니다.
    aliases:
      - rustfs
      - s3
      - object-storage
    services:
      - rustfs
    runtime_services:
      - rustfs
    containers:
      - rustfs
    init_steps:
      - name: rustfs-bucket-recovery
        description: RustFS 기동을 기다린 뒤 공용 bucket을 idempotent 방식으로 보정합니다.
        command:
          - run
          - --rm
          - rustfs-init

  gra:
    port_band: "12200-12299"
    depends_on: [storage]
    display_name: 공용 Grafana
    description: 다른 Kor Travel 앱에서도 공통 연계하는 Grafana Web UI입니다.
    aliases:
      - grafana
      - dashboard
      - visualization
    services:
      - grafana
    runtime_services:
      - grafana
    containers:
      - grafana
    init_steps: []

  cadv:
    port_band: "12300-12399"
    depends_on: [gra]
    display_name: cAdvisor Exporter
    description: Docker 컨테이너 리소스 메트릭을 Prometheus 형식으로 노출합니다.
    aliases:
      - cadvisor
      - exporter
      - metrics-exporter
    services:
      - cadvisor
    runtime_services:
      - cadvisor
    containers:
      - cadvisor
    init_steps: []

  prom:
    port_band: "12400-12499"
    depends_on: [cadv]
    display_name: Prometheus
    description: cAdvisor와 앱 메트릭을 수집하고 Grafana datasource로 제공하는 메트릭 저장소입니다.
    aliases:
      - prometheus
      - metrics
      - monitoring
    services:
      - prometheus
    runtime_services:
      - prometheus
    containers:
      - prometheus
    init_steps: []

  geo:
    port_band: "12500-12599"
    depends_on: [prom]
    display_name: Kor Travel Geo
    description: Kor Travel Geo API/Web UI와 원천 데이터 적재 상태를 관리합니다.
    aliases:
      - kor-travel-geo
      - kor-travel-geo-api
      - geocoder
      - reverse-geocoder
    services:
      - kor-travel-geo-api
      - kor-travel-geo-ui
    runtime_services:
      - kor-travel-geo-api
      - kor-travel-geo-ui
    containers:
      - kor-travel-geo-postgresql
      - rustfs
      - kor-travel-geo-api
      - kor-travel-geo-ui
    init_steps:
      - name: geo-source-verification
        description: /data/juso 마운트와 T-027 계열 핵심 적재 테이블을 검증합니다.
        command:
          - exec
          - -T
          - kor-travel-geo-postgres
          - sh
          - /opt/kor-travel-docker-manager/verify-kor-travel-geo-source.sh

  conc:
    port_band: "12600-12699"
    depends_on: [prom]
    display_name: Kor Travel Concierge
    description: Kor Travel Concierge API/MCP/Scheduler/Web UI를 실행합니다. geo에는 의존하지 않는다.
    aliases:
      - kor-travel-concierge
      - concierge
      - agent
      - conc
    services:
      - kor-travel-concierge-postgres
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
    runtime_services:
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
    containers:
      - kor-travel-geo-postgresql
      - kor-travel-concierge-postgresql
      - rustfs
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
    init_steps: []

  map:
    port_band: "12700-12799"
    depends_on: [geo, conc]
    display_name: Kor Travel Map
    description: 전용 PostgreSQL과 Kor Travel Map API/Dagster/Web UI를 실행하며 Kor Travel Geo와 Kor Travel Concierge에 의존한다.
    aliases:
      - kor-travel-map
      - krtour-map
      - python-krtour-map
    services:
      - kor-travel-map-postgres
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster
      - kor-travel-map-dagster-daemon
    runtime_services:
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster
      - kor-travel-map-dagster-daemon
    containers:
      - kor-travel-geo-postgresql
      - kor-travel-concierge-postgresql
      - kor-travel-map-postgresql
      - rustfs
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster
      - kor-travel-map-dagster-daemon
    init_steps: []

  pinvi:
    port_band: "12800-12899"
    depends_on: [map]
    display_name: PinVi
    description: PinVi API/Web UI/Dagster를 실행하며 Kor Travel Map에 의존한다.
    aliases:
      - srv
      - main
      - pinvi
      - pinvi-api
      - pinvi-web
    services:
      - pinvi-postgres
      - pinvi-api
      - pinvi-web
      - pinvi-dagster
      - pinvi-dagster-daemon
    runtime_services:
      - pinvi-api
      - pinvi-web
      - pinvi-dagster
      - pinvi-dagster-daemon
    containers:
      - kor-travel-geo-postgresql
      - kor-travel-concierge-postgresql
      - kor-travel-map-postgresql
      - pinvi-postgresql
      - rustfs
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster
      - kor-travel-map-dagster-daemon
      - pinvi-api
      - pinvi-web
      - pinvi-dagster
      - pinvi-dagster-daemon
    init_steps: []

  all:
    display_name: 전체 Kor Travel/PinVi 개발 인프라
    description: dependency_order 전체를 순서대로 실행합니다.
    aliases:
      - default
    include:
      - db
      - storage
      - gra
      - cadv
      - prom
      - geo
      - conc
      - map
      - pinvi
    services: []
    runtime_services: []
    containers:
      - kor-travel-geo-postgresql
      - kor-travel-concierge-postgresql
      - kor-travel-map-postgresql
      - pinvi-postgresql
      - rustfs
      - grafana
      - cadvisor
      - prometheus
      - kor-travel-geo-api
      - kor-travel-geo-ui
      - kor-travel-concierge-api
      - kor-travel-concierge-mcp
      - kor-travel-concierge-scheduler
      - kor-travel-concierge-ui
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster
      - kor-travel-map-dagster-daemon
      - pinvi-api
      - pinvi-web
      - pinvi-dagster
      - pinvi-dagster-daemon
    init_steps: []

  airport-db:
    # 형제 프로젝트다 — compose 정본이 이 저장소 밖에 있고, 배포는 각 저장소가
    # 계속 소유한다. Manager는 상태를 보고 컨테이너 수명주기(start/stop/restart)만
    # 다룬다. `control_container`가 Docker SDK로 컨테이너를 직접 잡으므로 그 축은
    # compose 프로젝트와 무관하게 이미 동작한다.
    external_project:
      project: kor-travel-airport-db
      working_dir: /home/digitie/apps/kor-travel-airport
      config_files:
        - docker-compose.db.yml
    port_band: "14000-14000"
    depends_on: []
    display_name: Kor Travel Airport DB
    description: Kor Travel Airport 전용 PostgreSQL 인스턴스(:14000)입니다. compose 정본은 apps/kor-travel-airport/docker-compose.db.yml입니다.
    aliases:
      - airport-postgresql
      - airport-postgres
    services:
      - postgres
    runtime_services:
      - postgres
    containers:
      - kor-travel-airport-postgresql

  airport:
    external_project:
      project: kor-travel-airport
      working_dir: /home/digitie/apps/kor-travel-airport
      config_files:
        - docker-compose.yml
    port_band: "14001-14099"
    depends_on: [airport-db]
    display_name: Kor Travel Airport
    description: 공항 정보 서비스입니다. 백엔드(:14001)와 프런트엔드(:14002)로 구성되며 전용 DB target(airport-db)에 의존합니다.
    aliases:
      - kor-travel-airport
    services:
      - backend
      - frontend
