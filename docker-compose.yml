  kor-travel-weather-dagster-gateway:
    image: ${KOR_TRAVEL_WEATHER_DAGSTER_GATEWAY_IMAGE:-kor-travel-weather-dagster-gateway:latest-main}
    build:
      context: ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}
      dockerfile: deploy/Dockerfile.dagster-gateway
    container_name: ${KOR_TRAVEL_WEATHER_DAGSTER_GATEWAY_CONTAINER:-kor-travel-weather-dagster-gateway-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-weather-dagster-webserver:
        condition: service_started
    environment:
      DAGSTER_UI_USER: ${DAGSTER_UI_USER:-admin}
      DAGSTER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
    volumes:
    # weather 자신의 baked conf(deploy/nginx/dagster-gateway.conf)는
    # `http://dagster-webserver:14102`로 서비스명 DNS를 쓴다 — host networking엔
    # 없고, 이 컨테이너 자신의 14102 listen과도 충돌한다. Manager가 오버라이드를
    # 소유한다(support file #2) — weather 저장소는 안 건드린다.
    - ./config/kor-travel-weather/dagster-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - ${KOR_TRAVEL_WEATHER_DAGSTER_GATEWAY_PORT:-14102}:${KOR_TRAVEL_WEATHER_DAGSTER_GATEWAY_PORT:-14102}

  kor-travel-weather-web:
    image: ${KOR_TRAVEL_WEATHER_WEB_IMAGE:-kor-travel-weather-web:latest-main}
    build:
      context: ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    container_name: ${KOR_TRAVEL_WEATHER_WEB_CONTAINER:-kor-travel-weather-web-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-weather-api:
        condition: service_healthy
      kor-travel-weather-dagster-gateway:
        condition: service_started
    # command: 오버라이드 불필요 — deploy/Dockerfile.web이 이미
    # `next start -- --hostname 0.0.0.0 --port 14105`를 이미지 CMD로 굽는다.
    environment:
      # weather 자신의 compose.yaml은 여기서 서비스명 DNS를 썼다(서버사이드
      # fetch라 브라우저가 아니라 web 컨테이너 자신이 부른다) — host 모드엔
      # 없으니 loopback으로 바꾼다.
      WEATHER_API_INTERNAL_URL: http://127.0.0.1:14101
      # dagster-webserver의 새 내부 전용 포트(14107)를 가리킨다 — 공개
      # gateway(14102)가 아니다. weather 자신의 원래 의도(이 Next 프록시는
      # gateway를 거치지 않고 내부 dagster 서비스에 직접 붙는다)를 포트 재배치
      # 아래서도 그대로 지킨다.
      DAGSTER_UI_INTERNAL_URL: http://127.0.0.1:14107
      NEXT_PUBLIC_DAGSTER_URL: ${NEXT_PUBLIC_DAGSTER_URL:-https://weather-dagster.digitie.mywire.org}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
      WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      WEATHER_UI_USER: ${WEATHER_UI_USER:-admin}
      WEATHER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
      WEATHER_UI_PASSWORD_HASH: ${WEATHER_UI_PASSWORD_HASH:-}
      WEATHER_UI_SESSION_SECRET: ${WEATHER_UI_SESSION_SECRET:?set WEATHER_UI_SESSION_SECRET in .env}
      # 기본값을 비워 둔다 — n150 전용 값(HAProxy가 X-Forwarded-For를 벗기고
      # 붙이는 걸 전제하는 TRUST_PROXY, 실 공개 origin)을 이 파일의 기본값으로
      # 못박지 않는다. 다른 모든 internal target의 대응 설정
      # (KOR_TRAVEL_GEO_DAGSTER_PUBLIC_URL, KOR_TRAVEL_CONCIERGE_UI_PUBLIC_ORIGINS
      # 등)도 전부 빈 기본값 + n150 자신의 .env(추적 안 됨)에만 실값을 둔다 —
      # 이 파일(추적됨)에 prod 전용 값을 못박으면 CI·fresh clone·로컬 개발이
      # 조용히 그 값을 물려받는다(TRUST_PROXY=true인데 실제 HAProxy가 없으면
      # X-Forwarded-For 스푸핑 경로가 열리고, 동시에 로컬 CSRF 검사가 prod
      # HTTPS origin과 안 맞아 깨진다 — weather 자신의 deploy/compose.n150.yaml
      # 주석이 이 위험을 이미 명시한다).
      WEATHER_UI_TRUST_PROXY: ${WEATHER_UI_TRUST_PROXY:-}
      WEATHER_UI_PUBLIC_ORIGIN: ${WEATHER_UI_PUBLIC_ORIGIN:-}
    ports:
    - ${KOR_TRAVEL_WEATHER_WEB_PORT:-14105}:${KOR_TRAVEL_WEATHER_WEB_PORT:-14105}

  kor-travel-weather-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${KOR_TRAVEL_WEATHER_PROMETHEUS_CONTAINER:-kor-travel-weather-prometheus}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    user: ${KOR_TRAVEL_WEATHER_PROMETHEUS_RUN_AS_USER:-0}
    depends_on:
      kor-travel-weather-api:
        condition: service_healthy
      kor-travel-weather-dagster-code-server:
        condition: service_started
    secrets:
    - source: kor-travel-weather-metrics-token
      target: metrics.token
    # ⚠️ weather 자신의 command는 --web.listen-address를 생략하고 bridge 모드의
    # `127.0.0.1:14104:9090` publish 재매핑에 의존했다(컨테이너는 이미지 기본
    # 9090을 듣고, host 쪽만 NAT으로 14104로 바뀐다). network_mode: host는
    # 재매핑이 없다 — 프로세스 자신이 14104를 들어야 한다. Manager 자신의
    # `prometheus:` 서비스도 같은 이유로 이렇게 한다.
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.listen-address=:${KOR_TRAVEL_WEATHER_PROMETHEUS_PORT:-14104}
    volumes:
    # weather 자신의 deploy/prometheus/prometheus.yml은 `api:14101` /
    # `dagster-code-server:14103`(서비스명 DNS)를 스크랩한다 — Manager 소유의
    # 127.0.0.1 재작성 사본으로 교체(support file #3). alerts.yml은 DNS 참조가
    # 없어 weather 자신의 체크아웃에서 그대로 bind mount한다.
    - ./config/kor-travel-weather/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - ${KOR_TRAVEL_WEATHER_PROMETHEUS_DATA_DIR:-/home/digitie/kor-travel-weather-data/prometheus}:/prometheus
    ports:
    - ${KOR_TRAVEL_WEATHER_PROMETHEUS_PORT:-14104}:${KOR_TRAVEL_WEATHER_PROMETHEUS_PORT:-14104}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:14104/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

secrets:
  kor-travel-geo-postgres-password:
    environment: KOR_TRAVEL_GEO_POSTGRES_PASSWORD
  kor-travel-map-postgres-password:
    environment: KOR_TRAVEL_MAP_POSTGRES_PASSWORD
  kor-travel-concierge-postgres-password:
    environment: KOR_TRAVEL_CONCIERGE_POSTGRES_PASSWORD
  pinvi-postgres-password:
    environment: PINVI_POSTGRES_PASSWORD
  kor-travel-shared-postgres-password:
    environment: KOR_TRAVEL_SHARED_POSTGRES_PASSWORD
  kor-travel-concierge-shared-app-password:
    environment: KOR_TRAVEL_CONCIERGE_SHARED_APP_PASSWORD
  kor-travel-geo-shared-app-password:
    environment: KOR_TRAVEL_GEO_SHARED_APP_PASSWORD
  pinvi-shared-app-password:
    environment: PINVI_APP_DB_PASSWORD
  kor-travel-weather-shared-app-password:
    environment: KOR_TRAVEL_WEATHER_SHARED_APP_PASSWORD
  kor-travel-transport-shared-app-password:
    environment: KOR_TRAVEL_TRANSPORT_SHARED_APP_PASSWORD
  kor-travel-weather-metrics-token:
    environment: KOR_TRAVEL_WEATHER_METRICS_TOKEN
