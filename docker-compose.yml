      kor-travel-map-postgres:
        condition: service_healthy
    command:
    - ktm-dagster-storage
    - migrate
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_DAGSTER_PG_URL must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN must be explicitly set}
    # C0의 external-DB overlay와 같은 candidate image가 host gateway DSN도
    # 해석할 수 있게 한다. host network를 쓰는 기본 경로에는 영향이 없다.
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-map-dagster-daemon:
    image: ${KOR_TRAVEL_MAP_DAGSTER_DAEMON_IMAGE:-kor-travel-map-dagster-daemon:latest-main}
    build:
      context: ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
    container_name: ${KOR_TRAVEL_MAP_DAGSTER_DAEMON_CONTAINER:-kor-travel-map-dagster-daemon-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
