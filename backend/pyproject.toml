[tool.poetry]
name = "kor-travel-docker-manager-backend"
version = "0.1.0"
description = "FastAPI backend for managing PostgreSQL and RustFS docker containers"
authors = ["digitie <digitie@gmail.com>"]
readme = "../README.md"
packages = [{include = "kor_travel_docker_manager", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "==0.165.0"
uvicorn = "==0.54.0"
docker = "==7.2.0"
pydantic = "==2.14.4"
pydantic-core = "==2.50.5"
pydantic-settings = "==2.16.3"
python-dotenv = "==1.2.4"
pyyaml = "==6.0.3"
websockets = "==17.4"
sqlalchemy = "==2.1.9"
httpx = "==0.28.1"

[tool.poetry.scripts]
ktdctl = "kor_travel_docker_manager.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "==9.2.0"
ruff = "==0.17.6"
mypy = "==2.4.1"
types-docker = "==7.2.0.20261102"
types-PyYAML = "==6.0.12.20261113"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "E402"]
