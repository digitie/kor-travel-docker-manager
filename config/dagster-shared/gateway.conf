# 공용 Dagster gateway(11001)의 nginx 설정 **전체** — conf.d 조각이 아니다(ADR-54).
#
# gateway는 비-root(nginx, 101)로 돈다. 그래서 root가 필요한 이미지 기본 경로(`/var/run`의 pid,
# `/var/cache/nginx`의 temp)를 쓰지 않고 전부 `/tmp/nginx`로 옮긴다 — 설정을 통째로 소유하는 이유다.
#
# compose의 기동 스크립트(`kor-travel-dagster-gateway`)가 이 파일을 `envsubst`로 풀어 `/tmp/nginx/nginx.conf`를
# 만든다. 풀리는 것은 아래 셋뿐이다(nginx 자신의 `$변수`는 그대로 남는다).
#   ${DAGSTER_GATEWAY_PORT}        듣는 포트(11001, 0.0.0.0 — OPNsense HAProxy가 LAN으로 닿는다)
#   ${DAGSTER_WEBSERVER_PORT}      공용 webserver(127.0.0.1:11002)
#   ${DAGSTER_CSP_FRAME_ANCESTORS} iframe을 허용할 origin들(앞에 공백, 없으면 빈 문자열)
# 같은 스크립트가 `/tmp/nginx/htpasswd`와 POST를 허용할 origin 목록 `/tmp/nginx/allowed-origins.map`을
# 쓴다. 형태는 weather(`config/kor-travel-weather/dagster-gateway.conf`)·transport gateway와 같다 —
# Basic Auth, same-origin이 아닌 POST 거부, `/health`만 인증 없음.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # POST는 브라우저가 싣는 Origin이 허용 목록에 있을 때만 통과한다. Origin이 없는 POST(비-브라우저
    # 호출)도 거부한다 — 서버 쪽 소비자(Map·PinVi·geo API, weather web의 프록시)는 gateway가 아니라
    # 127.0.0.1의 webserver에 직접 붙는다.
    map $http_origin $dagster_same_origin {
        default 0;
        include /tmp/nginx/allowed-origins.map;
    }

    map "$request_method:$dagster_same_origin" $dagster_csrf_block {
        default 0;
        "POST:0" 1;
    }

    # WebSocket(GraphQL subscription — 모든 테넌트의 run·compute log가 흐른다)도 Origin을 본다. 브라우저의
    # 교차 사이트 `new WebSocket(...)`은 캐시된 Basic Auth를 싣고 CORS를 받지 않는다(적대 리뷰 M1).
    map "$http_upgrade:$dagster_same_origin" $dagster_upgrade_block {
        default 0;
        "~^.+:0$" 1;
    }

    # `/graphql`은 GET으로도 `query`를 **실행한다**(mutation 포함 — dagster-webserver 1.13은 Accept에
    # text/html이 없으면 query 인자를 실행한다). 교차 사이트 `<img src=".../graphql?query=mutation{...}">`가
    # 캐시된 Basic Auth로 그것을 부른다(적대 리뷰 H2). 그래서 `/graphql`은 (1) 인자를 하나도 받지 않고(아래 map),
    # (2) 브라우저가 싣는 `Sec-Fetch-Site`가 same-origin·none(주소창)일 때만 받는다. 비-브라우저 호출은 그
    # 헤더가 없다 — 통과시키고 Basic Auth와 POST Origin 검사에 맡긴다. `/`(UI HTML)는 iframe으로 열리므로
    # 이 검사를 받지 않는다 — UI가 그 안에서 부르는 `/graphql`은 same-origin이다.
    map $uri $dagster_graphql_path {
        default 0;
        "~^/graphql" 1;
    }
    map "$dagster_graphql_path:$http_sec_fetch_site" $dagster_foreign_graphql {
        default 1;
        "~^0:" 0;
        "1:" 0;
        "1:same-origin" 0;
        "1:none" 0;
    }
    # 인자 **전부**를 거부한다 — `$arg_query`는 디코드 전 이름의 첫 값만 보지만 webserver(Starlette)는 이름을
    # 디코드하고 마지막 값을 쓴다. `?%71uery=…`·`?query=&query=…`가 그 틈으로 지나갔다(재리뷰 MED-1). UI는
    # `/graphql`을 POST와 WebSocket으로만 쓰고, GraphiQL도 인자 없이 열린다.
    map "$dagster_graphql_path:$args" $dagster_graphql_args {
        default 1;
        "~^0:" 0;
        "1:" 0;
    }

    map $http_upgrade $dagster_connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen ${DAGSTER_GATEWAY_PORT};
        server_name _;

        # HAProxy·healthcheck용 — 인증 없이 204만 준다.
        location = /health {
            auth_basic off;
            return 204;
        }

        location / {
            if ($dagster_csrf_block) { return 403; }
            if ($dagster_upgrade_block) { return 403; }
            if ($dagster_foreign_graphql) { return 403; }
            if ($dagster_graphql_args) { return 403; }
            auth_basic "kor-travel shared Dagster";
            auth_basic_user_file /tmp/nginx/htpasswd;

            proxy_pass http://127.0.0.1:${DAGSTER_WEBSERVER_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $dagster_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;

            # iframe은 자기 자신과 허용한 프로젝트 UI에서만 연다. Dagster webserver는 자기 CSP
            # (script-src 등, frame-ancestors 없음)를 보낸다 — 지우지 않고 이 정책을 **두 번째** 헤더로
            # 더한다. 브라우저는 정책 둘을 모두 적용한다.
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self'${DAGSTER_CSP_FRAME_ANCESTORS}" always;
        }
    }
}
