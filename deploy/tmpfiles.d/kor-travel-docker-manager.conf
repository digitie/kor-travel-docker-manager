# host-wide C6c mutation lease 디렉터리를 **부팅 시점에** 만든다.
#
# 왜 필요한가: `/run/lock`은 Debian 계열에서 `1777` sticky이고 tmpfs다. 즉 비특권 로컬
# 사용자도 그 아래에 디렉터리를 만들 수 있고, 재부팅마다 자리가 비워진다. Manager가
# 런타임에 처음 만드는 구조라면 부팅 직후 그 자리를 선점당할 수 있고 — 그러면 소유자·
# mode 검증이 실패해 **모든 컨테이너 mutation이 다음 재부팅까지 거부**된다. sticky bit
# 때문에 정리도 root만 할 수 있다.
#
# 이 창은 런타임 검증으로 닫히지 않는다. "먼저 만든 쪽이 이긴다"는 성질은 검증을 아무리
# 조여도 남는다. systemd-tmpfiles는 sysinit.target 이전에 실행되고 `d` 타입은 이미 있는
# 디렉터리의 소유자와 mode도 바로잡으므로, 경쟁할 사용자 프로세스 자체가 없다.
#
# 설치는 `scripts/install-ktdm-trusted-release`가 수행한다. 수동 설치가 필요하면:
#   sudo install -o root -g root -m 0644 \
#     deploy/tmpfiles.d/kor-travel-docker-manager.conf \
#     /usr/lib/tmpfiles.d/kor-travel-docker-manager.conf
#   sudo systemd-tmpfiles --create /usr/lib/tmpfiles.d/kor-travel-docker-manager.conf
#
# 주의: `d`는 소유자·mode만 바로잡고 **내용은 지우지 않는다.** 이미 선점된 호스트에서는
# 확인을 `ls -ld`가 아니라 `ls -la`로 한다 (docs/prod-deployment.md 3.z).
#
#Type Path                                Mode UID  GID  Age Argument
d     /run/lock/kor-travel-docker-manager 0700 root root -
