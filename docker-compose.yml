name: kor-travel-docker-manager

# 네트워크 모드: dev 기본값은 host 이다. host 모드에서는 포트 NAT가 없으므로 각 컨테이너가
# 호스트 정규 포트(12xxx)에 직접 바인딩하고, 서비스 간 참조는 127.0.0.1:<포트>를 사용한다.
# (KTDM_DOCKER_NETWORK_MODE=bridge 로 바꾸려면 서비스 간 hostname을 컨테이너명으로 되돌려야 한다.)

services:
  kor-travel-geo-postgres:
    image: postgis/postgis:16-3.5
    container_name: kor-travel-geo-postgres
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr}
      # 형제 셋(map/concierge/pinvi)과 같이 superuser password는 long-lived Config.Env가
      # 아니라 secret file로 준다(issue #178 — geo만 평문 `POSTGRES_PASSWORD` + 추측 가능한
      # 기본값 `addr`을 그대로 쓰고 있었다). `docker inspect`에 평문이 남지 않는다.
      # ⚠️ 기존 PGDATA에는 이 값이 initdb 이후 안 먹는다 — 실제 회전은 `ALTER ROLE`을
      #    따로 해야 하고, geo에 붙는 모든 DSN(api/dagster/db-init/ensure 스크립트)을
      #    같은 트랜잭션 단위로 갱신해야 한다.
      POSTGRES_PASSWORD_FILE: /run/secrets/kor-travel-geo-postgres-password
      POSTGRES_DB: ${KOR_TRAVEL_GEO_POSTGRES_DB:-kor_travel_geo}
      # loopback을 scram으로 잠근다. initdb를 `--auth-host` 없이 부르면 기본이
      # `trust`이고, 그때 생기는 `host all all 127.0.0.1/32 trust`가 entrypoint가
      # 뒤에 붙이는 `host all all all scram-sha-256`보다 **먼저 매칭된다**
      # (first-match-wins). host network를 공유하는 다른 컨테이너에서 비밀번호
      # 없이 이 인스턴스의 superuser로 붙을 수 있다는 뜻이다 — 2026-08-17에 prod
      # 네 인스턴스 전부에서 실증했다. instance를 나눈 의미가 사라진다.
      # ⚠️ 이 값은 **initdb 때만** 쓰인다. 이미 만들어진 PGDATA는 pg_hba.conf를
      #    직접 고쳐야 한다.
      # `--auth-local`은 건드리지 않는다 — 유닉스 소켓은 컨테이너 파일시스템
      # 안이라 밖에서 못 닿고, entrypoint의 initdb.d 스크립트가 그 경로로 붙는다.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # PINVI_*/KOR_TRAVEL_CONCIERGE_* 변수는 2026-08-17에 뺐다. init script를 geo
      # 전용으로 좁힌 뒤로 읽는 곳이 없고, 남겨두면 이 인스턴스가 아직 남의 DB를
      # 만든다고 오해하게 한다. 두 프로젝트는 각자 인스턴스(12600/12800)를 쓴다.
      KOR_TRAVEL_GEO_STRICT_SOURCE_CHECK: ${KOR_TRAVEL_GEO_STRICT_SOURCE_CHECK:-1}
      KOR_TRAVEL_GEO_SOURCE_DIR: ${KOR_TRAVEL_GEO_SOURCE_DIR:-/data/juso}
    secrets:
    - kor-travel-geo-postgres-password
    ports:
    - 127.0.0.1:${KOR_TRAVEL_GEO_DB_PORT:-12500}:${KOR_TRAVEL_GEO_DB_PORT:-12500}
    volumes:
    - ${KOR_TRAVEL_GEO_PGDATA:-/home/digitie/kor-travel-geo-data/pgdata-final-20260529}:/var/lib/postgresql/data
    - ${KOR_TRAVEL_GEO_JUSO_DATA:-/mnt/f/dev/kor-travel-geo/data/juso}:/data/juso:ro
    - ./scripts/ensure-kor-travel-geo-db.sh:/docker-entrypoint-initdb.d/010-ensure-kor-travel-geo-db.sh:ro
    - ./scripts/ensure-kor-travel-geo-db.sh:/opt/kor-travel-docker-manager/ensure-kor-travel-geo-db.sh:ro
    - ./scripts/verify-kor-travel-geo-source.sh:/opt/kor-travel-docker-manager/verify-kor-travel-geo-source.sh:ro
    shm_size: 512mb
    command:
    - postgres
    # 통합 인스턴스에서 Geo 전용으로 좁힌 뒤 대역 규칙에 맞춘 포트다(ADR-047: 125xx=geo).
    # `network_mode: host`에서는 `ports:`가 무시되므로 **이 `-p`가 곧 호스트 포트**다.
    - -p
    - ${KOR_TRAVEL_GEO_DB_PORT:-12500}
    # 형제 3개와 같이 loopback만 듣는다. 이 줄이 없으면 기본값 `*`라 **LAN 전체에**
    # 열린다 — 위의 `ports: 127.0.0.1:...`는 host network에서 무시되므로 loopback처럼
    # 보이는 장식일 뿐이고, 실제 경계는 여기서만 정해진다.
    - -c
    - listen_addresses=127.0.0.1
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    - -c
    - shared_buffers=512MB
    - -c
    - work_mem=64MB
    - -c
    - maintenance_work_mem=256MB
    - -c
    - max_wal_size=2GB
    - -c
    - checkpoint_completion_target=0.9
    - -c
    - effective_cache_size=1536MB
    - -c
    - random_page_cost=1.1
    healthcheck:
      test:
      - CMD-SHELL
      # 포트를 명시하지 않으면 기본 5432를 보고 **영원히 unhealthy**가 된다.
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_GEO_DB_PORT:-12500} -U ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr} -d ${KOR_TRAVEL_GEO_POSTGRES_DB:-kor_travel_geo}
      interval: 10s
      timeout: 5s
      retries: 5
  # ADR-047 대역 규칙: 126xx = concierge. 통합 인스턴스에서 분리한 전용 PostGIS다.
  # 분리 근거는 map(ADR-35)과 같다 — role/ACL은 DB가 아니라 **cluster 전역**이라
  # DB만 나눠서는 principal이 격리되지 않는다.
  kor-travel-concierge-postgres:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_CONCIERGE_POSTGRES_CONTAINER:-kor-travel-concierge-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${KOR_TRAVEL_CONCIERGE_POSTGRES_USER:-addr}
      # map과 같이 superuser password는 long-lived Config.Env가 아니라 secret file로
      # 준다. `docker inspect`에 평문이 남지 않는다.
      POSTGRES_PASSWORD_FILE: /run/secrets/kor-travel-concierge-postgres-password
      # 앱 DB와 다른 중립 이름으로 init한다 — 같은 이름으로 init하면 initdb가 심은
      # 확장과 dump의 확장 배치가 복원에서 충돌한다(map 커토버 실측).
      POSTGRES_DB: ${KOR_TRAVEL_CONCIERGE_POSTGRES_BOOTSTRAP_DB:-ktc_bootstrap}
      # loopback을 scram으로 잠근다. initdb를 `--auth-host` 없이 부르면 기본이
      # `trust`이고, 그때 생기는 `host all all 127.0.0.1/32 trust`가 entrypoint가
      # 뒤에 붙이는 `host all all all scram-sha-256`보다 **먼저 매칭된다**
      # (first-match-wins). host network를 공유하는 다른 컨테이너에서 비밀번호
      # 없이 이 인스턴스의 superuser로 붙을 수 있다는 뜻이다 — 2026-08-17에 prod
      # 네 인스턴스 전부에서 실증했다. instance를 나눈 의미가 사라진다.
      # ⚠️ 이 값은 **initdb 때만** 쓰인다. 이미 만들어진 PGDATA는 pg_hba.conf를
      #    직접 고쳐야 한다.
      # `--auth-local`은 건드리지 않는다 — 유닉스 소켓은 컨테이너 파일시스템
      # 안이라 밖에서 못 닿고, entrypoint의 initdb.d 스크립트가 그 경로로 붙는다.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=${KOR_TRAVEL_CONCIERGE_POSTGRES_SHARED_BUFFERS:-128MB}
    - -c
    - work_mem=${KOR_TRAVEL_CONCIERGE_POSTGRES_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${KOR_TRAVEL_CONCIERGE_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    - -c
    - effective_cache_size=${KOR_TRAVEL_CONCIERGE_POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    # 통합 인스턴스가 쓰던 값을 그대로 물려받는다. 크기만 데이터에 맞춰 줄였고
    # planner/WAL 성질은 바꾸지 않는다 — 같은 쿼리가 다른 계획을 타면 안 된다.
    - -c
    - random_page_cost=${KOR_TRAVEL_CONCIERGE_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${KOR_TRAVEL_CONCIERGE_POSTGRES_MAX_WAL_SIZE:-1GB}
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    secrets:
    - kor-travel-concierge-postgres-password
    volumes:
    - ${KOR_TRAVEL_CONCIERGE_PGDATA:-/home/digitie/kor-travel-concierge-data/pgdata}:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}:${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600} -U ${KOR_TRAVEL_CONCIERGE_POSTGRES_USER:-addr} -d ${KOR_TRAVEL_CONCIERGE_POSTGRES_BOOTSTRAP_DB:-ktc_bootstrap}
      interval: 10s
      timeout: 5s
      retries: 20

  # ADR-047 대역 규칙: 128xx = PinVi.
  pinvi-postgres:
    image: postgis/postgis@sha256:8b33190b6486ab9905dea999171817c1ac461733a7078dd4c836091c6e6b5d40
    container_name: ${PINVI_POSTGRES_CONTAINER:-pinvi-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${PINVI_POSTGRES_USER:-pinvi}
      POSTGRES_PASSWORD_FILE: /run/secrets/pinvi-postgres-password
      POSTGRES_DB: ${PINVI_POSTGRES_BOOTSTRAP_DB:-pinvi_bootstrap}
      # loopback을 scram으로 잠근다. initdb를 `--auth-host` 없이 부르면 기본이
      # `trust`이고, 그때 생기는 `host all all 127.0.0.1/32 trust`가 entrypoint가
      # 뒤에 붙이는 `host all all all scram-sha-256`보다 **먼저 매칭된다**
      # (first-match-wins). host network를 공유하는 다른 컨테이너에서 비밀번호
      # 없이 이 인스턴스의 superuser로 붙을 수 있다는 뜻이다 — 2026-08-17에 prod
      # 네 인스턴스 전부에서 실증했다. instance를 나눈 의미가 사라진다.
      # ⚠️ 이 값은 **initdb 때만** 쓰인다. 이미 만들어진 PGDATA는 pg_hba.conf를
      #    직접 고쳐야 한다.
      # `--auth-local`은 건드리지 않는다 — 유닉스 소켓은 컨테이너 파일시스템
      # 안이라 밖에서 못 닿고, entrypoint의 initdb.d 스크립트가 그 경로로 붙는다.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${PINVI_DB_PORT:-12800}
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=${PINVI_POSTGRES_SHARED_BUFFERS:-128MB}
    - -c
    - work_mem=${PINVI_POSTGRES_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${PINVI_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    - -c
    - effective_cache_size=${PINVI_POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    # 통합 인스턴스가 쓰던 값을 그대로 물려받는다. 크기만 데이터에 맞춰 줄였고
    # planner/WAL 성질은 바꾸지 않는다 — 같은 쿼리가 다른 계획을 타면 안 된다.
    - -c
    - random_page_cost=${PINVI_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${PINVI_POSTGRES_MAX_WAL_SIZE:-1GB}
    # ⚠️ 아래 설정만으로는 **관측이 안 된다.** 라이브러리는 preload돼 통계를 모으지만
    #    `pinvi` DB에 `pg_stat_statements` **확장이 없어** 읽을 수단이 없다
    #    (2026-08-17 실측: geo/concierge/map은 확장 있음, pinvi만 0).
    #    여기서 `CREATE EXTENSION`을 하지 않는다 — pinvi 스키마는 그 저장소 alembic이
    #    소유하고, 밖에서 심으면 그쪽 migration과 어긋난다. 필요해지면 PinVi 쪽
    #    migration에 넣는다.
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    secrets:
    - pinvi-postgres-password
    volumes:
    - ${PINVI_PGDATA:-/home/digitie/pinvi-data/pgdata}:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${PINVI_DB_PORT:-12800}:${PINVI_DB_PORT:-12800}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${PINVI_DB_PORT:-12800} -U ${PINVI_POSTGRES_USER:-pinvi} -d ${PINVI_POSTGRES_BOOTSTRAP_DB:-pinvi_bootstrap}
      interval: 10s
      timeout: 5s
      retries: 20

  # 빈 PGDATA에서 앱 DB를 만드는 경로. init DB는 중립 이름(ktc_bootstrap)이라
  # `kor_travel_concierge`를 아무도 만들지 않았다 — 지금 prod에 있는 것은
  # 2026-08-17 이관으로 들어간 것뿐이고, 새 호스트에서는 앱이 곧장 죽는다.
  # createdb는 멱등이므로 이미 있는 인스턴스에서는 무해하게 no-op한다.
  kor-travel-concierge-db-init:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_CONCIERGE_DB_INIT_CONTAINER:-kor-travel-concierge-db-init}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-concierge-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}
      PGUSER: ${KOR_TRAVEL_CONCIERGE_POSTGRES_USER:-addr}
      PGDATABASE: ${KOR_TRAVEL_CONCIERGE_POSTGRES_BOOTSTRAP_DB:-ktc_bootstrap}
      KOR_TRAVEL_CONCIERGE_POSTGRES_DB: ${KOR_TRAVEL_CONCIERGE_POSTGRES_DB:-kor_travel_concierge}
    secrets:
    - kor-travel-concierge-postgres-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다. 인증 실패·연결 거부·권한
    # 부족을 전부 삼키고 exit 0으로 끝나서, 이 one-shot이 막으려던 바로 그 상황에서
    # `service_completed_successfully` 게이트가 통과한다. 존재 확인만 조용히 하고
    # 진짜 오류는 전파한다.
    # 비밀번호는 `PGPASSWORD` 평문(=`docker inspect`에 그대로 남는다) 대신 secret
    # file로 받는다 — `restart: "no"` 컨테이너는 exit 뒤에도 남아 계속 조회된다.
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-concierge-postgres-password)"
      export PGPASSWORD
      if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$KOR_TRAVEL_CONCIERGE_POSTGRES_DB'" | grep -q 1; then
        echo "database $$KOR_TRAVEL_CONCIERGE_POSTGRES_DB already exists"
      else
        createdb "$$KOR_TRAVEL_CONCIERGE_POSTGRES_DB"
      fi

  pinvi-db-init:
    image: postgis/postgis@sha256:8b33190b6486ab9905dea999171817c1ac461733a7078dd4c836091c6e6b5d40
    container_name: ${PINVI_DB_INIT_CONTAINER:-pinvi-db-init}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      pinvi-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${PINVI_DB_PORT:-12800}
      PGUSER: ${PINVI_POSTGRES_USER:-pinvi}
      PGDATABASE: ${PINVI_POSTGRES_BOOTSTRAP_DB:-pinvi_bootstrap}
      PINVI_POSTGRES_DB: ${PINVI_POSTGRES_DB:-pinvi}
      # Dagster instance storage는 **앱 DB와 같은 database를 쓸 수 없다** —
      # dagster-postgres가 자기 스키마 이력을 `alembic_version`이라는 이름의
      # 테이블로 관리해 PinVi 자신의 것과 충돌한다. 인스턴스는 같이 쓰고
      # database만 가른다.
      PINVI_DAGSTER_DB: ${PINVI_DAGSTER_DB:-pinvi_dagster}
      # `should_autocreate_tables`가 켜져 있어(앱 이미지의 dagster.yaml) 런타임이
      # 첫 기동에 테이블을 만든다. 그러려면 그 롤이 이 database에 DDL 권한을
      # 가져야 하므로 **소유자로** 만든다 — 나중에 GRANT로 메우려 하면 PG15부터
      # public 스키마가 CREATE를 기본 부여하지 않아 또 막힌다.
      PINVI_DAGSTER_DB_OWNER: ${PINVI_APP_DB_USER:?PINVI_APP_DB_USER must be explicitly set}
    secrets:
    - pinvi-postgres-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다. 인증 실패·연결 거부·권한
    # 부족을 전부 삼키고 exit 0으로 끝나서, 이 one-shot이 막으려던 바로 그 상황에서
    # `service_completed_successfully` 게이트가 통과한다. 존재 확인만 조용히 하고
    # 진짜 오류는 전파한다.
    # 비밀번호는 `PGPASSWORD` 평문(=`docker inspect`에 그대로 남는다) 대신 secret
    # file로 받는다 — `restart: "no"` 컨테이너는 exit 뒤에도 남아 계속 조회된다.
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/pinvi-postgres-password)"
      export PGPASSWORD
      if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$PINVI_POSTGRES_DB'" | grep -q 1; then
        echo "database $$PINVI_POSTGRES_DB already exists"
      else
        createdb "$$PINVI_POSTGRES_DB"
      fi
      if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$PINVI_DAGSTER_DB'" | grep -q 1; then
        echo "database $$PINVI_DAGSTER_DB already exists"
      else
        createdb -O "$$PINVI_DAGSTER_DB_OWNER" "$$PINVI_DAGSTER_DB"
      fi

  # platform-topology.md §7(2026-09-19 결정)의 공용 제어 평면 instance. concierge가
  # 첫 합류 프로젝트다 — geo/map/pinvi는 아직 각자 전용 instance(ADR-37)에 남아
  # 있으며, 그 프로젝트들이 합류할 때는 각자 role+database만 만드는 별도 db-init
  # one-shot을 추가한다(아래 -concierge 접미사와 같은 패턴). 한 스크립트가 여러
  # 프로젝트의 role/database를 만들지 않는다 — 그것이 2026-08-17 사고(ADR-37)의
  # 직접 원인이었다.
  kor-travel-shared-postgres:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_POSTGRES_CONTAINER:-kor-travel-shared-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      # cluster 관리용 계정이다 — 앱에는 절대 주입하지 않는다. 앱은 아래
      # kor-travel-shared-db-init-concierge가 만드는 프로젝트 전용 role만 쓴다.
      POSTGRES_PASSWORD_FILE: /run/secrets/kor-travel-shared-postgres-password
      # 앱 DB와 다른 중립 이름으로 init한다 — 같은 이름으로 init하면 initdb가 심은
      # 확장과 dump의 확장 배치가 복원에서 충돌한다(map 커토버 실측).
      POSTGRES_DB: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      # loopback을 scram으로 잠근다 — ADR-37이 겪은 실패(첫 instance들이 이 값
      # 없이 initdb돼 trust loopback이 남았던 것)를 새 instance에서 반복하지
      # 않는다. ⚠️ initdb 때만 쓰이므로 이미 만들어진 PGDATA는 pg_hba.conf를
      # 직접 고쳐야 한다.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=${KOR_TRAVEL_SHARED_POSTGRES_SHARED_BUFFERS:-128MB}
    - -c
    - work_mem=${KOR_TRAVEL_SHARED_POSTGRES_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${KOR_TRAVEL_SHARED_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    - -c
    - effective_cache_size=${KOR_TRAVEL_SHARED_POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    - -c
    - random_page_cost=${KOR_TRAVEL_SHARED_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${KOR_TRAVEL_SHARED_POSTGRES_MAX_WAL_SIZE:-1GB}
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    secrets:
    - kor-travel-shared-postgres-password
    volumes:
    - ${KOR_TRAVEL_SHARED_PGDATA:-/home/digitie/kor-travel-shared-data/pgdata}:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${KOR_TRAVEL_SHARED_DB_PORT:-11000}:${KOR_TRAVEL_SHARED_DB_PORT:-11000}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_SHARED_DB_PORT:-11000} -U ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin} -d ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      interval: 10s
      timeout: 5s
      retries: 20

  # concierge 전용 role+database만 만든다. 다른 프로젝트가 합류할 때는 각자 또
  # 다른 -db-init one-shot을 추가한다(위 서비스 주석 참고) — role/ACL은 database가
  # 아니라 cluster 전역이라는 ADR-37의 교훈을 그대로 지킨다.
  kor-travel-shared-db-init-concierge:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_DB_INIT_CONCIERGE_CONTAINER:-kor-travel-shared-db-init-concierge}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
      PGUSER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      PGDATABASE: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      KOR_TRAVEL_CONCIERGE_SHARED_DB: ${KOR_TRAVEL_CONCIERGE_SHARED_DB:-kor_travel_concierge}
      KOR_TRAVEL_CONCIERGE_SHARED_APP_USER: ${KOR_TRAVEL_CONCIERGE_SHARED_APP_USER:-kor_travel_concierge_app}
    secrets:
    - source: kor-travel-shared-postgres-password
      target: /run/secrets/kor-travel-shared-postgres-password
    - source: kor-travel-concierge-shared-app-password
      target: /run/secrets/kor-travel-concierge-shared-app-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다(기존 -db-init 패턴과 동일한
    # 이유 — 인증 실패·연결 거부·권한 부족을 삼키면 막으려던 상황에서 오히려
    # `service_completed_successfully` 게이트가 통과한다). role 생성은 재실행 시
    # 비밀번호를 최신 secret으로 맞추도록 존재해도 ALTER ROLE을 태운다.
    # 다른 database에는 어떤 권한도 주지 않는다 — PostgreSQL 기본 동작(명시적
    # GRANT가 없으면 비-superuser는 접근 불가)이 격리를 보장하고, 이 role이
    # CREATEDB/CREATEROLE/superuser가 아님을 여기서 직접 확인한다(2026-08-17
    # 사고 재발 방지의 핵심 지점).
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-shared-postgres-password)"
      export PGPASSWORD
      APP_PASSWORD="$$(cat /run/secrets/kor-travel-concierge-shared-app-password)"
      if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER'" | grep -q 1; then
        echo "role $$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER already exists"
        psql -d "$$PGDATABASE" -c "ALTER ROLE \"$$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      else
        psql -d "$$PGDATABASE" -c "CREATE ROLE \"$$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      fi
      if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname='$$KOR_TRAVEL_CONCIERGE_SHARED_DB'" | grep -q 1; then
        echo "database $$KOR_TRAVEL_CONCIERGE_SHARED_DB already exists"
      else
        createdb -O "$$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER" "$$KOR_TRAVEL_CONCIERGE_SHARED_DB"
      fi
      psql -d "$$KOR_TRAVEL_CONCIERGE_SHARED_DB" -c "CREATE EXTENSION IF NOT EXISTS postgis"
      # PostgreSQL은 기본적으로 모든 database에 PUBLIC CONNECT를 부여한다 — DB만
      # 나누는 것으로는 격리가 안 된다는 ADR-37의 교훈이 CONNECT 권한에도 그대로
      # 적용된다. bootstrap DB와 이 DB 모두에서 PUBLIC의 CONNECT를 걷어내고, 이
      # DB는 소유 role에게만 명시적으로 되돌려준다 — 다른 프로젝트가 나중에 같은
      # 클러스터에 합류해도 서로의 database에 기본적으로 닿지 않는다(실측: 2026-09-19,
      # revoke 전에는 이 role이 bootstrap DB에 SELECT 1까지 실행할 수 있었다).
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PGDATABASE\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_CONCIERGE_SHARED_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_CONCIERGE_SHARED_DB\" TO \"$$KOR_TRAVEL_CONCIERGE_SHARED_APP_USER\""

  # geo 전용 role+database 2개(앱 DB + Dagster 메타 DB)만 만든다 — concierge와 같은
  # 이유로 role/ACL은 cluster 전역이라는 ADR-37 교훈을 지킨다(ADR-45). concierge
  # db-init과 달리 여기서는 extension을 만들지 않는다 — geo의 실제 스키마
  # (kor-travel-geo의 sql/ddl/001_schema.sql)는 postgis/pg_trgm/unaccent/
  # pg_stat_statements를 전부 `x_extension` 스키마에 설치하는데, 여기서 기본
  # `public` 스키마에 먼저 심어 버리면 cutover pg_restore 때 dump가 가져오는
  # `x_extension` 배치와 충돌한다(공용 instance 자체 주석이 경고하는 "map 커토버
  # 실측" 함정과 동일 원인). 그래서 db-init은 빈 database 2개 + role + CONNECT
  # grant까지만 하고, extension/스키마/테이블은 cutover의 pg_restore가 dump
  # 그대로 재생하게 둔다.
  kor-travel-shared-db-init-geo:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_DB_INIT_GEO_CONTAINER:-kor-travel-shared-db-init-geo}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
      PGUSER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      PGDATABASE: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      KOR_TRAVEL_GEO_SHARED_DB: ${KOR_TRAVEL_GEO_SHARED_DB:-kor_travel_geo}
      KOR_TRAVEL_GEO_DAGSTER_SHARED_DB: ${KOR_TRAVEL_GEO_DAGSTER_SHARED_DB:-kor_travel_geo_dagster}
      KOR_TRAVEL_GEO_SHARED_APP_USER: ${KOR_TRAVEL_GEO_SHARED_APP_USER:-kor_travel_geo_app}
    secrets:
    - source: kor-travel-shared-postgres-password
      target: /run/secrets/kor-travel-shared-postgres-password
    - source: kor-travel-geo-shared-app-password
      target: /run/secrets/kor-travel-geo-shared-app-password
    # concierge db-init과 동일한 이유로 `|| true` 삼킴을 쓰지 않는다 — 인증 실패나
    # 권한 부족을 삼키면 `service_completed_successfully` 게이트가 잘못 통과한다.
    # role은 geo의 두 database를 모두 소유한다(오늘 옛 instance에서 `addr`
    # superuser 하나가 둘 다 소유하는 것과 동일한 권한 경계, 다만 이번엔
    # NOSUPERUSER/NOCREATEDB/NOCREATEROLE로 scoped — 2026-08-17 사고 재발 방지의
    # 핵심 지점을 여기서도 지킨다).
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-shared-postgres-password)"
      export PGPASSWORD
      APP_PASSWORD="$$(cat /run/secrets/kor-travel-geo-shared-app-password)"
      if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$KOR_TRAVEL_GEO_SHARED_APP_USER'" | grep -q 1; then
        echo "role $$KOR_TRAVEL_GEO_SHARED_APP_USER already exists"
        psql -d "$$PGDATABASE" -c "ALTER ROLE \"$$KOR_TRAVEL_GEO_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      else
        psql -d "$$PGDATABASE" -c "CREATE ROLE \"$$KOR_TRAVEL_GEO_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      fi
      for db in "$$KOR_TRAVEL_GEO_SHARED_DB" "$$KOR_TRAVEL_GEO_DAGSTER_SHARED_DB"; do
        if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1; then
          echo "database $$db already exists"
        else
          createdb -O "$$KOR_TRAVEL_GEO_SHARED_APP_USER" "$$db"
        fi
      done
      # PUBLIC CONNECT 걷어내기 — ADR-44가 concierge 최초 배포 뒤에야 발견해 hotfix로
      # 추가했던 것을 여기서는 처음부터 반영한다(bootstrap DB + geo의 두 DB 모두).
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PGDATABASE\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_GEO_SHARED_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_GEO_DAGSTER_SHARED_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_GEO_SHARED_DB\" TO \"$$KOR_TRAVEL_GEO_SHARED_APP_USER\""
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_GEO_DAGSTER_SHARED_DB\" TO \"$$KOR_TRAVEL_GEO_SHARED_APP_USER\""

  # ADR-46 — PinVi도 geo/concierge/weather와 같은 모양이다: **app role 하나**가
  # 자기 두 database를 소유한다. 종전에는 PinVi만 자체 다중 role 모델(M05)을 갖고
  # `bootstrap-pinvi-runtime-role.sh`가 role topology를 세웠는데, 그 스크립트의
  # 증명들은 "이 cluster는 내 것뿐"을 전제해 공용 instance와 구조적으로 맞지 않았다
  # (sibling 프로젝트의 role/database가 정당하게 존재하는데 foreign으로 판정된다).
  # 그래서 그 모델을 폐기하고 geo 패턴으로 접었다 — role 분리 대신 scoped role
  # 하나(NOSUPERUSER/NOCREATEDB/NOCREATEROLE)와 CONNECT 격리로 경계를 잡는다.
  kor-travel-shared-db-init-pinvi:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_DB_INIT_PINVI_CONTAINER:-kor-travel-shared-db-init-pinvi}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
      PGUSER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      PGDATABASE: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      PINVI_POSTGRES_DB: ${PINVI_POSTGRES_DB:-pinvi}
      PINVI_DAGSTER_DB: ${PINVI_DAGSTER_DB:-pinvi_dagster}
      PINVI_APP_DB_USER: ${PINVI_APP_DB_USER:-pinvi_app}
    secrets:
    - source: kor-travel-shared-postgres-password
      target: /run/secrets/kor-travel-shared-postgres-password
    - source: pinvi-shared-app-password
      target: /run/secrets/pinvi-shared-app-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다(기존 -db-init 패턴과 동일한
    # 이유). 비밀번호는 secret file로만 받는다.
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-shared-postgres-password)"
      export PGPASSWORD
      APP_PASSWORD="$$(cat /run/secrets/pinvi-shared-app-password)"
      if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$PINVI_APP_DB_USER'" | grep -q 1; then
        echo "role $$PINVI_APP_DB_USER already exists"
        psql -d "$$PGDATABASE" -c "ALTER ROLE \"$$PINVI_APP_DB_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      else
        psql -d "$$PGDATABASE" -c "CREATE ROLE \"$$PINVI_APP_DB_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      fi
      for db in "$$PINVI_POSTGRES_DB" "$$PINVI_DAGSTER_DB"; do
        if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1; then
          echo "database $$db already exists"
        else
          createdb -O "$$PINVI_APP_DB_USER" "$$db"
        fi
      done
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PINVI_POSTGRES_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PINVI_DAGSTER_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$PINVI_POSTGRES_DB\" TO \"$$PINVI_APP_DB_USER\""
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$PINVI_DAGSTER_DB\" TO \"$$PINVI_APP_DB_USER\""

  # weather 전용 role 1개(2026-09-25 이전엔 2개) + database 2개(앱 DB + Dagster
  # 메타 DB)를 만든다. 사용자 지시: "weather는 데이터는 옮기지 마 — 어차피 새로
  # 쌓으면 됨" — pg_dump/restore 없이 완전히 빈 DB로 시작한다(PinVi ADR-46과
  # 같은 패턴, concierge/geo의 실data-cutover 계획과 다르다). geo와 달리
  # extension은 만들지 않는다(weather의 alembic 마이그레이션 어디에도
  # postgis/geometry 의존이 없다).
  #
  # 2026-09-25: Dagster 쪽 별도 role(`kor_travel_weather_dagster_app`)을
  # PinVi/geo와 같은 단일-role 패턴으로 통합했다. 이전 주석은 "weather 자신의
  # compose.yaml(x-dagster-environment 앵커)이 이 이름을 literal로 못박아 뒀다"고
  # 했으나 실제로 그 앵커는 로컬 dev 전용(`db:5432` 서비스명, `${POSTGRES_USER:-
  # weather}` 제네릭 기본값)이고 n150 배포는 weather의 deploy/dagster.yaml만
  # 마운트하는데 그 파일은 `DAGSTER_POSTGRES_URL`을 env에서 그대로 읽을 뿐 role
  # 이름을 하드코딩하지 않는다 — 별도 role을 유지할 기술적 근거가 없었다.
  # 앱 DB 쪽(`kor_travel_weather_app` / `kor_travel_weather`)은 이 설계에서
  # 새로 정하는 이름이다.
  #
  # ⚠️ 이 이름의 one-shot이 한 번 있었다(PR #368, bridge network + 서비스명
  # PGHOST) — 같은 날 PR #371로 완전히 되돌려졌다(2026-09-20). 아래 정의는 그
  # 되돌려진 버전의 재활용이 아니라, concierge/geo/pinvi의 db-init과 같은
  # PGHOST 127.0.0.1 + network_mode: host 규약으로 처음부터 새로 짠 것이다
  # (ADR-47 — weather internal-target 전환).
  kor-travel-shared-db-init-weather:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_DB_INIT_WEATHER_CONTAINER:-kor-travel-shared-db-init-weather}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
      PGUSER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      PGDATABASE: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      KOR_TRAVEL_WEATHER_SHARED_APP_DB: ${KOR_TRAVEL_WEATHER_SHARED_APP_DB:-kor_travel_weather}
      KOR_TRAVEL_WEATHER_SHARED_APP_USER: ${KOR_TRAVEL_WEATHER_SHARED_APP_USER:-kor_travel_weather_app}
      KOR_TRAVEL_WEATHER_DAGSTER_SHARED_DB: kor_travel_weather_dagster
    secrets:
    - source: kor-travel-shared-postgres-password
      target: /run/secrets/kor-travel-shared-postgres-password
    - source: kor-travel-weather-shared-app-password
      target: /run/secrets/kor-travel-weather-shared-app-password
    # `createdb ... 2>/dev/null || true`는 쓰지 않는다 — 기존 -db-init 패턴과
    # 동일한 이유(인증 실패·연결 거부·권한 부족을 삼키면 그 상황에서 오히려
    # `service_completed_successfully` 게이트가 통과한다). role은
    # NOSUPERUSER/NOCREATEDB/NOCREATEROLE. 재실행 시 비밀번호를 최신 secret으로
    # 맞추도록 존재해도 ALTER ROLE을 태운다.
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-shared-postgres-password)"
      export PGPASSWORD
      APP_PASSWORD="$$(cat /run/secrets/kor-travel-weather-shared-app-password)"

      if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$KOR_TRAVEL_WEATHER_SHARED_APP_USER'" | grep -q 1; then
        echo "role $$KOR_TRAVEL_WEATHER_SHARED_APP_USER already exists"
        psql -d "$$PGDATABASE" -c "ALTER ROLE \"$$KOR_TRAVEL_WEATHER_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      else
        psql -d "$$PGDATABASE" -c "CREATE ROLE \"$$KOR_TRAVEL_WEATHER_SHARED_APP_USER\" WITH LOGIN PASSWORD '$$APP_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
      fi
      for db in "$$KOR_TRAVEL_WEATHER_SHARED_APP_DB" "$$KOR_TRAVEL_WEATHER_DAGSTER_SHARED_DB"; do
        if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1; then
          echo "database $$db already exists"
        else
          createdb -O "$$KOR_TRAVEL_WEATHER_SHARED_APP_USER" "$$db"
        fi
      done

      # PUBLIC CONNECT 걷어내기 — concierge/geo db-init과 같은 이유(ADR-37/ADR-44
      # 교훈: role·ACL은 database가 아니라 cluster 전역, DB만 나누는 것으로는
      # 격리가 안 된다).
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PGDATABASE\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_WEATHER_SHARED_APP_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_WEATHER_DAGSTER_SHARED_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_WEATHER_SHARED_APP_DB\" TO \"$$KOR_TRAVEL_WEATHER_SHARED_APP_USER\""
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_WEATHER_DAGSTER_SHARED_DB\" TO \"$$KOR_TRAVEL_WEATHER_SHARED_APP_USER\""

  # kor-travel-transport는 application schema와 Dagster metadata schema가 모두
  # alembic_version을 사용하므로 하나의 DB를 공유할 수 없다(두 DB는 계속 분리).
  #
  # 2026-09-25: DB는 그대로 두 개, 그 둘을 소유하는 role은 하나로 통합했다(PinVi/
  # geo/weather와 같은 패턴). transport 자신의 scripts/deploy-server14.sh는
  # DAGSTER_POSTGRES_URL 모양을 정규식으로 검증하지만 그 정규식의 username 부분은
  # `[^@]+`(임의값 허용) — DB 이름(`kor_travel_transport_dagster`)·host·port만
  # literal이고 role 이름은 고정하지 않는다(2026-09-25 실측,
  # kor-travel-transport-release-*/scripts/deploy-server14.sh:111). 별도 role을
  # 유지할 기술적 근거가 없었다. 실제 소비 컨테이너(dagster webserver/daemon/
  # code-server)는 Manager가 아니라 transport 자신의 배포 사본
  # (/home/digitie/apps/kor-travel-airport/, .env.server14)이 띄운다 — 거기 있는
  # DAGSTER_POSTGRES_URL도 이 통합에 맞춰 함께 바꿔야 한다(Manager 쪽만 바꾸면
  # 소비 컨테이너는 여전히 예전 role로 붙는다).
  kor-travel-shared-db-init-transport:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_SHARED_DB_INIT_TRANSPORT_CONTAINER:-kor-travel-shared-db-init-transport}
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    restart: "no"
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${KOR_TRAVEL_SHARED_DB_PORT:-11000}
      PGUSER: ${KOR_TRAVEL_SHARED_POSTGRES_USER:-shared_admin}
      PGDATABASE: ${KOR_TRAVEL_SHARED_POSTGRES_BOOTSTRAP_DB:-postgres}
      # transport deployment script도 이 정확한 identity만 허용한다. 다른 tenant
      # role/db로 override되면 비밀번호를 회전하거나 ACL을 바꾸지 않도록 literal로
      # 고정한다.
      KOR_TRAVEL_TRANSPORT_SHARED_APP_DB: kor_travel_transport
      KOR_TRAVEL_TRANSPORT_SHARED_APP_USER: kor_travel_transport_app
      KOR_TRAVEL_TRANSPORT_DAGSTER_SHARED_DB: kor_travel_transport_dagster
    secrets:
    - source: kor-travel-shared-postgres-password
      target: /run/secrets/kor-travel-shared-postgres-password
    - source: kor-travel-transport-shared-app-password
      target: /run/secrets/kor-travel-transport-shared-app-password
    command:
    - sh
    - -ec
    - |
      PGPASSWORD="$$(cat /run/secrets/kor-travel-shared-postgres-password)"
      export PGPASSWORD
      APP_PASSWORD="$$(cat /run/secrets/kor-travel-transport-shared-app-password)"

      ensure_role() {
        role="$$1"
        password="$$2"
        if psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$role'" | grep -q 1; then
          printf '%s\n' "ALTER ROLE \"$$role\" WITH LOGIN PASSWORD :'role_password' NOSUPERUSER NOCREATEDB NOCREATEROLE" | psql -d "$$PGDATABASE" -v role_password="$$password"
        else
          printf '%s\n' "CREATE ROLE \"$$role\" WITH LOGIN PASSWORD :'role_password' NOSUPERUSER NOCREATEDB NOCREATEROLE" | psql -d "$$PGDATABASE" -v role_password="$$password"
        fi
      }
      ensure_database() {
        database="$$1"
        owner="$$2"
        if ! psql -d "$$PGDATABASE" -tAc "SELECT 1 FROM pg_database WHERE datname='$$database'" | grep -q 1; then
          createdb -O "$$owner" "$$database"
        fi
      }

      ensure_role "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER" "$$APP_PASSWORD"
      ensure_database "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_DB" "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER"
      ensure_database "$$KOR_TRAVEL_TRANSPORT_DAGSTER_SHARED_DB" "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER"

      # 이미 존재한 DB라도 잘못된 owner를 재사용하면 다른 tenant 데이터에 쓰거나
      # 기존 Dagster metadata를 정본으로 삼게 된다. 재기동 안전성은 유지하되,
      # identity가 다르면 여기서 멈춘다. 빈 상태 검증은 데이터 cutover 직전의
      # transport receipt gate가 application/Dagster 양쪽에 대해 수행한다.
      test "$$(psql -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -qAt -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$$KOR_TRAVEL_TRANSPORT_SHARED_APP_DB'")" = "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER"
      test "$$(psql -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -qAt -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$$KOR_TRAVEL_TRANSPORT_DAGSTER_SHARED_DB'")" = "$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER"

      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$PGDATABASE\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_TRANSPORT_SHARED_APP_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "REVOKE CONNECT ON DATABASE \"$$KOR_TRAVEL_TRANSPORT_DAGSTER_SHARED_DB\" FROM PUBLIC"
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_TRANSPORT_SHARED_APP_DB\" TO \"$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER\""
      psql -d "$$PGDATABASE" -c "GRANT CONNECT ON DATABASE \"$$KOR_TRAVEL_TRANSPORT_DAGSTER_SHARED_DB\" TO \"$$KOR_TRAVEL_TRANSPORT_SHARED_APP_USER\""

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kor-travel-rustfs
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:${RUSTFS_CONSOLE_CONTAINER_PORT:-12105}
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
    ports:
    - ${RUSTFS_API_PORT:-12101}:${RUSTFS_API_CONTAINER_PORT:-12101}
    - ${RUSTFS_CONSOLE_PORT:-12105}:${RUSTFS_CONSOLE_CONTAINER_PORT:-12105}
    volumes:
    - ${RUSTFS_DATA_DIR:-/home/digitie/kor-travel-geo-data/rustfs}:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:${RUSTFS_API_CONTAINER_PORT:-12101}/health/live
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  rustfs-init:
    image: minio/mc:latest
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ENDPOINT: http://${KTDM_RUSTFS_INIT_HOST:-127.0.0.1}:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_API_CONTAINER_PORT: ${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      PINVI_RUSTFS_BUCKET: ${PINVI_RUSTFS_BUCKET:-pinvi-media}
      KOR_TRAVEL_GEO_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KRTOUR_MAP_RUSTFS_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_TRANSPORT_RUSTFS_BUCKET: ${KOR_TRAVEL_TRANSPORT_RUSTFS_BUCKET:-kor-travel-transport-raw}
    volumes:
    - ./scripts/ensure-rustfs-buckets.sh:/opt/kor-travel-docker-manager/ensure-rustfs-buckets.sh:ro
    entrypoint:
    - /bin/sh
    - /opt/kor-travel-docker-manager/ensure-rustfs-buckets.sh
  kor-travel-geo-api:
    image: ${KOR_TRAVEL_GEO_API_IMAGE:-kor-travel-geo-api:latest-main-gdal}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: docker/api.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_API_CONTAINER:-kor-travel-geo-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      # 옛 전용 instance는 롤백 안전망으로 계속 띄워 두므로(ADR-45, concierge와
      # 동일 원칙) 의존성도 남겨 둔다 — 무해하게 같이 healthy해진다. 이 커밋
      # 시점에는 KTG_PG_DSN이 여전히 옛 instance를 가리킨다 — 실제 data cutover가
      # 끝난 뒤에야 이 값이 아래 공용 instance로 바뀐다(별도 배포 단계, ADR-45).
      kor-travel-geo-postgres:
        condition: service_healthy
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-geo:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      PORT: ${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
      KTG_API_HOST: 0.0.0.0
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:?KOR_TRAVEL_GEO_DOCKER_PG_DSN must be explicitly set}
      KTG_GEOIP_GATE_MODE: ${KOR_TRAVEL_GEO_GEOIP_GATE_MODE:-off}
      KTG_OPS_TABLE_STATS_CAPTURE_INTERVAL_MINUTES: ${KOR_TRAVEL_GEO_OPS_TABLE_STATS_CAPTURE_INTERVAL_MINUTES:-0}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KTG_RUSTFS_LOCAL_IMPORT_ROOTS: /data
      KTG_VWORLD_API_KEY: ${KOR_TRAVEL_GEO_VWORLD_API_KEY:-}
      KTG_PUBLIC_API_KEY_CACHE_TTL_S: ${KOR_TRAVEL_GEO_PUBLIC_API_KEY_CACHE_TTL_S:-30}
      KTG_ADMIN_TRUSTED_PROXY_CIDRS: ${KOR_TRAVEL_GEO_ADMIN_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      # Browser-facing Dagster URL the admin API returns for the /admin/dagster iframe/links
      # (T-290). The LAN router reverse-proxies geo-dagster.example.org (TLS) to this
      # host's 127.0.0.1:12502 webserver (external step; same pattern as the other services'
      # *.digitie.mywire.org domains). Backend GraphQL observe stays on the internal
      # KTG_DAGSTER_URL (default 127.0.0.1:12502, SSRF-allowlisted). Dev overrides to internal.
      KTG_DAGSTER_PUBLIC_URL: ${KOR_TRAVEL_GEO_DAGSTER_PUBLIC_URL:-}
      # geo scheduled DB backup (kor-travel-geo T-239, wired 2026-08-18 for issue #177). The API
      # decides run-due (ENABLED/INTERVAL); the Dagster containers execute db_backup and stamp
      # expires_at (TTL) — set the SAME values on geo-api, geo-dagster and geo-dagster-daemon.
      # Defaults mirror kor-travel-geo Settings (off / 24h / 30d / keep 3). prod recommends
      # true/24/7/3. When the retention janitor is RUNNING and successful, retained archives
      # converge near ceil(TTL_DAYS*24 / INTERVAL_HOURS) (~4.7 GB each for the 33 GB geo DB);
      # keep_min is a floor, not a cap.
      KTG_BACKUP_SCHEDULE_ENABLED: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_ENABLED:-false}
      KTG_BACKUP_SCHEDULE_INTERVAL_HOURS: ${KOR_TRAVEL_GEO_BACKUP_SCHEDULE_INTERVAL_HOURS:-24}
      KTG_BACKUP_ARTIFACT_TTL_DAYS: ${KOR_TRAVEL_GEO_BACKUP_ARTIFACT_TTL_DAYS:-30}
      KTG_BACKUP_RETENTION_KEEP_MIN: ${KOR_TRAVEL_GEO_BACKUP_RETENTION_KEEP_MIN:-3}
    ports:
    - ${KOR_TRAVEL_GEO_API_PORT:-12501}:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
    volumes:
    - ${KOR_TRAVEL_GEO_APP_DATA_DIR:-../kor-travel-geo/data}:/data:ro
    # T-290g: shared writable DB-backup dir. The Dagster db_backup op (writer) and this
    # geo-api's restore/download/verify (reader) must resolve the SAME artifacts at the
    # app's backup_allowed_dirs (/app/data/backups). Before this the api mounted only
    # /data:ro, so a Dagster-written backup was invisible to restore (geo #459/#460).
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import urllib.request; urllib.request.urlopen('http://localhost:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}/v1/healthz', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  kor-travel-geo-ui:
    image: ${KOR_TRAVEL_GEO_UI_IMAGE:-kor-travel-geo-ui:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}/kor-travel-geo-ui
    container_name: ${KOR_TRAVEL_GEO_UI_CONTAINER:-kor-travel-geo-ui-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-geo-api:
        condition: service_healthy
    env_file:
    - path: ${KOR_TRAVEL_GEO_UI_ENV_FILE:-.env.kor-travel-geo-ui.local}
      required: false
      format: raw
    environment:
      PORT: ${KOR_TRAVEL_GEO_UI_CONTAINER_PORT:-12505}
      HOSTNAME: 0.0.0.0
      KTG_API_INTERNAL_URL: http://127.0.0.1:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
      NEXT_PUBLIC_API_BASE_URL: ${KOR_TRAVEL_GEO_UI_PUBLIC_API_BASE_URL:-/api/proxy}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
      KTG_VWORLD_API_KEY: ${KOR_TRAVEL_GEO_VWORLD_API_KEY:-}
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_UI_ADMIN_USERNAME: ${KOR_TRAVEL_GEO_UI_ADMIN_USERNAME:-admin}
      KTG_UI_SESSION_SECRET: ${KOR_TRAVEL_GEO_UI_SESSION_SECRET:-}
    ports:
    - ${KOR_TRAVEL_GEO_UI_PORT:-12505}:${KOR_TRAVEL_GEO_UI_CONTAINER_PORT:-12505}
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://localhost:' + (process.env.PORT || '12505')).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  kor-travel-concierge-api:
    image: ${KOR_TRAVEL_CONCIERGE_API_IMAGE:-kor-travel-concierge-api:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}
      dockerfile: Dockerfile.python
    container_name: ${KOR_TRAVEL_CONCIERGE_API_CONTAINER:-kor-travel-concierge-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - api
    - --host
    - 0.0.0.0
    - --port
    - '${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}'
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      # 구 전용 instance는 롤백 안전망으로 계속 띄워 두므로(platform-topology.md
      # §7, concierge 부분 이전) 의존성도 남겨 둔다 — 무해하게 같이 healthy해진다.
      # 실제 DATABASE_URL은 아래 공용 instance를 가리킨다.
      kor-travel-concierge-postgres:
        condition: service_healthy
      kor-travel-concierge-db-init:
        condition: service_completed_successfully
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-concierge:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      # UI BFF와 backend admin proxy는 같은 Manager root authority만 사용한다.
      KTC_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_CONCIERGE_UI_ADMIN_PROXY_SECRET:?KOR_TRAVEL_CONCIERGE_UI_ADMIN_PROXY_SECRET must be explicitly set}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}
      CORS_ALLOW_ORIGINS: '["http://localhost:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}","http://127.0.0.1:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}"]'
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_PUBLIC_BASE_URL: http://127.0.0.1:${RUSTFS_API_PORT:-12101}/${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_CONSOLE_URL: http://127.0.0.1:${RUSTFS_CONSOLE_PORT:-12105}/rustfs/console/
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET_RAW_VIDEOS: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_BUCKET_SUBTITLES: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_BUCKET_FRAMES: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_OBJECT_PREFIX: ${KOR_TRAVEL_CONCIERGE_RUSTFS_PREFIX:-features}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_HEALTH_PATH: /health/live
      MEDIA_RETENTION_POLICY: infinite
      FFMPEG_PATH: /usr/bin/ffmpeg
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
