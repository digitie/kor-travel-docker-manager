name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend httpx==0.28.1 pytest==9.1.1 ruff==0.16.4
      - name: 린트
        run: python -m ruff check --ignore EXE001 backend/src backend/tests scripts
      - name: 테스트
        env:
          TMPDIR: /tmp
        run: python -m pytest -q backend/tests

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run type-check
      - name: 빌드
        run: npm run build
