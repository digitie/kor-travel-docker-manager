  dagster:
    # 공용 Dagster 제어 평면(platform-topology.md §7, dagster-shared-plan §4, ADR-54). 공용 instance
    # 위의 `dagster_shared` DB·role·storage schema(2단계)와 그 위의 daemon(포트 없음)·webserver
    # (`127.0.0.1:11002`)·gateway(11001)(3단계)다. workspace는 `dagster.control_plane: shared`인
    # target에서 파생한다 — 모두 `own`인 동안 비어 있고 plane은 빈 채로 healthy하게 돈다.
    #
    # weather가 합류해(첫 전환) `all`에 든다 — 합류한 target이 있으면 plane이 `all`에 있어야 한다
    # (`test_dagster_shared_workspace_is_derived.py`).
    depends_on: []
    display_name: 공용 Dagster 제어 평면
    description: 공용 PostgreSQL instance(:11000)의 dagster_shared DB·schema와 공용 Dagster daemon·webserver(127.0.0.1:11002)·Basic Auth gateway(:11001)입니다. 합류한 프로젝트의 code-server를 파생 workspace로 봅니다.
    aliases:
      - dagster-shared
      - dagster-control-plane
    # `up -d`가 받는 것은 공용 instance와 세 상시 서비스다(공용 instance는 정의가 그대로라 재생성되지
    # 않는다 — compose config hash가 같다). daemon·webserver는 storage migrate에
    # `service_completed_successfully`로 기대므로 `up -d`가 db-init·migrate를 먼저 돌리고, 둘 중 하나가
    # 실패하면 `up`이 실패한다. 두 one-shot 자체는 여기 두지 않는다(적대 리뷰 M3 — `up -d`에 직접
    # 이름을 주면 종료 코드가 사라진다).
    services:
      - kor-travel-shared-postgres
      - kor-travel-dagster-daemon
      - kor-travel-dagster-webserver
      - kor-travel-dagster-gateway
    # 두 one-shot은 restart=no라 정상 상태가 exited(0)다 — runtime 목록에 두지 않는다(T5).
    runtime_services:
      - kor-travel-dagster-daemon
      - kor-travel-dagster-webserver
      - kor-travel-dagster-gateway
    containers:
      - kor-travel-shared-postgresql
      - kor-travel-dagster-daemon
      - kor-travel-dagster-webserver
      - kor-travel-dagster-gateway
    # one-shot은 init step으로도 **차례대로** 돈다 — 각 `run`의 종료 코드가 ensure를 가른다(rustfs-init
    # 선례, 2단계). 위 `up -d`가 의존으로 이미 돌렸으면 두 번째 실행은 멱등이라 아무것도 바꾸지 않는다
    # (db-init은 role·DB를 확인만 하고, migrate는 head에서 무연산). `--no-deps`: 의존(공용 instance·
    # db-init)을 `run`이 다시 끌어오지 않는다. 호스트 이미지가 없으면(tag가 내용 해시라 내용이 바뀌면
    # 없다) `up`·`run`이 build context에서 만든다.
    init_steps:
      - name: dagster-shared-db-init
        description: 공용 instance에 dagster_shared role·DB를 만들고 CONNECT를 소유 role에게만 남깁니다.
        command:
          - run
          - --rm
          - --no-deps
          - kor-travel-shared-db-init-dagster
      - name: dagster-shared-storage-migrate
        description: dagster_shared의 storage schema를 만들거나 head까지 올립니다.
        command:
          - run
          - --rm
          - --no-deps
          - kor-travel-dagster-storage-migrate

# ── compose bind allowlist (GM-17 본작업 A) ─────────────────────────────
#
# production compose candidate에서 **허용되는 host bind의 정본**이다. 종전에는
# c6c_deployment.py의 `_CANDIDATE_ALLOWED_OPERATOR_BINDS` 상수였고, 그래서 새 bind
# 하나를 더하거나 여섯 번째 프로젝트의 pgdata를 붙이려면 backend 코드 수정 +
# trusted release 재설치가 필요했다(GM-17의 실질 병목). 자리를 여기로 옮기고
# 코드에는 **검증 규칙만** 남긴다.
#
# **이 절은 보안 경계다.** 여기 없는 bind는 candidate 검증이 거부한다
#
# **이 절은 Manager 자신의 후보에만 적용된다.** 키가 (compose service,
# container_path, read_only)뿐이라 프로젝트 차원이 없다 — 형제 프로젝트를 겨냥해
# 여기에 한 줄을 쓰면 같은 이름의 **Manager 서비스**에 대한 allowlist가 넓어진다
# (`prometheus`가 실제로 두 프로젝트에 다 있다). 형제의 bind는 그 저장소가 소유한다.
# ("bind is not in the canonical baseline"). 그래서 이 파일 자체가 신뢰돼야 하고,
# 그 선행조건은 `registry.get_targets_config_path`/`_read_targets_bytes`가 닫았다 —
# trusted 설치본에서는 자리를 env로 옮길 수 없고 root 소유·비쓰기가 강제된다.
# 그것이 초록이 아니었다면 이 이관 자체가 보안 회귀였을 것이다.
#
# 키는 (compose service, container_path, read_only)이고 값은 **compose 문서에 적힌
# 그대로의 host source**다. `${VAR:-default}` 형태를 그대로 둔다 — `_expand_env_path`가
# effective env로 확장해 비교하므로 env만 설정하면 코드 수정 없이 다른 호스트로
# 이식된다.
#
# **기본값의 개인 경로를 지우는 것은 이 작업이 아니다.** 로컬 dev와 n150 prod 둘 다
# 지금 그 기본값에만 의존해 돌고 있어서, 조율 없이 `${VAR:?}`로 필수화하면 다음
# 재시작이 즉시 깨진다(GM-17 검증 노트의 실측). 이 이관은 자리만 옮기고 값은 한 글자도
# 바꾸지 않는다 — 옮기기 전후의 해석된 매핑이 정확히 같다는 것을 테스트가 결박한다.
#
# 서비스 20개 중 6개(one-shot init 넷, db role bootstrap 둘)는 `containers:`에 없다.
# 그래서 컨테이너 정의 안이 아니라 최상위 절로 둔다 — one-shot을 컨테이너 레지스트리에
# 끼워 넣으면 `status`/`ensure`/metrics가 그것을 상시 관리 대상으로 보게 된다.
# (T-307: geo dagster 쌍은 여기서 빠졌다 — code-server 분리를 계기로 `containers:`에
# 정식 등록했다, 원래 `geo` 소유자 몫으로 남아 있던 gap.)

compose_binds:
  kor-travel-concierge-dagster-code-server:
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  grafana:
    - container_path: "/etc/grafana/provisioning/datasources"
      read_only: true
      source: "./config/grafana/provisioning/datasources"
    - container_path: "/var/lib/grafana"
      read_only: false
      source: "${GRAFANA_DATA_DIR:-/home/digitie/kor-travel-geo-data/grafana}"
  kor-travel-geo-api:
    - container_path: "/app/data/backups"
      read_only: false
      source: "${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}"
    - container_path: "/data"
      read_only: true
      source: "${KOR_TRAVEL_GEO_APP_DATA_DIR:-../kor-travel-geo/data}"
  kor-travel-geo-dagster:
    - container_path: "/app/data/backups"
      read_only: false
      source: "${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}"
  kor-travel-geo-dagster-daemon:
    - container_path: "/app/data/backups"
      read_only: false
      source: "${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}"
  kor-travel-geo-dagster-code-server:
    - container_path: "/app/data/backups"
      read_only: false
      source: "${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}"
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  kor-travel-dagster-storage-migrate:
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  kor-travel-dagster-daemon:
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
    - container_path: "/opt/dagster/dagster_home/workspace.yaml"
      read_only: true
      source: "./config/dagster-shared/workspace.yaml"
  kor-travel-dagster-webserver:
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
    - container_path: "/opt/dagster/dagster_home/workspace.yaml"
      read_only: true
      source: "./config/dagster-shared/workspace.yaml"
  kor-travel-dagster-gateway:
    - container_path: "/etc/kor-travel-dagster-gateway/nginx.conf.template"
      read_only: true
      source: "./config/dagster-shared/gateway.conf"
  kor-travel-map-db-role-bootstrap:
    - container_path: "/usr/local/bin/postgres-role-bootstrap"
      read_only: true
      source: "${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}/docker/postgres-role-bootstrap.sh"
    - container_path: "/usr/local/lib/kor-travel-map/database-credential-preflight.sh"
      read_only: true
      source: "${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}/scripts/database-credential-preflight.sh"
  kor-travel-shared-postgres:
    - container_path: "/var/lib/postgresql/data"
      read_only: false
      source: "${KOR_TRAVEL_SHARED_PGDATA:-/home/digitie/kor-travel-shared-data/pgdata}"
  pinvi-dagster-code-server:
    - container_path: "/opt/pinvi/.dagster/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  kor-travel-map-dagster-code-server:
    - container_path: "/opt/dagster/dagster_home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  kor-travel-weather-dagster-code-server:
    - container_path: "/opt/dagster/home/dagster.yaml"
      read_only: true
      source: "./config/dagster-shared/dagster.yaml"
  kor-travel-weather-dagster-webserver:
    - container_path: "/opt/dagster/home/dagster.yaml"
      read_only: true
      source: "${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}/deploy/dagster.yaml"
    - container_path: "/app/deploy/workspace.yaml"
      read_only: true
      source: "./config/kor-travel-weather/workspace.yaml"
  kor-travel-weather-dagster-daemon:
    - container_path: "/opt/dagster/home/dagster.yaml"
      read_only: true
      source: "${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}/deploy/dagster.yaml"
    - container_path: "/app/deploy/workspace.yaml"
      read_only: true
      source: "./config/kor-travel-weather/workspace.yaml"
  kor-travel-weather-dagster-gateway:
    - container_path: "/etc/nginx/conf.d/default.conf"
      read_only: true
      source: "./config/kor-travel-weather/dagster-gateway.conf"
  kor-travel-weather-prometheus:
    - container_path: "/etc/prometheus/prometheus.yml"
      read_only: true
      source: "./config/kor-travel-weather/prometheus.yml"
    - container_path: "/etc/prometheus/weather-rules"
      read_only: true
      source: "${KOR_TRAVEL_WEATHER_REPO_DIR:-../kor-travel-weather}/deploy/prometheus"
    - container_path: "/prometheus"
      read_only: false
      source: "${KOR_TRAVEL_WEATHER_PROMETHEUS_DATA_DIR:-/home/digitie/kor-travel-weather-data/prometheus}"
  prometheus:
    - container_path: "/etc/prometheus/prometheus.yml"
      read_only: true
      source: "./config/prometheus/prometheus.yml"
    - container_path: "/prometheus"
      read_only: false
      source: "${PROMETHEUS_DATA_DIR:-/home/digitie/kor-travel-geo-data/prometheus}"
  rustfs:
    - container_path: "/data"
      read_only: false
      source: "${RUSTFS_DATA_DIR:-/home/digitie/kor-travel-geo-data/rustfs}"
  rustfs-init:
    - container_path: "/opt/kor-travel-docker-manager/ensure-rustfs-buckets.sh"
      read_only: true
      source: "./scripts/ensure-rustfs-buckets.sh"
