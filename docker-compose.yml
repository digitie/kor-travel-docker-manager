      args:
        INSTALL_DAGSTER: "1"
        GIT_COMMIT: ${KOR_TRAVEL_WEATHER_GIT_COMMIT:-unknown}
    container_name: ${KOR_TRAVEL_WEATHER_DAGSTER_WEBSERVER_CONTAINER:-kor-travel-weather-dagster-webserver-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-shared-postgres:
        condition: service_healthy
      kor-travel-shared-db-init-weather:
        condition: service_completed_successfully
      kor-travel-weather-migrate:
        condition: service_completed_successfully
      kor-travel-weather-dagster-code-server:
        condition: service_healthy
    # ⚠️ 14102가 아니다 — dagster-gateway가 이미 공개 14102를 쓴다. weather
    # 대역(14100-14199) 안 미사용 포트 14107로 옮기고 loopback 전용으로 묶는다
    # (gateway 뒤가 아니면 자체 인증이 없다). gateway의 nginx 오버라이드(Manager
    # 소유)가 127.0.0.1:14107로 proxy_pass한다.
    command:
    - dagster-webserver
    - -h
    - "127.0.0.1"
    - -p
    - "14107"
    - -w
    - /app/deploy/workspace.yaml
