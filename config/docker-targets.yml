version: 1

# GM-19: port_policy/port_band 블록을 소비하는 코드가 0건이라 제거했다 — 포트 정책의
# 유일한 정본은 docs/ports.md다.

dependency_order:
  - storage
  - gra
  - cadv
  - prom
  - geo
  - conc
  - map
  - pinvi
  - weather
  # 공용 Dagster 제어 평면(platform-topology.md §7). stage 2에서는 storage만 있다 —
  # `all`에서 빠진다(아래 target 주석).
  - dagster
  # 형제 프로젝트(외부 compose). Manager 자신의 프로젝트보다 뒤에 둔다 — 기동
  # 순서상 앞의 것들에 의존하지 않고, `all`에서 마지막에 오는 것이 읽기 쉽다.
  - transport

containers:
  kor-travel-shared-postgresql:
    name: kor-travel-shared-postgres
    compose_service: kor-travel-shared-postgres
    role: shared-postgresql
    display_name: 공용 제어 평면 PostgreSQL / PostGIS (platform-topology.md §7)
