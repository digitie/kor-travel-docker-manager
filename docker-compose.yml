name: kor-travel-docker-manager

# 네트워크 모드: dev 기본값은 host 이다. host 모드에서는 포트 NAT가 없으므로 각 컨테이너가
# 호스트 정규 포트(12xxx, 5432)에 직접 바인딩하고, 서비스 간 참조는 127.0.0.1:<포트>를 사용한다.
# (KTDM_DOCKER_NETWORK_MODE=bridge 로 바꾸려면 서비스 간 hostname을 컨테이너명으로 되돌려야 한다.)

services:
  kor-travel-geo-postgres:
    image: postgis/postgis:16-3.5
    container_name: kor-travel-geo-postgres
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr}
      POSTGRES_PASSWORD: ${KOR_TRAVEL_GEO_POSTGRES_PASSWORD:-addr}
      POSTGRES_DB: ${KOR_TRAVEL_GEO_POSTGRES_DB:-kor_travel_geo}
      PINVI_POSTGRES_USER: ${PINVI_POSTGRES_USER:-pinvi}
      PINVI_POSTGRES_PASSWORD: ${PINVI_POSTGRES_PASSWORD:-pinvi_dev_password}
      PINVI_POSTGRES_DB: ${PINVI_POSTGRES_DB:-pinvi}
      KOR_TRAVEL_CONCIERGE_POSTGRES_DB: ${KOR_TRAVEL_CONCIERGE_POSTGRES_DB:-kor_travel_concierge}
      KOR_TRAVEL_GEO_STRICT_SOURCE_CHECK: ${KOR_TRAVEL_GEO_STRICT_SOURCE_CHECK:-1}
      KOR_TRAVEL_GEO_SOURCE_DIR: ${KOR_TRAVEL_GEO_SOURCE_DIR:-/data/juso}
    ports:
    - 127.0.0.1:${KOR_TRAVEL_GEO_DB_PORT:-12500}:${KOR_TRAVEL_GEO_DB_PORT:-12500}
    volumes:
    - ${KOR_TRAVEL_GEO_PGDATA:-/home/digitie/kor-travel-geo-data/pgdata-final-20260529}:/var/lib/postgresql/data
    - ${KOR_TRAVEL_GEO_JUSO_DATA:-/mnt/f/dev/kor-travel-geo/data/juso}:/data/juso:ro
    - ./scripts/ensure-kor-travel-geo-db.sh:/docker-entrypoint-initdb.d/010-ensure-kor-travel-geo-db.sh:ro
    - ./scripts/ensure-kor-travel-geo-db.sh:/opt/kor-travel-docker-manager/ensure-kor-travel-geo-db.sh:ro
    - ./scripts/verify-kor-travel-geo-source.sh:/opt/kor-travel-docker-manager/verify-kor-travel-geo-source.sh:ro
    shm_size: 512mb
    command:
    - postgres
    # 통합 인스턴스에서 Geo 전용으로 좁힌 뒤 대역 규칙에 맞춘 포트다(ADR-047: 125xx=geo).
    # `network_mode: host`에서는 `ports:`가 무시되므로 **이 `-p`가 곧 호스트 포트**다.
    - -p
    - ${KOR_TRAVEL_GEO_DB_PORT:-12500}
    # 형제 3개와 같이 loopback만 듣는다. 이 줄이 없으면 기본값 `*`라 **LAN 전체에**
    # 열린다 — 위의 `ports: 127.0.0.1:...`는 host network에서 무시되므로 loopback처럼
    # 보이는 장식일 뿐이고, 실제 경계는 여기서만 정해진다.
    - -c
    - listen_addresses=127.0.0.1
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    - -c
    - shared_buffers=512MB
    - -c
    - work_mem=64MB
    - -c
    - maintenance_work_mem=256MB
    - -c
    - max_wal_size=2GB
    - -c
    - checkpoint_completion_target=0.9
    - -c
    - effective_cache_size=1536MB
    - -c
    - random_page_cost=1.1
    healthcheck:
      test:
      - CMD-SHELL
      # 포트를 명시하지 않으면 기본 5432를 보고 **영원히 unhealthy**가 된다.
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_GEO_DB_PORT:-12500} -U ${KOR_TRAVEL_GEO_POSTGRES_USER:-addr} -d ${KOR_TRAVEL_GEO_POSTGRES_DB:-kor_travel_geo}
      interval: 10s
      timeout: 5s
      retries: 5
  # ADR-047 대역 규칙: 126xx = concierge. 통합 인스턴스에서 분리한 전용 PostGIS다.
  # 분리 근거는 map(ADR-35)과 같다 — role/ACL은 DB가 아니라 **cluster 전역**이라
  # DB만 나눠서는 principal이 격리되지 않는다.
  kor-travel-concierge-postgres:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_CONCIERGE_POSTGRES_CONTAINER:-kor-travel-concierge-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${KOR_TRAVEL_CONCIERGE_POSTGRES_USER:-addr}
      POSTGRES_PASSWORD: ${KOR_TRAVEL_CONCIERGE_POSTGRES_PASSWORD:?KOR_TRAVEL_CONCIERGE_POSTGRES_PASSWORD must be explicitly set}
      # 앱 DB와 다른 중립 이름으로 init한다 — 같은 이름으로 init하면 initdb가 심은
      # 확장과 dump의 확장 배치가 복원에서 충돌한다(map 커토버 실측).
      POSTGRES_DB: ${KOR_TRAVEL_CONCIERGE_POSTGRES_BOOTSTRAP_DB:-ktc_bootstrap}
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=${KOR_TRAVEL_CONCIERGE_POSTGRES_SHARED_BUFFERS:-128MB}
    - -c
    - work_mem=${KOR_TRAVEL_CONCIERGE_POSTGRES_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${KOR_TRAVEL_CONCIERGE_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    - -c
    - effective_cache_size=${KOR_TRAVEL_CONCIERGE_POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    # 통합 인스턴스가 쓰던 값을 그대로 물려받는다. 크기만 데이터에 맞춰 줄였고
    # planner/WAL 성질은 바꾸지 않는다 — 같은 쿼리가 다른 계획을 타면 안 된다.
    - -c
    - random_page_cost=${KOR_TRAVEL_CONCIERGE_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${KOR_TRAVEL_CONCIERGE_POSTGRES_MAX_WAL_SIZE:-1GB}
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    volumes:
    - ${KOR_TRAVEL_CONCIERGE_PGDATA:-/home/digitie/kor-travel-concierge-data/pgdata}:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}:${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_CONCIERGE_DB_PORT:-12600} -U ${KOR_TRAVEL_CONCIERGE_POSTGRES_USER:-addr} -d ${KOR_TRAVEL_CONCIERGE_POSTGRES_BOOTSTRAP_DB:-ktc_bootstrap}
      interval: 10s
      timeout: 5s
      retries: 20

  # ADR-047 대역 규칙: 128xx = PinVi.
  pinvi-postgres:
    image: postgis/postgis:16-3.5
    container_name: ${PINVI_POSTGRES_CONTAINER:-pinvi-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_USER: ${PINVI_POSTGRES_USER:-pinvi}
      POSTGRES_PASSWORD: ${PINVI_POSTGRES_PASSWORD:?PINVI_POSTGRES_PASSWORD must be explicitly set}
      POSTGRES_DB: ${PINVI_POSTGRES_BOOTSTRAP_DB:-pinvi_bootstrap}
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${PINVI_DB_PORT:-12800}
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=${PINVI_POSTGRES_SHARED_BUFFERS:-128MB}
    - -c
    - work_mem=${PINVI_POSTGRES_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${PINVI_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    - -c
    - effective_cache_size=${PINVI_POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    # 통합 인스턴스가 쓰던 값을 그대로 물려받는다. 크기만 데이터에 맞춰 줄였고
    # planner/WAL 성질은 바꾸지 않는다 — 같은 쿼리가 다른 계획을 타면 안 된다.
    - -c
    - random_page_cost=${PINVI_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${PINVI_POSTGRES_MAX_WAL_SIZE:-1GB}
    - -c
    - pg_stat_statements.track=all
    - -c
    - pg_stat_statements.max=10000
    volumes:
    - ${PINVI_PGDATA:-/home/digitie/pinvi-data/pgdata}:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${PINVI_DB_PORT:-12800}:${PINVI_DB_PORT:-12800}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${PINVI_DB_PORT:-12800} -U ${PINVI_POSTGRES_USER:-pinvi} -d ${PINVI_POSTGRES_BOOTSTRAP_DB:-pinvi_bootstrap}
      interval: 10s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kor-travel-rustfs
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:${RUSTFS_CONSOLE_CONTAINER_PORT:-12105}
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
    ports:
    - ${RUSTFS_API_PORT:-12101}:${RUSTFS_API_CONTAINER_PORT:-12101}
    - ${RUSTFS_CONSOLE_PORT:-12105}:${RUSTFS_CONSOLE_CONTAINER_PORT:-12105}
    volumes:
    - ${RUSTFS_DATA_DIR:-/home/digitie/kor-travel-geo-data/rustfs}:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:${RUSTFS_API_CONTAINER_PORT:-12101}/health/live
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  rustfs-init:
    image: minio/mc:latest
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ENDPOINT: http://${KTDM_RUSTFS_INIT_HOST:-127.0.0.1}:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_API_CONTAINER_PORT: ${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      PINVI_RUSTFS_BUCKET: ${PINVI_RUSTFS_BUCKET:-pinvi-media}
      KOR_TRAVEL_GEO_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KRTOUR_MAP_RUSTFS_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
    volumes:
    - ./scripts/ensure-rustfs-buckets.sh:/opt/kor-travel-docker-manager/ensure-rustfs-buckets.sh:ro
    entrypoint:
    - /bin/sh
    - /opt/kor-travel-docker-manager/ensure-rustfs-buckets.sh
  kor-travel-geo-api:
    image: ${KOR_TRAVEL_GEO_API_IMAGE:-kor-travel-geo-api:latest-main-gdal}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}
      dockerfile: docker/api.Dockerfile
    container_name: ${KOR_TRAVEL_GEO_API_CONTAINER:-kor-travel-geo-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-geo-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      PORT: ${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
      KTG_API_HOST: 0.0.0.0
      KTG_PG_DSN: ${KOR_TRAVEL_GEO_DOCKER_PG_DSN:-postgresql+psycopg://addr:addr@127.0.0.1:12500/kor_travel_geo}
      KTG_GEOIP_GATE_MODE: ${KOR_TRAVEL_GEO_GEOIP_GATE_MODE:-off}
      KTG_OPS_TABLE_STATS_CAPTURE_INTERVAL_MINUTES: ${KOR_TRAVEL_GEO_OPS_TABLE_STATS_CAPTURE_INTERVAL_MINUTES:-0}
      KTG_RUSTFS_ENABLED: ${KOR_TRAVEL_GEO_RUSTFS_ENABLED:-1}
      KTG_RUSTFS_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KTG_RUSTFS_BUCKET: ${KOR_TRAVEL_GEO_RUSTFS_BUCKET:-kor-travel-geo}
      KTG_RUSTFS_PREFIX: ${KOR_TRAVEL_GEO_RUSTFS_PREFIX:-kor-travel-geo}
      KTG_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KTG_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KTG_RUSTFS_LOCAL_IMPORT_ROOTS: /data
      KTG_VWORLD_API_KEY: ${KOR_TRAVEL_GEO_VWORLD_API_KEY:-}
      KTG_PUBLIC_API_KEY_CACHE_TTL_S: ${KOR_TRAVEL_GEO_PUBLIC_API_KEY_CACHE_TTL_S:-30}
      KTG_ADMIN_TRUSTED_PROXY_CIDRS: ${KOR_TRAVEL_GEO_ADMIN_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      # Browser-facing Dagster URL the admin API returns for the /admin/dagster iframe/links
      # (T-290). The LAN router reverse-proxies geo-dagster.example.org (TLS) to this
      # host's 127.0.0.1:12502 webserver (external step; same pattern as the other services'
      # *.digitie.mywire.org domains). Backend GraphQL observe stays on the internal
      # KTG_DAGSTER_URL (default 127.0.0.1:12502, SSRF-allowlisted). Dev overrides to internal.
      KTG_DAGSTER_PUBLIC_URL: ${KOR_TRAVEL_GEO_DAGSTER_PUBLIC_URL:-}
    ports:
    - ${KOR_TRAVEL_GEO_API_PORT:-12501}:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
    volumes:
    - ${KOR_TRAVEL_GEO_APP_DATA_DIR:-../kor-travel-geo/data}:/data:ro
    # T-290g: shared writable DB-backup dir. The Dagster db_backup op (writer) and this
    # geo-api's restore/download/verify (reader) must resolve the SAME artifacts at the
    # app's backup_allowed_dirs (/app/data/backups). Before this the api mounted only
    # /data:ro, so a Dagster-written backup was invisible to restore (geo #459/#460).
    - ${KOR_TRAVEL_GEO_BACKUP_DIR:-../kor-travel-geo/data/backups}:/app/data/backups
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        python -c "import urllib.request; urllib.request.urlopen('http://localhost:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}/v1/healthz', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  kor-travel-geo-ui:
    image: ${KOR_TRAVEL_GEO_UI_IMAGE:-kor-travel-geo-ui:latest-main}
    build:
      context: ${KOR_TRAVEL_GEO_REPO_DIR:-../kor-travel-geo}/kor-travel-geo-ui
    container_name: ${KOR_TRAVEL_GEO_UI_CONTAINER:-kor-travel-geo-ui-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-geo-api:
        condition: service_healthy
    env_file:
    - path: ${KOR_TRAVEL_GEO_UI_ENV_FILE:-.env.kor-travel-geo-ui.local}
      required: false
      format: raw
    environment:
      PORT: ${KOR_TRAVEL_GEO_UI_CONTAINER_PORT:-12505}
      HOSTNAME: 0.0.0.0
      KTG_API_INTERNAL_URL: http://127.0.0.1:${KOR_TRAVEL_GEO_API_CONTAINER_PORT:-12501}
      NEXT_PUBLIC_API_BASE_URL: ${KOR_TRAVEL_GEO_UI_PUBLIC_API_BASE_URL:-/api/proxy}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
      KTG_VWORLD_API_KEY: ${KOR_TRAVEL_GEO_VWORLD_API_KEY:-}
      KTG_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_GEO_ADMIN_PROXY_SECRET:-}
      KTG_UI_ADMIN_USERNAME: ${KOR_TRAVEL_GEO_UI_ADMIN_USERNAME:-admin}
      KTG_UI_SESSION_SECRET: ${KOR_TRAVEL_GEO_UI_SESSION_SECRET:-}
    ports:
    - ${KOR_TRAVEL_GEO_UI_PORT:-12505}:${KOR_TRAVEL_GEO_UI_CONTAINER_PORT:-12505}
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://localhost:' + (process.env.PORT || '12505')).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  kor-travel-concierge-api:
    image: ${KOR_TRAVEL_CONCIERGE_API_IMAGE:-kor-travel-concierge-api:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}
      dockerfile: Dockerfile.python
    container_name: ${KOR_TRAVEL_CONCIERGE_API_CONTAINER:-kor-travel-concierge-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - api
    - --host
    - 0.0.0.0
    - --port
    - '${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}'
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      kor-travel-concierge-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}
      CORS_ALLOW_ORIGINS: '["http://localhost:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}","http://127.0.0.1:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}"]'
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_PUBLIC_BASE_URL: http://127.0.0.1:${RUSTFS_API_PORT:-12101}/${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_CONSOLE_URL: http://127.0.0.1:${RUSTFS_CONSOLE_PORT:-12105}/rustfs/console/
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET_RAW_VIDEOS: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_BUCKET_SUBTITLES: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_BUCKET_FRAMES: ${KOR_TRAVEL_CONCIERGE_RUSTFS_BUCKET:-kor-travel-concierge}
      RUSTFS_OBJECT_PREFIX: ${KOR_TRAVEL_CONCIERGE_RUSTFS_PREFIX:-features}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_HEALTH_PATH: /health/live
      MEDIA_RETENTION_POLICY: infinite
      FFMPEG_PATH: /usr/bin/ffmpeg
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}/health',
        timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
  kor-travel-concierge-mcp:
    image: ${KOR_TRAVEL_CONCIERGE_MCP_IMAGE:-kor-travel-concierge-mcp:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}
      dockerfile: Dockerfile.python
    container_name: ${KOR_TRAVEL_CONCIERGE_MCP_CONTAINER:-kor-travel-concierge-mcp-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - mcp
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: '${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}'
      MCP_STREAMABLE_HTTP_PATH: /mcp
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}:${KOR_TRAVEL_CONCIERGE_MCP_PORT:-12602}
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-concierge-scheduler:
    image: ${KOR_TRAVEL_CONCIERGE_SCHEDULER_IMAGE:-kor-travel-concierge-scheduler:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}
      dockerfile: Dockerfile.python
    container_name: ${KOR_TRAVEL_CONCIERGE_SCHEDULER_CONTAINER:-kor-travel-concierge-scheduler-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - python
    - -m
    - ktc.cli
    - scheduler
    env_file:
    - path: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/.env
      required: false
      format: raw
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${KOR_TRAVEL_CONCIERGE_DOCKER_DATABASE_URL:-postgresql+asyncpg://addr:addr@127.0.0.1:12600/kor_travel_concierge}
      RUSTFS_ENABLED: 'true'
      RUSTFS_ENDPOINT: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      APP_ENV: ${KOR_TRAVEL_CONCIERGE_APP_ENV:-local}
      API_AUTH_ENABLED: ${KOR_TRAVEL_CONCIERGE_API_AUTH_ENABLED:-false}
      API_KEYS: ${KOR_TRAVEL_CONCIERGE_API_KEYS:-}
      # 자막 비활성/숏폼 영상은 transcript_api·yt-dlp로 자막을 못 받으므로,
      # faster-whisper 오디오 전사 폴백을 켠다(무거움; env로 제어).
      TRANSCRIPT_WHISPER_ENABLED: ${KOR_TRAVEL_CONCIERGE_WHISPER_ENABLED:-true}
      WHISPER_MODEL_SIZE: ${KOR_TRAVEL_CONCIERGE_WHISPER_MODEL_SIZE:-base}
      FFMPEG_PATH: /usr/bin/ffmpeg
    extra_hosts:
    - host.docker.internal:host-gateway
  kor-travel-concierge-ui:
    image: ${KOR_TRAVEL_CONCIERGE_UI_IMAGE:-kor-travel-concierge-ui:latest-main}
    build:
      context: ${KOR_TRAVEL_CONCIERGE_REPO_DIR:-../kor-travel-concierge}/frontend
    container_name: ${KOR_TRAVEL_CONCIERGE_UI_CONTAINER:-kor-travel-concierge-ui-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    command:
    - npm
    - run
    - dev
    - --
    - --hostname
    - 0.0.0.0
    - --port
    - '${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}'
    depends_on:
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://127.0.0.1:${KOR_TRAVEL_CONCIERGE_API_PORT:-12601}
      BACKEND_API_KEY: ${KOR_TRAVEL_CONCIERGE_BACKEND_API_KEY:-}
      NEXT_PUBLIC_VWORLD_SERVICE_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    ports:
    - ${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}:${KOR_TRAVEL_CONCIERGE_UI_PORT:-12605}
  # #171 / ADR-35 — Map state principal의 ownership/ACL은 통합 PostgreSQL과
  # 공유할 수 없다. host network에서 `12700` loopback만 listen하는 전용 instance다.
  # (ADR-047 대역 규칙에 맞춰 2026-08-17에 12703 -> 12700으로 옮겼다: 127xx=map.)
  kor-travel-map-postgres:
    image: postgis/postgis:16-3.5
    container_name: ${KOR_TRAVEL_MAP_POSTGRES_CONTAINER:-kor-travel-map-postgres}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    environment:
      POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set}
      # bootstrap superuser password는 long-lived Config.Env가 아니라 Docker secret
      # file로만 전달한다. role bootstrap one-shot만 DSN에 credential을 보관한다.
      POSTGRES_PASSWORD_FILE: /run/secrets/kor-travel-map-postgres-password
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -p
    - ${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}
    # 아래 값은 2026-08-15 커토버에서 **실측한 원본 인스턴스 설정**이다. 빠뜨리면
    # 조용히 달라진다 — 확장은 로드되지 않은 채 CREATE만 성공하고, 튜닝값은 기본값으로
    # 떨어져 같은 쿼리가 다른 계획을 탄다.
    #
    # - pg_prewarm: 부팅 후 buffer warm-up (T-102). 저장소 standalone compose도 켠다.
    # - pg_stat_statements: 원본 인스턴스가 쓰던 것. `public`에 확장이 설치돼 있어
    #   라이브러리가 없으면 그 확장이 반쪽이 된다.
    - -c
    - shared_preload_libraries=pg_prewarm,pg_stat_statements
    - -c
    - pg_prewarm.autoprewarm=on
    - -c
    - shared_buffers=${KOR_TRAVEL_MAP_POSTGRES_SHARED_BUFFERS:-512MB}
    - -c
    - work_mem=${KOR_TRAVEL_MAP_POSTGRES_WORK_MEM:-64MB}
    - -c
    - maintenance_work_mem=${KOR_TRAVEL_MAP_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    - -c
    - effective_cache_size=${KOR_TRAVEL_MAP_POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
    # 원본 인스턴스 실측값. 빠지면 기본값(4 / 1GB)으로 떨어져 PostGIS 인덱스 스캔
    # 선택과 체크포인트 빈도가 달라진다 — 주석이 '실측 원본'이라 주장하면서 실제로
    # 이 둘을 빠뜨리고 있었다(2026-08-17 적대 리뷰).
    - -c
    - random_page_cost=${KOR_TRAVEL_MAP_POSTGRES_RANDOM_PAGE_COST:-1.1}
    - -c
    - max_wal_size=${KOR_TRAVEL_MAP_POSTGRES_MAX_WAL_SIZE:-2GB}
    volumes:
    - ${KOR_TRAVEL_MAP_PGDATA:-/home/digitie/kor-travel-map-data/pgdata}:/var/lib/postgresql/data
    secrets:
    - source: kor-travel-map-postgres-password
      target: kor-travel-map-postgres-password
    ports:
    - 127.0.0.1:${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}:${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p ${KOR_TRAVEL_MAP_POSTGRES_PORT:-12700} -U ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set} -d ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      interval: 10s
      timeout: 5s
      retries: 20

  # Dagster metadata DB는 Map application role bootstrap의 대상이 아니므로 별도의
  # Manager one-shot으로만 생성하고, F1D reset 뒤에는 metadata owner를 다시 고정한다.
  kor-travel-map-dagster-db-init:
    profiles:
    - bootstrap
    image: postgres:16-alpine
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:?KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:?KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:?KOR_TRAVEL_MAP_DAGSTER_METADATA_USER must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:?KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD must be explicitly set}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      for identifier in "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER"; do
        case "$$identifier" in
          '' | *[!A-Za-z0-9_]* | [!A-Za-z_]* )
            echo "invalid PostgreSQL identifier" >&2; exit 1 ;;
        esac
      done
      psql "$$KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN" --dbname postgres --set ON_ERROR_STOP=1 \
        --set dagster_db="$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" \
        --set metadata_user="$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" \
        --set metadata_password="$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD" <<'SQL'
      SELECT format(
        'CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION PASSWORD %L',
        :'metadata_user',
        :'metadata_password'
      )
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'metadata_user')
      \gexec
      SELECT format(
        'ALTER ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION PASSWORD %L',
        :'metadata_user',
        :'metadata_password'
      )
      \gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'dagster_db', :'metadata_user')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'dagster_db')
      \gexec
      SELECT format('ALTER DATABASE %I OWNER TO %I', :'dagster_db', :'metadata_user')
      \gexec
      SQL

  # Map 정본 스크립트를 source staging path에서 read-only로 실행한다. profile 밖의
  # `compose up`에는 포함되지 않으며 Manager는 `run --rm`으로만 호출한다.
  kor-travel-map-db-role-bootstrap:
    profiles:
    - bootstrap
    image: postgres:16-alpine
    restart: "no"
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_ENABLED: "true"
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE: ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:?KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:?KOR_TRAVEL_MAP_POSTGRES_DB must be explicitly set}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:?KOR_TRAVEL_MAP_POSTGRES_USER must be explicitly set}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:?KOR_TRAVEL_MAP_MIGRATOR_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:?KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD must be explicitly set}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD must be explicitly set}
    volumes:
    - ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}/docker/postgres-role-bootstrap.sh:/usr/local/bin/postgres-role-bootstrap:ro
    entrypoint:
    - /bin/sh
    - /usr/local/bin/postgres-role-bootstrap

  kor-travel-map-api:
    image: ${KOR_TRAVEL_MAP_API_IMAGE:-kor-travel-map-api:latest-main}
    build:
      context: ${KOR_TRAVEL_MAP_REPO_DIR:-../kor-travel-map}
      dockerfile: docker/api.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
    container_name: ${KOR_TRAVEL_MAP_API_CONTAINER:-kor-travel-map-api-latest}
    restart: unless-stopped
    network_mode: ${KTDM_DOCKER_NETWORK_MODE:-host}
    depends_on:
      kor-travel-map-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kor-travel-geo-api:
        condition: service_healthy
      kor-travel-concierge-api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_API_HOST: 0.0.0.0
      KOR_TRAVEL_MAP_API_PORT: ${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}
      KOR_TRAVEL_MAP_API_CORS_ALLOW_ORIGINS: '["${KTDM_PROD_URL_MAP:-http://localhost:${KOR_TRAVEL_MAP_UI_PORT:-12705}}","http://localhost:${KOR_TRAVEL_MAP_UI_PORT:-12705}","http://127.0.0.1:${KOR_TRAVEL_MAP_UI_PORT:-12705}"]'
      KOR_TRAVEL_MAP_API_DAGSTER_URL: http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_CONTAINER_PORT:-12702}
      # admin API가 클라이언트(admin UI / C7 게이트)에 노출하는 Dagster GraphQL endpoint는
      # 내부(127.0.0.1)가 아니라 공개 https origin이어야 한다(ops-c7-schedule-write의
      # canonicalGraphqlSha256이 https 강제). 서버측 호출용 DAGSTER_URL(내부)과 분리해
      # KTDM_PROD_URL_MAP_DAGSTER에서 파생한다. dev(미설정)면 내부로 fallback.
      KOR_TRAVEL_MAP_API_DAGSTER_GRAPHQL_URL: ${KTDM_PROD_URL_MAP_DAGSTER:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_CONTAINER_PORT:-12702}}/graphql
      # allowlist에 공개 dagster host를 추가해야 위 공개 graphql_url이 SSRF 검증을 통과한다.
      KOR_TRAVEL_MAP_API_DAGSTER_ALLOWED_HOSTS: '["kor-travel-map-dagster","127.0.0.1","localhost","::1"${KTDM_PROD_MAP_DAGSTER_HOST:+,"${KTDM_PROD_MAP_DAGSTER_HOST}"}]'
      # reloadRepositoryLocation(schedule cron override 반영 시 호출)은 code location을
      # 다시 로드하며 완료까지 ~4s+ 걸린다. 기본 3s 타임아웃으로는 이 reload가 timeout(503)돼
      # C7 ops-c7-schedule-write의 cron 단계가 실패한다. 상한(30s) 내에서 여유를 준다.
      KOR_TRAVEL_MAP_API_DAGSTER_REQUEST_TIMEOUT_SECONDS: "30"
      KOR_TRAVEL_MAP_API_PROFILE: production
      KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED: 'true'
      KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED: 'false'
      # ADR-25/T-040 — production feature 관리 REST는 image default가 아니라
      # review된 Manager source가 명시적으로 활성화한다.
      KOR_TRAVEL_MAP_API_FEATURES_ROUTES_ENABLED: 'true'
      # ADR-24/T-038 — standalone Map은 destructive default false다. Manager가
      # 관리하는 production runtime만 review된 source에서 명시적으로 승인한다.
      KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED: 'true'
      KOR_TRAVEL_MAP_API_PROMETHEUS_METRICS_ENABLED: 'false'
      KOR_TRAVEL_MAP_API_ADMIN_TRUSTED_PROXY_CIDRS: '["127.0.0.1/32","::1/128"]'
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_API_SERVICE_TOKEN: ${KOR_TRAVEL_MAP_API_SERVICE_TOKEN:?KOR_TRAVEL_MAP_API_SERVICE_TOKEN must be explicitly set}
      KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET: ${KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET:?KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET must be explicitly set}
      KOR_TRAVEL_MAP_API_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED: ${KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED:?KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED must be explicitly set}
      # T-VN-40 canonical snapshot 검증은 digest만 소비한다. 원시 PinVi token은
      # Map API·UI·Dagster·bootstrap 어디에도 전달하지 않는다.
      KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256:-}
      KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256:-}
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:?KOR_TRAVEL_MAP_MIGRATOR_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN must be explicitly set}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: 'true'
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:${RUSTFS_API_CONTAINER_PORT:-12101}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KRTOUR_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL: ${KTDM_PROD_URL_S3_API:-http://127.0.0.1:${RUSTFS_API_PORT:-12101}}/${KRTOUR_MAP_RUSTFS_BUCKET:-krtour-map}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KRTOUR_MAP_OFFLINE_UPLOAD_BUCKET:-krtour-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KRTOUR_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_DOCKER_GEO_BASE_URL:-http://127.0.0.1:12501}
      # issue #114 — reverse_geocoder가 map dagster의 전역 필수 리소스라 이 key 없이는
      # provider ETL job 전체가 fail-close된다(GeoAuthNotConfiguredError). API 자체는
      # geo client를 직접 쓰지 않지만 세 서비스를 동일하게 결선해 drift를 막는다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY}
      # issue #111 — Map image의 alembic head가 v2 pinned deployment input과 다르면
      # DB 연결 전에 기동을 거부한다. 이 값은 installer가 canonical env에 명시하며,
      # 빈 값이나 Compose 기본값은 허용하지 않는다.
      KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD: ${KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD:?KOR_TRAVEL_MAP_MIGRATION_EXPECTED_HEAD must be explicitly set}
    ports:
    - ${KOR_TRAVEL_MAP_API_PORT:-12701}:${KOR_TRAVEL_MAP_API_CONTAINER_PORT:-12701}
    healthcheck:
      test:
      - CMD-SHELL
      - >-
