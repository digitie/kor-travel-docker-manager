# 공용 Dagster webserver·daemon의 workspace — **파생물이다. 손으로 고치지 않는다**(ADR-54).
#
# `config/docker-targets.yml`에서 `dagster.control_plane: shared`인 target의 code-server
# (`dagster api grpc`) command에서 만든다: `host`는 127.0.0.1(host network), `port`는 `-p`의 compose
# 기본값, `location_name`은 `--location-name`이 있으면 그 값, 없으면 `-m` 모듈이다. 순서는
# `dependency_order`를 따른다.
#
# `backend/tests/test_dagster_shared_workspace_is_derived.py`가 이 파일을 다시 만들어 대조한다 —
# 어긋나면 그 테스트가 넣어야 할 내용 전체를 보여 준다. 모든 target이 `own`인 동안 목록은 비어 있고,
# 공용 webserver·daemon은 빈 plane으로 healthy하게 돈다.
load_from:
- grpc_server:
    host: 127.0.0.1
    port: 12803
    location_name: pinvi.etl.definitions
- grpc_server:
    host: 127.0.0.1
    port: 14106
    location_name: kortravelweather_dagster.definitions
