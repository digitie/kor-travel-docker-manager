      - python-krtour-map
    # Map DB는 공용 instance(kor-travel-shared-postgres)에 산다(ADR-53). Map 전용 instance는
    # 퇴역했다. Map은 db-init one-shot이 없다 — DB는 재구축이 instance admin으로 fresh
    # bootstrap한다.
    services:
      - kor-travel-shared-postgres
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster-code-server
    # 옛 webserver·daemon은 공용 plane 전환(ADR-54)으로 `legacy-dagster` profile에 있다 — `up`에 이름을 주면
    # 꺼진 profile도 뜨므로 `services`·`runtime_services`에서 뺐다. `containers`에는 남아 상태 화면이
    # 찾는다(되돌리기는 지원하지 않는다 — platform-topology.md §7 4단계).
    runtime_services:
      - kor-travel-map-api
      - kor-travel-map-ui
      - kor-travel-map-dagster-code-server
    containers:
      - kor-travel-shared-postgresql
      - rustfs
