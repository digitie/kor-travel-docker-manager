      - kor-travel-map-dagster-code-server
      - kor-travel-map-dagster-daemon
    init_steps: []
    # 필드 설명은 geo target에 있다. Map API의 `KOR_TRAVEL_MAP_API_DAGSTER_ALLOWED_HOSTS`(host
